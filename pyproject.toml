[project]
name = "multicell-blueprint"
version = "0.0.0"
description = "Process-bigraph research workspace"
requires-python = ">=3.12"
dependencies = [
    # The simulator for this workspace, extracted into its own distribution and
    # pinned by git tag (tag == version == the per-study `simulator.ref`). It
    # provides the `viva_multicell_blueprint` package (import name unchanged) plus
    # the mechanical/subcellular engine stack, so the composite/process dotted
    # paths the studies cite resolve from it.
    "viva-multicell-blueprint-sim",
    # Floor: 1.8.5 ships the composite `core_extensions` mechanism (1.8.0) the
    # dashboard relies on AND the emitter fix (#217) + `requests`/`fire` server
    # deps. Below this, composite type-registration and agent-embedded emits
    # break — the root cause behind the map[...] type errors seen in the field.
    "process-bigraph>=1.8.5",
    "bigraph-schema>=1.8.1",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "pandas",
    # The xarray emitter (how runs persist cell_counts) needs the Rust zarr v3
    # writer `zarrs` + `bottleneck`, which live in viva-emitters' `[dev]` extra —
    # not `[xarray]` — so they are not pulled by the workbench's
    # viva-emitters[xarray] request. Declare them here so a plain `uv sync`
    # (CI, a fresh machine, the republish-with-runs) can actually run a blueprint.
    "zarrs>=0.2",
    "bottleneck>=1.3",
    # Web-based workspace dashboard (server + templates + assets + lib helpers).
    # Extracted from viva-template as of v0.4.16; provides the `vivarium-workbench
    # serve` CLI invoked by scripts/serve.sh.
    "vivarium-workbench",
    # The three mechanical backends this workspace runs a blueprint on side-by-side.
    # viva-cpm = Cellular Potts (Rust core, maturin build); vivarium-tyssue =
    # vertex model (wraps the vivatyssue fork); viva-munk = center-based 2D physics
    # (pymunk rigid bodies). All via git (never committed path).
    "viva-cpm",
    "vivarium-tyssue",
    # viva-munk = center-based (pymunk) mechanics backend. Its real runtime import
    # is `viva_superpowers` (already a dep); its metadata still pins the pre-rename
    # `pbg-superpowers` dist, which we neutralize via override-dependencies below
    # (that dist's module is provided by viva-superpowers). pymunk is its one new
    # binary dep (manylinux/macos wheels on PyPI -- no local build).
    "viva-munk",
    "pymunk",
    # subcellular "tellurium" module (RoadRunner ODE per cell); on PyPI.
    "viva-tellurium>=0.2.3",
    # vivarium-tyssue@master does NOT declare tyssue in its runtime deps, and we
    # use tyssue directly (Voronoi mesh build, the ActiveMigration effector), so
    # pin the pandas-3 fork explicitly here (source below).
    "tyssue",
    "numpy",
    "scipy",
    "scikit-image",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
cli = ["typer", "rich"]
# Smoldyn particle engine (bounded-particles composite + the Studio's particle
# subcellular layer). An EXTRA, not a core dep. Smoldyn's `py3-none-any` wheels
# mis-bundle a single version-specific `.so`: plain `smoldyn` on macOS arm64 py3.12
# resolves to a build carrying a cp314 binary that won't import. Specific dev builds
# DO ship a cp312 macOS binary — pin one on macOS so `.[particles]` runs Smoldyn
# in-process; Linux keeps the manylinux wheel. (The SmoldynRunner py3.11 bridge via
# SMOLDYN_PYTHON remains a fallback for envs without a cp312 wheel.)
particles = [
    "smoldyn==2.77.dev202610282210; sys_platform=='darwin'",
    "smoldyn; sys_platform!='darwin'",
]

[project.scripts]
multicell-blueprint = "viva_multicell_blueprint.cli.__main__:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow ecosystem git-direct-reference deps (viva-superpowers / vivarium-workbench
# @ git+https://…) that workspaces commonly add — hatchling rejects them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

# This repo is now an INVESTIGATION WORKSPACE, not a package: the simulator
# (`viva_multicell_blueprint`) was extracted into its own distribution
# `viva-multicell-blueprint-sim`, pinned by git tag below and in each study's
# `simulator:` field. There is no package tree to build here, so the wheel
# target selects nothing (a metadata-only wheel).
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv]
# vivarium-tyssue still pins the workbench by its pre-rename URL
# (vivarium-dashboard.git), which uv treats as a different direct URL for the
# same `vivarium-workbench` package → a conflict. Force one resolution.
override-dependencies = [
    "vivarium-workbench @ git+https://github.com/vivarium-collective/vivarium-workbench.git@main",
    # Same conflict for viva-superpowers (bare URL from workbench vs @main
    # elsewhere). Force a single URL for the whole graph.
    "viva-superpowers @ git+https://github.com/vivarium-collective/viva-superpowers.git@main",
    # viva-munk@main still pins the pre-rename `pbg-superpowers` dist in its
    # metadata, but imports the rebranded `viva_superpowers` module at runtime
    # (already installed). Pin the last pbg-superpowers release so resolution is
    # deterministic rather than letting it float.
    "pbg-superpowers==0.23.0",
    # vivarium-workbench @main requires viva-emitters[sqlite,...]>=0.4.3, but the
    # sqlite extra is only on PyPI's viva-emitters <0.4.3, so a fresh resolve is
    # unsatisfiable. Force viva-emitters to its git @main (0.4.5, extras intact).
    # Carry the extras workbench requests (sqlite,xarray,parquet): a bare
    # `viva-emitters @ <url>` override REPLACES workbench's
    # `viva-emitters[sqlite,xarray,parquet]` request and silently drops the
    # extras, so the xarray emitter's runtime deps (unum, fsspec, …) never
    # resolve and every run that persists through it dies on ModuleNotFoundError.
    "viva-emitters[sqlite,xarray,parquet] @ git+https://github.com/vivarium-collective/viva-emitters.git@main",
]

[tool.uv.sources]
# The extracted simulator, pinned by git tag (plain-version: tag == version ==
# each study's `simulator.ref`).
viva-multicell-blueprint-sim = { git = "https://github.com/vivarium-collective/viva-multicell-blueprint-sim.git", tag = "0.1.0" }
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
# vivarium-workbench main depends on viva-superpowers by a bare git URL while
# other deps pin it @main → uv sees conflicting URLs for the same package.
# Unify every reference to the main branch here (top-level sources win).
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }
viva-cpm = { git = "https://github.com/vivarium-collective/viva-cpm.git", branch = "main" }
viva-munk = { git = "https://github.com/vivarium-collective/viva-munk.git", branch = "main" }
vivarium-tyssue = { git = "https://github.com/vivarium-collective/vivarium-tyssue.git", branch = "master" }
# vivarium-tyssue depends on the pandas-3 tyssue fork, but uv only honors
# [tool.uv.sources] from the TOP-LEVEL project — so the fork pin must live here,
# not only in vivarium-tyssue's own pyproject, or stock PyPI tyssue 1.1.0 (which
# lacks ActiveMigration and crashes on real topology ops) would be resolved.
tyssue = { git = "https://github.com/vivarium-collective/vivatyssue.git" }
