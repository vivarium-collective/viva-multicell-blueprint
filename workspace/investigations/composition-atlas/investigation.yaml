scientific_argument:
  main_claim: |
    A model's SEMANTICS (its chemistry/logic) are separable from its MECHANICS (the solver that runs it) at every scale, so the same few simulators compose in many directions through small, typed coupling contracts: several sub-cellular simulators couple inside one cell (a product threshold pins a Boolean input; a particle count sets an ODE rate; a Boolean output gates a reaction), a cell is itself a coupled composite, and a tissue of such cells couples the sub-cellular scale back to mechanics — a cell's own metabolism->fate chain decides when the tissue divides.
  supporting_points:
  - 'coupled-fate-oscillator: an ODE metabolism and a MaBoSS fate network oscillate when coupled both
    ways (modes A+C) — code-graded, 26 fate transitions.'
  - 'coupled-particle-catalysis: a Smoldyn particle count sets an ODE rate (mode B), so the product accumulates
    (P=285) — code-graded.'
  - 'coupled-triple-cell: all three formalisms + all three modes cycle in one cell (22 fate transitions)
    — code-graded.'
  - "fateful-tissue: a dividing tyssue's divisions are driven by each cell's fate chain (20 divisions,
    non-collapse, particles conserved) — code-graded."
  counterargument: |
    The pass thresholds are directional existence/sign checks, not pre-registered quantitative acceptance bands with holdouts; the quantitative shapes are shown in the visualizations but not yet gated to a tolerance. So the claim is demonstrated as feasible and self-consistent, not calibrated against external data.
biological_story: |
  The compositions are small cartoons of real cell biology, assembled from interchangeable solvers rather than one monolithic model. Metabolism builds an internal pool (A+B->C); when the pool is replete a fate network commits the cell to divide; division consumes the pool and resets the metabolism — a metabolism<->fate feedback loop that paces the cell cycle. A particle population standing in for a signalling species can accelerate that metabolism by mass action (more molecules, faster conversion), coupling stochastic spatial chemistry to a continuous ODE. In the tissue, each cell carries this whole chain and grows as it metabolises; when its own fate network fires, the tissue divides it and partitions its confined molecules into the two daughters, which reset and regrow. The point is not quantitative fidelity to a specific organism but the MECHANISM of composition: the same metabolism->fate->division logic, and the same reaction-diffusion-in-a-moving-boundary coupling, recur at every scale and can be built from whichever solver fits each piece.
