schema_version: 2
name: influenza-crossparadigm
title: "Influenza cross-paradigm — one Sego 2022 blueprint, two mechanical substrates"
created: "2026-10-27"
status: running
lead: eran

question: >
  Can ONE backend-neutral blueprint express the whole Sego 2022 influenza model
  (ViralInfectionVTM) and run it faithfully on two different mechanical substrates
  — a Cellular Potts model (viva-cpm) and a vertex model (vivarium-tyssue) — and
  where do the two substrates agree vs diverge when the shared mechanism is driven
  live?

hypothesis: >
  Because the field / rules / systemic-ODE / latent-pool recruitment mechanism is
  compiled BYTE-FOR-BYTE identically onto both backends and only the single
  mechanics node differs, cell-FATE dynamics should be nearly backend-independent,
  while SPATIAL morphology should diverge — each substrate samples the shared field
  at its own cell centroid and measures cell-cell contact through its own geometry.
  Divergence is therefore expected and is a finding about the substrate, not a bug.

description: |
  This investigation is the capstone of the `viva-multicell-blueprint` build: it
  ties together the backend-neutral blueprint (Task 17), the `compile(blueprint,
  backend)` compiler (Task 13), both real backends running the full model (fields
  Task 6, rules Task 7, systemic ODE fed live by CellCountStep Task 21, immune
  recruitment via latent-pool activation Task 20, real footprints Task 19), the
  comparison layer (`viva_multicell_blueprint.compare` — identity, raster, metrics)
  and the three interactive figures (`viva_multicell_blueprint.viz`).

  **Blueprint update.** The recruitment design (Task 20) activates a PRE-PLACED
  LATENT immune pool, so the Sego blueprint's `initial_state` now pre-places 12
  size-25 latent immune cells (M/NK/CD8_latent) at the tissue margins via
  `extra_blocks`; the `infected_seed` is scoped to the main epithelial block so the
  latent pool never changes the infected count. All cells are size 25 (size-9 cells
  dissolve). Parameters stay faithful to Sego 2022 params.yaml @ b952eec2.

  **Runnable artifact.** `viva_multicell_blueprint.composites.sego_crossparadigm`
  (a `@composite_generator`, parameterized by `backend` and `blueprint`) is the
  baseline composite for every study and drives the dashboard Composite Explorer.

  **Reduced scale.** Every study runs at a TRACTABLE reduced scale (a 50x50-site
  patch, a 6x6 epithelial block) so the runs actually complete; this is a
  demonstration, not paper scale. The comparison is reproducible (fixed seeds).

  **Anti-goal respected.** No parameter is tuned to force the two backends to
  agree. Honest divergence is reported.

studies:
  - adhesion-calibration
  - initial-state-fidelity
  - flu-lung-crossparadigm
  - dose-response-crossparadigm

at_a_glance:
  - study: adhesion-calibration
    role: >
      §9.1. Mechanics-only sheet on both backends; sweep the neutral adhesion ->
      (CPM J, vertex tension). Comparable shape stats (mean area 23.6 CPM / 34.9
      vertex, CV 0.10 / 0.06); the J<->tension mapping is DIRECTIONAL, not pinned
      (vertex CV spread < 0.01 across scale). tension_scale = 1.0 retained.
  - study: initial-state-fidelity
    role: >
      §9.2. Both backends reproduce the blueprint t=0 state. CPM exact (centroid
      RMS 0.000 um); vertex clean 1:1 (fraction_clean 1.0, 0 unmapped) with a
      sub-cell residual (RMS 1.21 um). 48/48 type match on both.
  - study: flu-lung-crossparadigm
    role: >
      §9.3 CAPSTONE. Full Sego model on both backends; three comparison families +
      three figures. Headline: cell fate is backend-neutral (per-cell agreement
      0.955 at N=400), morphology diverges (infected-patch IoU 0.07, SSIM 0.09).
      Divergence is a finding — the mechanical substrate is the sole difference.
  - study: dose-response-crossparadigm
    role: >
      §9 stretch. Sweep initial viral load; both substrates agree on the MONOTONE
      DIRECTION (final infected 1/3/7 CPM, 0/2/5 vertex) — a directional, not
      magnitude, agreement.

acceptance_criteria:
  - study: adhesion-calibration
    behavior: >
      A mechanics-only sheet reaches comparable cell-shape statistics on both
      backends, and the neutral-adhesion -> (J, tension) mapping is recorded
      (directional at this scale).
  - study: initial-state-fidelity
    behavior: >
      Both backends reproduce the t=0 centroids/sizes/types; the vertex 1:1 residual
      is reported and is clean (fraction_clean = 1.0).
  - study: flu-lung-crossparadigm
    behavior: >
      The full Sego blueprint runs on BOTH backends at reduced scale; per-cell
      agreement, dynamics-with-band, and spatial-pattern + occupancy IoU are all
      computed, the three figures render under the inline cap, and the agree/diverge
      result is reported honestly.
  - study: dose-response-crossparadigm
    behavior: >
      Both backends agree on the monotone direction of infection vs initial viral
      load.

executive:
  what_is_this: >
    The capstone cross-paradigm demonstration: one backend-neutral Sego 2022
    influenza blueprint, compiled and run on both a Cellular Potts and a vertex
    substrate, with a full three-family comparison and three interactive figures.
  verdict: >
    The architecture holds. One blueprint runs the FULL Sego model (fields, rules,
    live systemic ODE, latent-pool recruitment) on both backends, and because the
    mechanism is shared byte-for-byte the only source of cross-paradigm difference
    is the mechanical substrate. The result is exactly that: cell-FATE dynamics are
    nearly backend-independent (per-cell agreement 0.955 at the N=400 demonstration
    scale, 0.994 at CI scale; dose-response direction identical on both), while
    SPATIAL morphology diverges (infected-patch occupancy IoU 0.07, SSIM 0.09;
    I-patch area 119 vs 229 px). Initial-state fidelity is exact on CPM and a clean
    1:1 on vertex; the adhesion J<->tension mapping is directional. Divergence is
    reported as a finding, never tuned away. Known limits: the recruitment
    latent-pool approximation (T20-RECRUIT), the reduced scale, the producer-less
    ODE inputs V/L/C/F (Task 21), and the directional adhesion calibration.
  verdict_status: preliminary
  decisions_needed:
    - "ODE inputs V/L/C/F have no producer (Task 21) — the immune arm is barely exercised at this scale; land the producers to drive recruitment."
    - "Immune recruitment is a latent-pool approximation (T20-RECRUIT) — confirm this is the intended mechanism or replace with topology insertion."
    - "Sego acceptance bands are the CPM stochastic envelope, not digitized Sego 2022 figures — digitize the paper curves for a literature band."
    - "The J<->tension calibration is directional, not pinned — decide whether a sharper calibration (larger sheet) is worth it."

glossary:
  - term: cross-paradigm
    definition: Running the same model on two different mechanical substrates (CPM voxel vs vertex polygon) and comparing.
  - term: latent pool
    definition: Pre-placed resting immune cells (M/NK/CD8_latent) at the tissue margin that recruitment activates in place (type switch), rather than inserting new topology.
  - term: per-cell agreement
    definition: Fraction of the t0 cohort in the same state (type, or alive-vs-dead) at each step across the two backends.
  - term: occupancy IoU
    definition: Intersection-over-union of the two backends' rasterized cell footprints (CPM voxel occupancy vs vertex face polygons).
