schema_version: 2
name: influenza-crossparadigm
title: "Influenza cross-paradigm — one Sego 2022 blueprint, three mechanical substrates"
created: "2026-10-27"
status: running
lead: eran

question: >
  Can ONE backend-neutral blueprint express the whole Sego 2022 influenza model
  (ViralInfectionVTM) and run it faithfully on three different mechanical substrates
  — a Cellular Potts model (viva-cpm), a vertex model (vivarium-tyssue), and a
  center-based model (viva-munk) — and where do the substrates agree vs diverge when
  the shared mechanism is driven live?

hypothesis: >
  Because the field / rules / systemic-ODE / latent-pool recruitment mechanism is
  compiled BYTE-FOR-BYTE identically onto all three backends and only the single
  mechanics node differs, cell-FATE dynamics should be nearly backend-independent,
  while SPATIAL morphology should diverge — each substrate samples the shared field
  at its own cell centroid and measures cell-cell contact through its own geometry.
  Divergence is therefore expected and is a finding about the substrate, not a bug.
  (Confirmed three-way: fate agreement is statistically EQUIVALENT across all three
  paradigm pairs, while spatial agreement is not — and the center-based model, which
  is not calibrated to the other two, is the most spatially divergent of the three.)

description: |
  This investigation is the capstone of the `viva-multicell-blueprint` build: it
  ties together the backend-neutral blueprint (Task 17), the `compile(blueprint,
  backend)` compiler (Task 13), both real backends running the full model (fields
  Task 6, rules Task 7, systemic ODE fed live by CellCountStep Task 21, immune
  recruitment via latent-pool activation Task 20, real footprints Task 19), the
  comparison layer (`viva_multicell_blueprint.compare` — identity, raster, metrics)
  and the three interactive figures (`viva_multicell_blueprint.viz`).

  **Blueprint update.** The recruitment design (Task 20) activates a PRE-PLACED
  LATENT immune pool, so the Sego blueprint's `initial_state` now pre-places 12
  size-25 latent immune cells (M/NK/CD8_latent) at the tissue margins via
  `extra_blocks`; the `infected_seed` is scoped to the main epithelial block so the
  latent pool never changes the infected count. All cells are size 25 (size-9 cells
  dissolve). Parameters stay faithful to Sego 2022 params.yaml @ b952eec2.

  **Runnable artifact.** `viva_multicell_blueprint.composites.sego.sego_crossparadigm`
  (a `@composite_generator`, parameterized by `backend` and `blueprint`) is the
  baseline composite for every study and drives the dashboard Composite Explorer.

  **Reduced scale.** Every study runs at a TRACTABLE reduced scale (a 50x50-site
  patch, a 6x6 epithelial block) so the runs actually complete; this is a
  demonstration, not paper scale. The comparison is reproducible (fixed seeds).

  **Third paradigm (center-based).** A third mechanical substrate — a center-based
  model (viva-munk / pymunk: each cell a circular rigid body, area-matched to the
  blueprint `size`) — is now compiled from the SAME canonical blueprint via
  `local:MunkBackend`, visualized as a third panel in every spatial playback, and
  scored PAIRWISE (cpm↔vertex, cpm↔munk, vertex↔munk) in the equivalence and
  counterfactual studies. It is deliberately NOT calibrated to the other two
  (docs/mechanics.md §3), so it is a genuinely independent representation.

  **Anti-goal respected.** No parameter is tuned to force the backends to agree.
  Honest divergence is reported.

at_a_glance:
  - study: adhesion-calibration
    role: >
      §9.1, REVISED 2026-10-28. Both substrates' mechanics are defined term by term
      (docs/mechanics.md). Area stiffness and adhesion ratios are energy-matched; the
      tension scale (1.74), immune motility and the saturating chemotactic drift are
      CALIBRATED to the CPM (area 22.8/23.0, immune displacement 9.4/9.4 um) under a
      hard no-fold constraint. Epithelial wandering is NOT matched: the CPM-matching
      motility folds the vertex mesh, so the vertex epithelium wanders ~5x less (MSD
      2.0 vs 9.5 um^2), though it exchanges neighbours (T1s).
  - study: initial-state-fidelity
    role: >
      §9.2, REVISED 2026-10-28. CPM exact (centroid RMS 0.000 um). The vertex model has
      one polygon per Sego cell: a connected sheet of 36 regular hexagons at area 25
      plus 12 immune overlay islands, with no guard / medium polygons (was 50).
      Epithelial residual is sub-cell (RMS 1.60 um, max 2.44 um). 48/48 type match.
  - study: flu-lung-crossparadigm
    role: >
      §9.3 CAPSTONE, re-run on the revised vertex substrate with mechanics-stochastic
      replicates. Fate (cross 0.938 between same-backend 0.926 / 0.944), occupancy IoU
      (0.135 between 0.100 / 0.175) and patch location (3.6 vs 3.3 um) are inside seed
      noise, so we fail to reject; the old IoU candidate signal does not survive.
      Remaining candidate: the vertex I-count leaves the narrow CPM 3-seed envelope at
      45% of steps by N=400.
  - study: dose-response-crossparadigm
    role: >
      §9 stretch. Sweep initial viral load over seeds; both substrates agree on the
      STRICT DIRECTION -- the highest dose ends with more infection than the lowest on
      every backend and seed (CPM 1->7 / 1->2, vertex 1->7 / 1->6). Directional, not a
      dose-response curve.
  - study: crossparadigm-equivalence
    role: >
      HARDENING, re-run 2026-10-28. Fate is EQUIVALENT (run-cluster CI [-0.003,
      +0.001] within +/-0.05). The exact-position gap shrank from 0.92 to 0.135 (cross
      0.472 vs same 0.608, CI [0.071, 0.210]): still not equivalent at +/-0.10. The old
      gap was mostly a degenerate null (identical mechanics across replicates) plus
      non-moving vertex cells; the rest tracks the less fluid vertex epithelium.
  - study: substrate-divergence-counterfactual
    role: >
      HARDENING / positive control, re-run 2026-10-28. The spatial TOST still REJECTS
      (cross 0.417 vs same 0.775), so the test has power. The earlier mechanism (vertex
      climbing the gradient) was an uncalibrated-chemotaxis artifact and is retired;
      the remaining divergence is positional / sorting and not yet isolated.

acceptance_criteria:
  - study: adhesion-calibration
    behavior: >
      Both substrates' mechanics are defined with per-type / per-pair parameters, and
      the vertex knobs without a CPM counterpart are calibrated to CPM area, motility
      and chemotactic drift (with non-identifiable ones reported as such).
  - study: initial-state-fidelity
    behavior: >
      Both backends reproduce the t=0 centroids/sizes/types; every vertex polygon is
      one blueprint cell (hexagonal sheet + immune overlay, no guard / medium faces)
      and the residual is reported.
  - study: flu-lung-crossparadigm
    behavior: >
      The full Sego blueprint runs on BOTH backends at reduced scale; per-cell
      agreement, dynamics-with-band, and spatial-pattern + occupancy IoU are all
      computed, the three figures render under the inline cap, and the agree/diverge
      result is reported honestly.
  - study: dose-response-crossparadigm
    behavior: >
      Both backends agree on the monotone direction of infection vs initial viral
      load.
  - study: crossparadigm-equivalence
    behavior: >
      Under replication (6x6 seed grid), cross-backend fate agreement is TOST-
      equivalent to the same-backend baseline within ±0.05; the spatial (exact-
      position) result is reported with its representation caveat.
  - study: substrate-divergence-counterfactual
    behavior: >
      In a mechanics-dominated regime the spatial equivalence TOST REJECTS, and the
      migration-direction difference (vertex climbs the gradient, CPM does not) is
      the mechanistic cause — demonstrating the test has power.

competing_frameworks:
  - name: "Cellular Potts (CPM / viva-cpm)"
    description: >
      Lattice model: cells are voxel sets evolving by Metropolis acceptance of pixel
      copies under a Hamiltonian (volume, contact J, chemotaxis). Sorting and motility
      emerge from energy minimisation on the lattice.
  - name: "Vertex model (tyssue / vivatyssue)"
    description: >
      Polygon model: the epithelium is a confluent hexagonal sheet of faces with shared
      edges, evolving by overdamped force balance (area elasticity, per-type-pair
      junction tension, active motility + saturating chemotaxis via ActiveMigration)
      with T1/T3 neighbour exchange (auto_reconnect). Immune cells are an overlay layer
      (Sego's z=1 over z=0), and fields are overlaid on the tissue. Equations:
      docs/mechanics.md.
  - name: "Framing"
    description: >
      The investigation's question is whether a single backend-neutral blueprint gives
      the SAME scientific answer on these two competing substrates. Equivalence
      (crossparadigm-equivalence) and its adversarial positive control
      (substrate-divergence-counterfactual) together bound WHEN the frameworks agree
      (shared-mechanism-driven fate) and WHEN they diverge (mechanics-driven position).

executive:
  what_is_this: >
    The capstone cross-paradigm demonstration: one backend-neutral Sego 2022
    influenza blueprint, compiled and run on both a Cellular Potts and a vertex
    substrate, with a full three-family comparison and three interactive figures.
  verdict: >
    UPDATED per the 2026-10-28 vertex-mechanics review (feedback-response.md, second
    section). The vertex substrate was rebuilt: one polygon per Sego cell on a
    hexagonal sheet, immune overlay, fields overlaid not meshed, auto_reconnect,
    per-pair tension, stable sub-stepped integration, domain walls, and motility /
    chemotaxis calibrated to the CPM under a hard no-fold constraint. Its mechanics are
    defined in docs/mechanics.md. Vertex cells now move within the tissue and exchange
    neighbours, but the epithelium wanders ~5x less than the CPM's: the CPM-matching
    motility folds the vertex mesh. Replicates are now mechanics-stochastic on both
    backends. Fate stays equivalent. The exact-position gap fell from 0.92 to 0.135
    (still not equivalent at +/-0.10). In the capstone, fate, occupancy and location
    are within seed noise; late I-count dynamics are the remaining candidate. The
    counterfactual still rejects, but its migration mechanism was an artifact and is
    retired.
    --- 2026-10-27 framing (still in force):
    REFRAMED per the 2026-10-27 review (see feedback-response.md). The contribution
    is a declarative, backend-neutral BLUEPRINT with auditable lowering to CPM and
    vertex — organized around three DISTINCT claims: (1) blueprint fidelity,
    (2) model portability, (3) scientific equivalence. Cross-backend agreement is
    Claim 3 evidence, NOT the headline, and never implies (1) or biological validity.
    Status by claim: (1) PARTIAL — t0 centroid/ID/type identity shown; area/footprint/
    contact/adjacency/topology/round-trip not yet tested (Stage 2). (2) PARTIAL — one
    blueprint compiles to both with a byte-shared mechanism, but V/L/C/F producers are
    absent and immune recruitment is a latent-pool approximation (named deviations, so
    "Sego model with deviations", NOT "FULL Sego"; Stage 4). (3) SCOPED — on cell
    FATE the backends are equivalent under a DEPENDENCE-AWARE reanalysis (run-cluster
    bootstrap over the 6x6 grid: Δ -0.0015, 90% CI [-0.003,+0.001], within a ±0.05
    margin that is NOT yet biologically justified); exact POSITION is not equivalent
    (a candidate representation effect, not yet causally isolated); the mechanics-
    dominated counterfactual shows the test has power. The earlier pair-level
    p=5.6e-36 overstated significance (dependent seed-pairs) and is retired.
    --- Prior reduced-scale reading (superseded as the headline, kept for provenance):
    Judged against a NULL CONTROL (same-backend
    seed-to-seed spread), on cell fate and infected-patch LOCATION the cross-backend
    difference falls inside the same-backend seed spread, so we FAIL TO REJECT a
    substrate effect at this scale and seed count (a null result, NOT proof of
    equality): cross-backend fate agreement 0.942 (N=400), within the same-backend
    baselines (CPM 0.934, vertex 0.943; equal 0.987 at CI scale); patch location 6.1
    um cross vs 5.4 um same-backend; vertex trajectory inside the CPM 3-seed envelope
    at 100% of steps. Final cell areas match (24.7 vs 24.5), so the spatial comparison
    is not representation-confounded. The ONE exception: raw infected-patch occupancy
    IoU trends ~25-35% below BOTH same-backend baselines (0.165 vs CPM 0.249 / vertex
    0.212) — flagged as a candidate weak substrate signal to test at larger scale /
    more vertex seeds, not attributed to seed noise without evidence. Dose-response
    direction is strict on both backends across seeds. Initial-state fidelity is exact
    on CPM and a clean 1:1 on vertex; the adhesion J<->tension mapping is directional.
    The earlier "fate agrees, morphology diverges" reading was an artifact of
    comparing a single seed-pair to zero. This is preliminary (reduced scale): the
    headline N=400 numbers use 3 CPM x 3 vertex seeds (9 cross pairs), and the vertex
    side is near-degenerate across seeds at this scale (the slow epidemic gives
    ~identical vertex I-counts; vertex-vs-vertex sd 0.006), so more vertex seeds barely
    move the result; the lighter CI test uses CPM {0,1,2} vs vertex seed 0. A substrate
    effect could emerge at larger scale, where the vertex seeds would no longer be
    degenerate. Known limits: the recruitment latent-pool
    approximation (T20-RECRUIT), the reduced scale, the producer-less ODE inputs
    V/L/C/F (Task 21), and the directional adhesion calibration.
  verdict_status: preliminary
  decisions_needed:
    - "STAGE 1 (BP-01): formalize a versioned blueprint schema + canonical IR, separate from backend geometric init (units, coord frame, boundaries, tessellation-independent IDs, footprints, fields, contacts, latent states, seeds, init order, mechanism bindings, provenance, allowable loss)."
    - "STAGE 2 (BP-02/BP-04, extend initial-state-fidelity): prove blueprint fidelity beyond centroids/IDs — area, footprint, contact, adjacency, boundary, topology, round-trip, with explicit error measures and loss reports."
    - "STAGE 3 (BP-07): adhesion-calibration now calibrates the vertex tension scale, immune motility and chemotaxis to CPM observables under a no-fold constraint (2026-10-28). Open: the vertex epithelium cannot reach CPM fluidity without folding (MSD 2.0 vs 9.5 um^2) -- needs a fold-aware topology handler or a softer epithelium; area dispersion unmatched; tension scale geometry-dependent (1.74 vs ~4); one cell size."
    - "STAGE 4 (BP-05): V/L/C/F inputs have no producer and immune recruitment is a latent-pool approximation — build a producer/consumer ledger, implement or clearly designate deviations, and ablate frozen inputs."
    - "STAGE 4 (BP-06): the ±0.05 fate-equivalence margin is NOT yet biologically justified; the dependence-aware reanalysis is done (cluster bootstrap) but power under biologically meaningful perturbations is not established."
    - "STAGE 4 (BP-08): biological fidelity to Sego 2022 is NOT validated — digitize figure/table/parameter anchors and compare predictive intervals on held-out data; no biology inferred from cross-backend agreement."
    - "STAGE 4 (dose-response redefine): separate virion inoculum from seeded infected fraction; 6-10 graded doses x replicate seeds; it is currently directional-only, NOT a dose-response curve."
    - "STAGE 5 (BP-09): compile a SECOND independent tissue blueprint through the same schema with no influenza-specific adaptations — the decisive generality test."

glossary:
  - term: cross-paradigm
    definition: Running the same model on two different mechanical substrates (CPM voxel vs vertex polygon) and comparing.
  - term: latent pool
    definition: Pre-placed resting immune cells (M/NK/CD8_latent) at the tissue margin that recruitment activates in place (type switch), rather than inserting new topology.
  - term: per-cell agreement
    definition: Fraction of the t0 cohort in the same state (type, or alive-vs-dead) at each step across the two backends.
  - term: occupancy IoU
    definition: Intersection-over-union of the two backends' rasterized cell footprints (CPM voxel occupancy vs vertex face polygons).

# ============================================================================
# Reframe per the 2026-10-27 review (feedback-response.md + references/reviews/).
# Three distinct claims + a five-stage program. Cross-backend agreement is
# Claim-3 evidence only; it never implies Claim 1 or biological validity.
# ============================================================================
claims:
  - id: 1
    name: Blueprint fidelity
    question: Can an independently specified biological initial state be represented faithfully in either mechanical substrate?
    status: partial
    evidence: "initial-state-fidelity (t0 centroid/ID/type identity; vertex now one hexagon per cell at target area, connected sheet, immune overlay). Contact/adjacency/round-trip not yet tested."
    stage: 2
  - id: 2
    name: Model portability
    question: Can the same biological mechanisms be connected to each backend without changing their intended semantics?
    status: partial
    evidence: "One blueprint compiles to both with a byte-shared mechanism; V/L/C/F producers absent and recruitment is a latent-pool approximation (named deviations)."
    stage: 4
  - id: 3
    name: Scientific equivalence
    question: Under which conditions should the two simulations agree, and when do differences reflect meaningful mechanical assumptions?
    status: scoped
    evidence: "crossparadigm-equivalence (fate equivalent under run-cluster bootstrap, margin not yet biologically justified; position gap 0.135, CI [0.071, 0.210] -- not equivalent at 0.10) + substrate-divergence-counterfactual (test has power) + adhesion-calibration (vertex mechanics calibrated to CPM behaviour)."
    stage: 4

roadmap:
  order: dependency-ordered (review's recommended order of work)
  stages:
    - stage: 1
      name: Formalize the blueprint
      studies: [BP-01, BP-02, BP-03]
      exit_gate: Canonical schema + portable initial-state fidelity pass for pathological and normal fixtures.
    - stage: 2
      name: Prove initialization fidelity
      studies: [initial-state-fidelity (extend), BP-02, BP-04]
      exit_gate: Geometry/contact/field adapters conform at refinement; per-backend losses quantified.
    - stage: 3
      name: Establish scientifically comparable mechanics
      studies: [adhesion-calibration (supersede), BP-07, BP-10]
      exit_gate: Identifiable (or explicitly unidentifiable) parameters; agreement within pre-registered physical-response bands.
    - stage: 4
      name: Complete and validate the influenza mechanism
      studies: [BP-05, BP-06, BP-08, dose-response (redefine), flu-lung (reconcile), substrate-divergence-counterfactual (extend)]
      exit_gate: No missing causal inputs; powered equivalence on justified observables; measured biology benchmarked.
    - stage: 5
      name: Demonstrate generality
      studies: [BP-09, BP-11]
      exit_gate: A second independent blueprint compiles without influenza-specific branching; losses + portability cost quantified.

claim_guardrails:
  - Passing the same code on two backends is not evidence of biological validity.
  - Equal total counts can conceal infection-pattern and rare-cell behavior differences.
  - Seed-pair comparisons reuse trajectories — treat statistical dependence explicitly.
  - Failing to reject equivalence is not proof of a difference — report bounds and power.
  - CPM contact energy and vertex line tension cannot be equated by a monotonic label mapping without shared physical observables.
  - Biological blueprint, compiler mapping, initialized state, dynamic mechanism, and readout remain distinct objects.
  - Every declared semantic invariant has a pass/fail test and a quantified tolerance.
  - Missing viral/systemic producers and the latent immune pool are approximations until implemented and validated.

