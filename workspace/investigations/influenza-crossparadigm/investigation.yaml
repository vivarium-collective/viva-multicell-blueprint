schema_version: 2
name: influenza-crossparadigm
title: "Blueprint to pipeline to three substrates: one backend-neutral blueprint, run faithfully on CPM, vertex and center-based, with a pluggable subcellular layer"
created: "2026-10-27"
status: running
lead: eran

question: >
  Can ONE versioned, backend-neutral blueprint be translated by a single pipeline
  (`blueprint_pipeline`) and run faithfully on three different mechanical substrates --
  a Cellular Potts model (viva-cpm), a vertex model (vivarium-tyssue) and a center-based
  model (viva-munk) -- including a pluggable per-cell subcellular layer (a tellurium ODE
  that grows and divides cells); and where do the substrates agree vs diverge when the
  shared mechanism is driven live? The Sego 2022 influenza model (ViralInfectionVTM) is
  the worked example for the comparison; a v2 subcellular growth/division blueprint is
  the worked example for the subcellular layer.

hypothesis: >
  Because the field / rule / systemic-ODE / subcellular mechanism is compiled identically
  onto all three backends and only the single mechanics node differs, cell-FATE dynamics
  should be nearly backend-independent while exact SPATIAL position should diverge: each
  substrate samples the shared field at its own cell centroid and measures cell-cell
  contact through its own geometry. Divergence is a finding about the substrate, not a
  bug. Confirmed three-way: fate agreement is statistically EQUIVALENT across all three
  paradigm pairs while exact-position agreement is not, and the center-based model, which
  is not calibrated to the other two, is the most spatially divergent. A mechanics-
  dominated positive control shows the test rejects when it should, and the subcellular
  layer grows and divides cells uniformly on every backend.

description: |
  This investigation covers the `viva-multicell-blueprint` pipeline end to end: the
  backend-neutral blueprint (a versioned, statically validated artifact), the single
  `blueprint_pipeline` composite that compiles it onto a mechanics backend, the three
  real backends running the full model (reaction-diffusion fields, rules, a systemic
  immune ODE fed live by cell counts, latent-pool immune recruitment, per-cell
  subcellular ODEs), the comparison layer (`viva_multicell_blueprint.compare`: identity,
  raster, metrics) and the interactive figures (`viva_multicell_blueprint.viz`).

  **One composite.** `viva_multicell_blueprint.composites.pipeline.blueprint_pipeline`
  (a `@composite_generator`, parameterized by `backend` and `blueprint`) is the baseline
  composite for every study and drives the Composite Explorer. The earlier
  `sego_crossparadigm` composite is a thin alias that delegates to it.

  **Five studies.**
    1. blueprint-pipeline-fidelity -- the blueprint contract and t0 fidelity on every backend.
    2. cross-paradigm-equivalence -- fate and position equivalence across the three
       substrates, with the same-backend null and a mechanics-dominated positive control.
    3. substrate-behavior-at-scale -- distance-to-CPM behavior metrics on the large
       Sego tissue, and how the vertex mechanics were matched to the CPM.
    4. dose-response-crossparadigm -- all three substrates agree on the sign of the
       dose response.
    5. subcellular-layer-grow-divide -- the pluggable per-cell ODE layer grows and
       divides cells on all three backends.

  **Three substrates, not two.** The center-based model (viva-munk: each cell a circular
  rigid body, area-matched to the blueprint `size`) is compiled from the SAME canonical
  blueprint via `local:MunkBackend`, shown as a third panel in every spatial playback,
  and scored pairwise (cpm-vertex, cpm-munk, vertex-munk). It is deliberately NOT
  calibrated to the other two (docs/mechanics.md), so it is a genuinely independent
  representation.

  **Blueprint contents.** The Sego blueprint pre-places 12 size-25 latent immune cells
  (M/NK/CD8_latent) at the tissue margins via `extra_blocks`; recruitment activates that
  latent pool in place, and the `infected_seed` is scoped to the main epithelial block so
  the latent pool never changes the infected count. All cells are size 25 (size-9 cells
  dissolve). Parameters stay faithful to Sego 2022 params.yaml @ b952eec2.

  **Reduced scale.** Influenza studies run at a TRACTABLE reduced scale (a 50x50-site
  patch, a 6x6 epithelial block) so the runs complete; the large Sego tissue (120x120,
  ~225-cell epithelium) is used for behavior-metric characterization. This is a
  demonstration, not paper scale, and the comparison is reproducible (fixed seeds).

  **Anti-goal respected.** No parameter is tuned to force the backends to agree. Honest
  divergence is reported.

at_a_glance:
  - study: blueprint-pipeline-fidelity
    role: >
      Contract + t0 fidelity. The blueprint is a versioned, backend-neutral artifact with a
      canonical/backend split and a static validator; `blueprint_pipeline` materializes it
      on every backend. CPM is exact (centroid RMS 0.000 um); the vertex model has one
      polygon per cell in a single hexagonal sheet (epithelial residual RMS 1.60 um, max
      2.44 um; 12 immune cells attached at the margin, RMS 4.11 um); 48/48 types match.
  - study: cross-paradigm-equivalence
    role: >
      The comparison spine. Fate is EQUIVALENT for every substrate pair (cpm-vertex diff
      -0.0014, run-cluster CI [-0.0034, +0.0008] inside +/-0.05); exact position is not
      (cpm-vertex +0.126 < cpm-munk +0.224 < vertex-munk +0.263), the center-based model
      diverging most. The N=400 same-backend null table is retained, and a mechanics-
      dominated positive control REJECTS equivalence for every pair (cpm-vertex +0.325),
      so the test has power.
  - study: substrate-behavior-at-scale
    role: >
      Large Sego tissue (254 cells): each substrate's behavior-metric distance from the CPM
      against the CPM-self null floor. Vertex matches per-cell trajectories and contact churn
      but under-fluctuates (MSD 2.7x null) and mis-sorts (8.5x); center-based matches contact
      topology and sorting but is over-mobile (MSD 23x). Includes how the vertex mechanics
      were matched to the CPM (area, immune motility, chemotaxis calibrated; epithelial
      wandering ~5x low under a no-fold constraint) and the open fluctuation-match question.
  - study: dose-response-crossparadigm
    role: >
      Sweep initial viral load over seeds; all three substrates agree on the STRICT DIRECTION
      (the highest dose ends with more infection than the lowest on every backend and seed).
      Directional, not a dose-response curve.
  - study: subcellular-layer-grow-divide
    role: >
      The pluggable per-cell subcellular layer (a tellurium ODE bound to a cell type in the
      v2 blueprint) grows and divides cells on CPM, vertex and center-based through
      `blueprint_pipeline`: cell counts cpm 4->8->16, vertex 4->8->16, munk 4->6->8->16.
      Evidence is the e2e test run; no committed runs.db entry yet.

acceptance_criteria:
  - study: blueprint-pipeline-fidelity
    behavior: >
      The same immutable canonical blueprint compiles to every backend, backend/run
      parameters are separated from the biological state and flagged by the validator, and
      every backend reproduces the t=0 centroids/sizes/types (CPM exact; one vertex polygon
      per cell, no guard / medium faces) with the residual reported.
  - study: cross-paradigm-equivalence
    behavior: >
      Under replication (6-seed grid, run-cluster bootstrap), cross-backend fate agreement
      is TOST-equivalent to the same-backend baseline within +/-0.05 for every pair; the
      spatial (exact-position) result is reported with its representation caveat; the N=400
      same-backend null table is reported; and in a mechanics-dominated regime the spatial
      TOST REJECTS, demonstrating the test has power.
  - study: substrate-behavior-at-scale
    behavior: >
      On the large Sego model, the behavior-metric distances of vertex and center-based from
      the CPM are reported against the CPM-self null floor; center-based is shown to move and
      interact; the per-axis divergences are quantified as calibration targets; and the vertex
      mechanics matching is documented term by term with its calibration evidence.
  - study: dose-response-crossparadigm
    behavior: >
      All three backends agree on the strict lowest-vs-highest direction of infection vs
      initial viral load.
  - study: subcellular-layer-grow-divide
    behavior: >
      The per-cell ODE species evolve, cells grow via target_size actuation, and division
      with lineage occurs on all three backends, with one division per starting cell at the
      first threshold crossing.

competing_frameworks:
  - name: "Cellular Potts (CPM / viva-cpm)"
    description: >
      Lattice model: cells are voxel sets evolving by Metropolis acceptance of pixel
      copies under a Hamiltonian (volume, contact J, chemotaxis). Sorting and motility
      emerge from energy minimisation on the lattice.
  - name: "Vertex model (tyssue / vivatyssue)"
    description: >
      Polygon model: the epithelium is a confluent hexagonal sheet of faces with shared
      edges, evolving by overdamped force balance (area elasticity, per-type-pair
      junction tension, active motility + saturating chemotaxis via ActiveMigration)
      with T1/T3 neighbour exchange (auto_reconnect). Immune cells are smaller polygons
      attached to the sheet at the tissue margin, and fields are overlaid on the tissue.
      Equations: docs/mechanics.md.
  - name: "Center-based model (viva-munk)"
    description: >
      Particle model: each cell is a circular rigid body (pymunk), area-matched to the
      blueprint `size`, relaxing under hard-disc collision with adhesion and chemotaxis
      forces. Deliberately uncalibrated to the other two, so it is an independent
      representation (docs/mechanics.md section 3).
  - name: "Framing"
    description: >
      The investigation asks whether a single backend-neutral blueprint, translated by one
      pipeline, gives the SAME scientific answer on these three competing substrates.
      Equivalence and its mechanics-dominated positive control (cross-paradigm-equivalence)
      together bound WHEN the frameworks agree (shared-mechanism-driven fate) and WHEN they
      diverge (mechanics-driven position); the subcellular layer shows the pipeline carries
      per-cell models uniformly across all three.

executive:
  what_is_this: >
    A demonstration that one backend-neutral blueprint, compiled by the single
    `blueprint_pipeline`, runs the Sego 2022 influenza model and a per-cell subcellular
    ODE model on a Cellular Potts, a vertex and a center-based substrate, with a full
    comparison and interactive figures.
  verdict: >
    The pipeline works as designed and the substrates differ where mechanics decides.
    (1) The blueprint is a versioned, validated, backend-neutral artifact, and every
    backend reproduces its t0 state (CPM exact; vertex one polygon per cell with a 1.6 um
    epithelial residual; 48/48 types). (2) Cell FATE is statistically equivalent across all
    three substrates (run-cluster CI [-0.0034, +0.0008] inside +/-0.05), while exact POSITION
    is not for any pair; the gap orders cpm-vertex +0.126 < cpm-munk +0.224 < vertex-munk
    +0.263, so the uncalibrated center-based model diverges most. A mechanics-dominated
    positive control rejects equivalence for every pair, so the test has power. At N=400 the
    capstone fate metric falls within the same-backend seed spread, while infected-patch
    occupancy and location now sit outside it on the current vertex substrate (a candidate
    substrate signal, not causally attributed). (3) On the large tissue each substrate
    reproduces a different facet of the CPM: vertex matches trajectories and contact churn
    but under-fluctuates (the vertex epithelium wanders ~5x less than the CPM because the
    CPM-matching motility folds the mesh); center-based matches contact topology and sorting
    but over-moves. (4) All three substrates agree on the direction of the dose response.
    (5) The pluggable subcellular layer grows and divides cells on all three backends.
    Evidence is preliminary: reduced scale, 3-6 seeds, named deviations (V/L/C/F producers
    absent, latent-pool recruitment), and biological fidelity to Sego 2022 is not validated.
    The project is organized around three distinct claims: (1) blueprint fidelity, (2) model
    portability, (3) scientific equivalence; cross-backend agreement is Claim 3 evidence and
    never implies Claims 1 or 2 or biological validity.
  verdict_status: preliminary
  decisions_needed:
    - "STAGE 1 (BP-01): formalize a versioned blueprint schema + canonical IR, separate from backend geometric init (units, coord frame, boundaries, tessellation-independent IDs, footprints, fields, contacts, latent states, seeds, init order, mechanism bindings, provenance, allowable loss). The versioned schema, canonical/backend split and static validator exist; the remaining fields are open."
    - "STAGE 2 (BP-02/BP-04, extend blueprint-pipeline-fidelity): prove blueprint fidelity beyond centroids/IDs -- area, footprint, contact, adjacency, boundary, topology, round-trip, with explicit error measures and loss reports."
    - "STAGE 3 (BP-07, substrate-behavior-at-scale): the vertex tension scale, immune motility and chemotaxis are calibrated to CPM observables under a no-fold constraint. Open: the vertex epithelium cannot reach CPM fluidity without folding (MSD ~2.2 vs 9.5 um^2) -- push knobs under a mesh-validity gate, add a T1-safe fluctuation term, or accept the residual (VCF-01); area dispersion unmatched; tension scale geometry-dependent (1.74 vs ~4); one cell size."
    - "STAGE 4 (BP-05): V/L/C/F inputs have no producer and immune recruitment is a latent-pool approximation -- build a producer/consumer ledger, implement or clearly designate deviations, and ablate frozen inputs."
    - "STAGE 4 (BP-06): the +/-0.05 fate-equivalence margin is NOT yet biologically justified; the dependence-aware reanalysis is done (cluster bootstrap) but power under biologically meaningful perturbations is not established."
    - "STAGE 4 (BP-08): biological fidelity to Sego 2022 is NOT validated -- digitize figure/table/parameter anchors and compare predictive intervals on held-out data; no biology inferred from cross-backend agreement."
    - "STAGE 4 (dose-response redefine): separate virion inoculum from seeded infected fraction; 6-10 graded doses x replicate seeds; it is currently directional-only, NOT a dose-response curve."
    - "SUBCELLULAR LAYER: commit a run (runs.db) with a figure for subcellular-layer-grow-divide and test lineage / size-distribution equivalence across backends over several seeds; give viva-cpm a per-id split or document its divide-all-over-threshold semantics."
    - "STAGE 5 (BP-09): compile a SECOND independent tissue blueprint through the same schema with no influenza-specific adaptations -- the decisive generality test."

glossary:
  - term: blueprint_pipeline
    definition: The single composite that compiles a backend-neutral blueprint onto a mechanics backend (cpm, vertex or munk) and wires the shared fields, rules, ODEs and subcellular layer.
  - term: cross-paradigm
    definition: Running the same model on different mechanical substrates (CPM voxel, vertex polygon, center-based disc) and comparing.
  - term: subcellular layer
    definition: A per-cell model (e.g. a tellurium ODE) bound to a cell type in the v2 blueprint; it reads fields at the centroid and actuates target_size and division through the shared stores, independent of the mechanics backend.
  - term: latent pool
    definition: Pre-placed resting immune cells (M/NK/CD8_latent) at the tissue margin that recruitment activates in place (type switch), rather than inserting new topology.
  - term: per-cell agreement
    definition: Fraction of the t0 cohort in the same state (type, or alive-vs-dead) at each step across two backends.
  - term: occupancy IoU
    definition: Intersection-over-union of two backends' rasterized cell footprints (CPM voxel occupancy vs vertex face polygons).

# ============================================================================
# Three distinct claims + a five-stage program (feedback-response.md and
# references/reviews/). Cross-backend agreement is Claim-3 evidence only; it never
# implies Claim 1 or biological validity.
# ============================================================================
claims:
  - id: 1
    name: Blueprint fidelity
    question: Can an independently specified biological initial state be represented faithfully in every mechanical substrate?
    status: partial
    evidence: "blueprint-pipeline-fidelity (versioned schema + validator; t0 centroid/ID/type identity; vertex one hexagon per cell at target area in one connected sheet with margin-attached immune cells). Contact/adjacency/round-trip not yet tested."
    stage: 2
  - id: 2
    name: Model portability
    question: Can the same biological mechanisms (including per-cell subcellular models) be connected to each backend without changing their intended semantics?
    status: partial
    evidence: "One blueprint compiles to all three backends with a shared mechanism; subcellular-layer-grow-divide shows per-cell ODE growth and division on all three. V/L/C/F producers absent and recruitment is a latent-pool approximation (named deviations)."
    stage: 4
  - id: 3
    name: Scientific equivalence
    question: Under which conditions should the simulations agree, and when do differences reflect meaningful mechanical assumptions?
    status: scoped
    evidence: "cross-paradigm-equivalence (fate equivalent across all three pairs under run-cluster bootstrap, margin not yet biologically justified; position not equivalent for any pair; mechanics-dominated positive control rejects) + substrate-behavior-at-scale (per-axis distance-to-CPM; vertex mechanics calibrated to CPM behaviour)."
    stage: 4

roadmap:
  order: dependency-ordered (review's recommended order of work)
  stages:
    - stage: 1
      name: Formalize the blueprint
      studies: [BP-01, BP-02, BP-03]
      exit_gate: Canonical schema + portable initial-state fidelity pass for pathological and normal fixtures.
    - stage: 2
      name: Prove initialization fidelity
      studies: [blueprint-pipeline-fidelity (extend), BP-02, BP-04]
      exit_gate: Geometry/contact/field adapters conform at refinement; per-backend losses quantified.
    - stage: 3
      name: Establish scientifically comparable mechanics
      studies: [substrate-behavior-at-scale (extend), BP-07, BP-10]
      exit_gate: Identifiable (or explicitly unidentifiable) parameters; agreement within pre-registered physical-response bands.
    - stage: 4
      name: Complete and validate the influenza mechanism
      studies: [BP-05, BP-06, BP-08, dose-response-crossparadigm (redefine), cross-paradigm-equivalence (extend to effect-size sweep)]
      exit_gate: No missing causal inputs; powered equivalence on justified observables; measured biology benchmarked.
    - stage: 5
      name: Demonstrate generality
      studies: [BP-09, BP-11, subcellular-layer-grow-divide (extend)]
      exit_gate: A second independent blueprint compiles without influenza-specific branching; losses + portability cost quantified.

claim_guardrails:
  - Passing the same code on several backends is not evidence of biological validity.
  - Equal total counts can conceal infection-pattern and rare-cell behavior differences.
  - Seed-pair comparisons reuse trajectories -- treat statistical dependence explicitly.
  - Failing to reject equivalence is not proof of a difference -- report bounds and power.
  - CPM contact energy and vertex line tension cannot be equated by a monotonic label mapping without shared physical observables.
  - Biological blueprint, compiler mapping, initialized state, dynamic mechanism, and readout remain distinct objects.
  - Every declared semantic invariant has a pass/fail test and a quantified tolerance.
  - Missing viral/systemic producers and the latent immune pool are approximations until implemented and validated.

