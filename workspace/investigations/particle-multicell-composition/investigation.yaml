schema_version: 2
name: particle-multicell-composition
title: "Composing particle simulations with multicellular simulators: molecules bounded by living cells"
created: "2026-11-22"
status: running
lead: eran

question: >
  Can a particle-based molecular simulator (Smoldyn) be composed with a multicellular
  simulator (the tyssue/vertex backend) so that each cell's molecules are confined to
  that cell's own, dynamically changing boundary -- and, when a cell divides, partitioned
  correctly into the two daughter volumes -- while the two simulators run as one
  process-bigraph composite? And what does that composition let us model that neither
  simulator can alone: spatially-resolved intracellular chemistry inside cells whose
  shape, position and number are set by a living tissue?

hypothesis: >
  A multicellular simulator and a particle simulator couple cleanly through ONE shared
  object -- the cell boundary. Each tyssue cell is a polygon; a Smoldyn sim per cell uses
  that polygon as a reflective surface, so particles diffuse, react and bounce strictly
  within their assigned cell as the cell moves and deforms. Cell division is a lineage
  event the tissue already emits; the molecules follow geometry, partitioned into the two
  daughter polygons by containment. The composition is therefore faithful (no molecule
  leaves its cell, counts are conserved across division up to the reaction) and gives a
  capability neither simulator has on its own: reaction-diffusion chemistry inside a
  tissue of growing, dividing, moving cells.

description: |
  This investigation is about COMPOSITION across modelling paradigms: wiring a
  particle/agent simulator to an off-lattice multicellular simulator. The worked coupling
  is **Smoldyn particles bounded by tyssue cells**.

  **The composite.** `viva_multicell_blueprint.composites.bounded_particles.bounded_particles`
  (a `@composite_generator`) runs the vertex (tyssue) backend and, inside each cell, a
  Smoldyn particle sim with a reversible reaction A+B<->C confined by the cell's polygon
  (reflective surface panels). On division the mother's molecules are partitioned into the
  two daughters. The particle physics lives in a standalone, reusable module
  (`viva_multicell_blueprint.particles`): `smoldyn_cell` (the per-cell stepper),
  `worker` (a subprocess server) and `runner` (`SmoldynRunner`, which runs Smoldyn
  in-process where it has a binary wheel and otherwise bridges to a Python 3.11 Smoldyn).

  **Why a bridge.** Smoldyn ships a macOS binary only up to Python 3.11, while this
  workspace requires >=3.12; `SmoldynRunner` therefore runs Smoldyn in-process on Linux
  (CI, most external users) and through a resolved 3.11 interpreter on macOS, so the same
  composite is reproducible everywhere.

  **Studies.**
    1. bounded-particles-in-tissue -- the composite runs; molecules stay inside their
       cell (confinement check), counts are conserved across a division (split check),
       and the reaction reaches its expected equilibrium inside a moving tissue.

  **Generalises beyond Smoldyn.** The coupling contract -- a per-cell dynamic boundary +
  a lineage/division event -- is simulator-agnostic; the same seam would bound any
  particle/agent engine (e.g. a Brownian-dynamics or an agent-based intracellular model)
  by the same tyssue cells.
