# Sego et al. 2022 influenza (ViralInfectionVTM) as ONE backend-neutral blueprint.
# Template expressiveness acceptance test (spec sections 7, 9): the whole model is
# DATA here -- every epithelial rate is a rate_expr rule, every field a `fields`
# entry, the immune recruitment + Price-2015 ODE are components. Compiles to the CPM
# and vertex backends unchanged.
#
# PROVENANCE: every number is from viva-cpm
#   viva_cpm_studies/influenza/params.yaml @ b952eec2   ("Sego 2022 params.yaml @ b952eec2")
# which transcribes the CC3D source / Sego 2022 Tables 3-4. Nothing is invented; items the
# source does not give as a single constant are listed under PENDING at the end.
#
# UNITS: 1 grid unit = 1 CC3D lattice site (2 um in the source) and 1 step = 1 MCS (60 s).
# `*_um` keys are therefore in lattice sites; all D / decay / rates are the source's
# lattice^2/MCS and per-MCS values (params.yaml *_lat2_per_mcs / *_per_mcs).
# Tractable scale: a 50x50-site patch with a 6x6 block of epithelium.

blueprint_version: "1.0"   # BP-01 canonical schema version
domain:
  extent_um: [50, 50]           # tractable patch (source patches: 0.3 mm / 1 mm, params.yaml scenarios)
  grid_resolution_um: 1         # 1 unit = 1 lattice site (see UNITS)
  boundary: noflux

cell_types:
  # Epithelium: params.yaml cpm.cell_sites = 25 (5x5 sites, 10 um diameter) -> target_size 25.
  # (A size-9 CPM cell dissolves to volume 0 -- Task 13 finding -- so 25 is load-bearing.)
  - {name: H, target_size: 25}      # UNINFECTED
  - {name: I, target_size: 25}      # INFECTED / INFECTEDRELEASING
  - {name: D, target_size: 25}      # DYING
  # Immune: macrophage|nk|cd8.volume_sites = 25
  - {name: M, target_size: 25}      # macrophage
  - {name: NK, target_size: 25}
  - {name: CD8, target_size: 25}
  # LATENT immune pool (Task 20 recruitment design): a pre-placed resting reservoir
  # at the tissue margin. ImmuneRecruitmentProcess activates these in place (type
  # switch latent -> active) instead of inserting topology; on activation the cell
  # becomes M/NK/CD8 and adopts those adhesion rows. While latent it carries no
  # explicit adhesion (both backends fall back to their default contact for the
  # inert margin reservoir), keeping size 25 so it does not dissolve. NOT a Sego
  # params.yaml constant: this is the blueprint's expression of the recruitment
  # mechanism (ruling T20-RECRUIT; see PENDING).
  - {name: M_latent, target_size: 25}
  - {name: NK_latent, target_size: 25}
  - {name: CD8_latent, target_size: 25}

# Contact energies J: Sego 2022 Table 3 collapsed values + the per-type rows of
# ViralInfectionVTM.xml <Plugin Name="Contact"> recorded in params.yaml adhesion /
# macrophage|nk|cd8.adhesion. The epithelial classes H/I/D share epithelial_epithelial and
# epithelial_medium.
adhesion:
  # epithelial_epithelial = 5.0 (adhesion.epithelial_epithelial)
  - {a: H, b: H, strength: 5}
  - {a: H, b: I, strength: 5}
  - {a: H, b: D, strength: 5}
  - {a: I, b: I, strength: 5}
  - {a: I, b: D, strength: 5}
  - {a: D, b: D, strength: 5}
  # epithelial_medium = 25.0 (adhesion.epithelial_medium)
  - {a: H, b: medium, strength: 25}
  - {a: I, b: medium, strength: 25}
  - {a: D, b: medium, strength: 25}
  # immune-medium = 10 (macrophage.adhesion.medium_macrophage, nk.adhesion.medium_nkcell, cd8.adhesion.medium_cd8tcell)
  - {a: M, b: medium, strength: 10}
  - {a: NK, b: medium, strength: 10}
  - {a: CD8, b: medium, strength: 10}
  # immune-epithelium: uninfected_* = 20, dying_* = 20; infected_macrophage = 20; infected_nkcell = infected_cd8tcell = 10
  - {a: M, b: H, strength: 20}
  - {a: M, b: I, strength: 20}
  - {a: M, b: D, strength: 20}
  - {a: NK, b: H, strength: 20}
  - {a: NK, b: I, strength: 10}
  - {a: NK, b: D, strength: 20}
  - {a: CD8, b: H, strength: 20}
  - {a: CD8, b: I, strength: 10}
  - {a: CD8, b: D, strength: 20}
  # immune-immune: macrophage_macrophage = nkcell_nkcell = cd8tcell_cd8tcell = 25; macrophage_nkcell = macrophage_cd8tcell = 10; nkcell_cd8tcell = 25
  - {a: M, b: M, strength: 25}
  - {a: NK, b: NK, strength: 25}
  - {a: CD8, b: CD8, strength: 25}
  - {a: M, b: NK, strength: 10}
  - {a: M, b: CD8, strength: 10}
  - {a: NK, b: CD8, strength: 25}

# Generative initial state: a 6x6 block of H cells (5-site pitch, size 25) with a small
# infected seed (virus.frac_init_infected = 0.05 of the block), PLUS a pre-placed LATENT
# immune pool (M/NK/CD8_latent) along the tissue margins. `extra_blocks` are appended with
# contiguous ids after the main block; the infected_seed is scoped to the MAIN block only,
# so the latent pool never changes the infected count. The pool is deliberately generous
# (12 cells) so the ODE-driven recruitment has latent cells to activate at reduced scale
# (activation is clamped to the available pool). Margin placement, not a Sego constant.
initial_state:
  kind: blocks
  block: {type: H, origin: [10, 10], shape: [6, 6], spacing: 5, size: 25}
  infected_seed: {type: I, fraction: 0.05, seed: 0}
  extra_blocks:
    - {type: M_latent, origin: [6, 44], shape: [5, 1], spacing: 9, size: 25}   # top margin
    - {type: NK_latent, origin: [6, 5], shape: [4, 1], spacing: 11, size: 25}   # bottom margin
    - {type: CD8_latent, origin: [44, 10], shape: [1, 3], spacing: 11, size: 25} # right margin

# Fields. dt/substeps per field are the viva-cpm stability splits (substeps*dt == 1 MCS,
# dt*D*2*ndim < 1; fields.py _*_FIELD_DT/_SUBSTEPS). Secretion `rate` is the per-cell release
# the engine adds as rate*dt once per MCS, i.e. (g/2)/dt: g bakes in the source dim.z=2 slab,
# halved for a single-layer field (fields.py _per_pixel_secretion_rate; same convention as the
# viva-cpm reproduction).
fields:
  - name: virus
    D: 0.17882616694562153          # virus.diffusion_lat2_per_mcs
    decay: 0.00028612186711299444   # virus.decay_per_mcs
    dynamics: {dt: 0.2, substeps: 5}
    secretion:
      - {type: I, rate: 0.9655166013980694}   # (virus.secretion_g_vi 0.38620664055922777 / 2) / dt
    chemotaxis:
      - {type: M, strength: 5000}   # chemotaxis.macrophage_virus / macrophage.chemotaxis_v_macro
  - name: ifn
    D: 7.793793725154791            # ifn.diffusion_lat2_per_mcs
    decay: 0.07793793725154792      # ifn.decay_per_mcs
    dynamics: {dt: 0.025, substeps: 40}
    secretion:
      - {type: I, rate: 0.005465461602720083}  # (ifn.secretion_g_fp 0.00027327308013600416 / 2) / dt; (1-resist) gate: see PENDING
    uptake:
      - {type: I, rate: 15.74439694686276}     # ifn.uptake_g_fi; engine uptake form: see PENDING
  - name: chemokine
    D: 15.60770650326941            # chemokine.diffusion_lat2_per_mcs
    decay: 0.006243082601307764     # chemokine.decay_per_mcs
    dynamics: {dt: 0.0125, substeps: 80}
    secretion:
      - {type: M, rate: 2.2335172473999445}    # (chemokine.b_c 0.055837931184998614 / 2) / dt; IL-10-Hill scale: see PENDING
    chemotaxis:
      - {type: NK, strength: 5000}     # chemotaxis.nk_chemokine / nk.chemotaxis_v_nk
      - {type: CD8, strength: 10000}   # chemotaxis.cd8_chemokine / cd8.chemotaxis_v_cd8
  - name: il10
    D: 4.900981940788802            # il10.diffusion_lat2_per_mcs
    decay: 0.001960392776315521     # il10.decay_per_mcs
    dynamics: {dt: 0.04, substeps: 25}
    secretion:
      - {type: M, rate: 0.04034329374804306}     # (il10.b_l 0.0032274634998434447 / 2) / dt; IL-10-Hill scale: see PENDING
      - {type: H, rate: 2.2729746545302016e-05}  # (il10.mu_l 0.001960392776315521 * il10.b_lh 0.00092755887778863 / 2) / dt; (1-resist) gate: see PENDING

# Rules, in evaluation order. RulesProcess applies Pr = 1 - exp(-rate) (Sego ul_rate_to_prob),
# so each rate_expr is the source RATE: infection is `g_hv * field['virus']` (the rate in
# transitions.infection_step). Writing `1 - exp(-g_hv*virus)` here would apply the exponential
# twice. Constants live in mechanics_mapping.const below.
rules:
  # resistance rho = f/(a_rf + f)    (resistance.formula)
  - {type: resistance, scalar: resist, rate_expr: "hill(field['ifn'], a_rf)"}
  # infection H -> I                 (virus.infection_g_hv)
  - {type: transition, from: H, to: I, rate_expr: "g_hv * field['virus']"}
  # Allee death H -> D, neighbor-surface driven (allee.formula_death); srf_total = epithelial contact surface H+I+D
  - type: allee
    from: H
    to: D
    rate_expr: >-
      (b_h * (1 - scalar['resist']) * neighbors.shared_surface['D']
      * max(theta * (neighbors.shared_surface['H'] + neighbors.shared_surface['I'] + neighbors.shared_surface['D'])
            - neighbors.shared_surface['H'], 0)
      / max(neighbors.shared_surface['H'] + neighbors.shared_surface['I'] + neighbors.shared_surface['D'], 1e-9) ** 2)
  # infected-cell death I -> D       (cell_death.mu_i_per_mcs, resistance-gated)
  - {type: transition, from: I, to: D, rate_expr: "mu_i * (1 - scalar['resist'])"}
  # NK / CD8 contact killing I -> D  (nk.g_ik / cd8.g_ie; kill_rate = g * tot_ec * srf * resist / volume, resist-DIRECT per source)
  - {type: kill, killer: NK, target: I, to: D,
     rate_expr: "g_ik * tot_ec * neighbors.shared_surface['NK'] * scalar['resist'] / size"}
  - {type: kill, killer: CD8, target: I, to: D,
     rate_expr: "g_ie * tot_ec * neighbors.shared_surface['CD8'] * scalar['resist'] / size"}
  # Allee recovery D -> H            (allee.formula_recovery; same shared b_h)
  - type: recovery
    from: D
    to: H
    rate_expr: >-
      (b_h * (1 - scalar['resist']) * neighbors.shared_surface['H']
      * max(neighbors.shared_surface['H']
            - theta * (neighbors.shared_surface['H'] + neighbors.shared_surface['I'] + neighbors.shared_surface['D']), 0)
      / max(neighbors.shared_surface['H'] + neighbors.shared_surface['I'] + neighbors.shared_surface['D'], 1e-9) ** 2)

mechanics_mapping:
  const:                              # rule constants (Sego 2022 params.yaml @ b952eec2)
    g_hv: 0.006133879567670876        # virus.infection_g_hv
    a_rf: 8.51558276606456e-06        # resistance.a_rf
    mu_i: 0.002812795041656167        # cell_death.mu_i_per_mcs
    b_h: 0.01477732983566816          # allee.b_h (shared by death + recovery)
    theta: 0.0528712421467436         # allee.srf_threshold (theta_local)
    g_ik: 2.1401636386747083e-08      # nk.g_ik
    g_ie: 6.840166937615132e-07       # cd8.g_ie
    tot_ec: 250000                    # scaling.ode_epithelial_population (tot_ec_ODE)

# Immune component (ImmuneRecruitmentProcess): ODE-driven M/NK/CD8 recruitment. The inflow/
# outflow laws and Hill constants come from the price_ode block below (asymmetric per
# discrepancy #12: CD8 is APC-driven, no baseline). `types` maps a driver to the spawned type.
immune:
  types: {macrophage_inflow: M, nk_inflow: NK, cd8_inflow: CD8}
  seed: 0
  id_prefix: rec
  max_per_step: 1000
  local_fraction: {M: 1.0, NK: 0.75, CD8: 0.75}   # macrophage.local_fraction_macrophage / nk.local_fraction_nk / cd8.local_fraction_cd8

# Price/Mochan-Keef 2015 in-host ODE (hybrid-coupled per Sego 2022).
systemic_ode:
  model_ref: price2015
  coupling:
    num_epithelial: 36                # = the 6x6 epithelial block; eta = num_epithelial / 250000
    dt_seconds: 60                    # price_ode.integrator.seconds_per_mcs
    v0: 0                             # virus.v0_ode_options [0, 50, 500]; infection is seeded by initial_state
    # spatial -> ODE count map is params.yaml coupling.spatial_to_ode (H, I, M, K, E, DH, V, F, C, L, B_ei, G_ki)
  params:                             # the price_ode block (Sego 2022 params.yaml @ b952eec2), verbatim
    source: ImmuneModel/ImmuneModelLib.py:immune_model_string (lines 45-229)
    reference_full_ode: ImmuneModel/ImmuneModelLib.py:immune_model_string_ode (lines
      232-410)
    model_name: FluODE_20vars
    integrated_states:
    - NB
    - N
    - T
    - X
    - A
    - B
    - P
    - W
    - G
    - O
    integrated_nearby_surrogates:
    - M_nb
    - K_nb
    - E_nb
    spatialized_states:
    - H
    - I
    - M
    - E
    - K
    - L
    - C
    - F
    - V
    - DH
    hill_exponents:
      h_m: 3
      h_x: 2
      h_k: 2
      h_e: 3
      h_o: 2
    integrator:
      solver: roadrunner_cvode
      step_size: 1
      steps_per_mcs: 1
      seconds_per_mcs: 60
    scaling:
      ode_epithelial_population: 250000
      eta_formula: num_epithelial / 250000
      eta_at_175: 0.0049
      eta_at_500_1mm: 0.04
      theta: 1.6e-07
      s_t_formula: s_to_mcs/86400
