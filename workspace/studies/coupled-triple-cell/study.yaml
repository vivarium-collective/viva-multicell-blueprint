question: |
  Can one cell run all three sub-cellular formalisms at once, coupled by all three modes (particle->metabolism->fate->reset)?
study_card:
  goal: |
    Show that all three sub-cellular formalisms and all three coupling modes run together in one cell.
  mechanism: |
    One cell running a Smoldyn particle sim, an SBML-ODE metabolism and a MaBoSS fate network, coupled by all three modes: particles catalyse the metabolism (B), the metabolite pins the fate input (A), the fate output resets the metabolism (C).
  why_before_next: |
    This is the full CoupledCell exercised end to end — if the three formalisms co-run and the chain cycles, the adapter composes arbitrarily, which the tissue crown then scales.
  expected_result: |
    The full chain cycles (fate 'divide' crosses the cutoff >=2x), so all three formalisms run and are coupled by all three modes in one cell.
  main_expert_question: |
    With three solvers interleaved per step, is the fixed step order (particle, ODE, Boolean) a faithful operator-splitting, or does a stiff coupling need sub-stepping?
