behavior_tests:
- name: triple-chain-oscillates
  classification: primary
  description: >
    With all three formalisms coupled (particle→metabolism→fate), the fate 'divide'
    activity (emitted as probe_a) crosses the 0.5 cutoff at least twice — the full
    particle→metabolism→fate→reset chain cycles rather than latching.
  measure: {kind: derived_scalar, path: atlas_fate_transitions}
  pass_if: {op: ">=", value: 2}
  pytest_node: 
    tests/model_format/test_atlas_composites.py::test_triple_cell_runs_all_three_formalisms
  requires_simulation: 'true'
  units: dimensionless

  gate_class: acceptance_criterion
limitations:
- Combines the oscillator and catalysis motifs; it inherits both their calibration caveats 
  (empirical particle rate, MaBoSS mean-field lag).
- Only the co-running of all three formalisms is a committed test; the triple-coupled rhythm's 
  quantitative shape is shown in the viz but not pinned to a band.

composite: viva_multicell_blueprint.composites.coupled_subcellular.coupled_triple_cell
baseline:
- name: coupled-triple-cell
  composite: viva_multicell_blueprint.composites.coupled_subcellular.coupled_triple_cell

claim: >
  A single cell can run all three sub-cellular formalisms at once — a Smoldyn particle sim,
  an SBML-ODE metabolism and a MaBoSS fate network — coupled by all three modes
  simultaneously: the particle count catalyses the metabolism (B), the metabolite pins the
  fate input (A), and the fate output resets the metabolism (C).

experiment: >
  Run coupled_triple_cell (a small vertex tissue of three-formalism CoupledCells) for 36
  steps. Record one cell's particle C, metabolite C, fate 'divide' and the live ODE rate
  constant each step.

outcomes: >
  The time series (viz/coupled-triple-cell.html) shows the full chain: the confined particle
  population holds a C level that sets the ODE rate; the ODE metabolite builds to threshold,
  pins the fate input, fires 'divide', which resets the metabolism — a clean period-3 rhythm
  driven by all three engines together. Computed live from real Smoldyn + tellurium + MaBoSS.

notes: |
  Regenerate with `python scripts/gen_atlas_viz.py coupled-triple-cell`.
