design_pivot_required:
  - id: VCF-01
    question: "Can the vertex backend reproduce the CPM's emergent interaction pattern on the large Sego blueprint WITHOUT folding the mesh? Close the gap by pushing capped knobs, or by adding a new T1-safe fluctuation mechanism?"
    alternatives:
      - "A. Knob-push only -- raise sheet_motility / tension_noise under a mesh-validity gate; simplest, may fold before matching."
      - "B. New mesh-safe fluctuation term -- bounded per-vertex jitter / boundary roughness that cannot shrink a junction past the T1 threshold; more work, likely required if A folds."
      - "C. Accept the residual -- report the capped vertex as an honest structural limit if neither A nor B reaches the band."
    status: open
    requested_response: "Expert steer on how far to push mechanism changes into the tyssue backend vs accepting an honest residual."

followup_proposals:
  - title: "Vertex-to-CPM fluctuation match under a hard mesh-validity gate"
    rationale: >
      Today the honest CPM-matching motility/noise values invert short junctions and
      self-intersect the polygons, so they were capped, leaving the vertex epithelium ~5x
      less mobile (MSD ~2.2 vs ~9.5 um^2), immune displacement ~4.6 vs ~9.4 um, and area CV
      ~0.038 vs ~0.093. PLANNED targets (unrun): epithelial MSD within 30% of the CPM; area
      CV within 30% of the CPM; neighbour-graph-churn and front-speed distances below the
      shipped-vertex baseline; mesh validity every step (hard gate, overrides any metric
      match). Candidate arms: vertex-knob-push, vertex-mesh-safe-fluctuation, and an
      immune-representation toggle (free-wandering vs margin-attached). Falsifiable: if no
      provided mechanism enters the tolerance bands with the mesh valid, the honest
      result is that the vertex substrate cannot reach CPM-level fluctuation without
      folding. Status: planned, Design phase, no runs.

implementation_requirements:
  - id: req-mesh-validity-gate
    title: "Per-step mesh-validity invariant exposed from the vertex backend"
    kind: process
    effort: S
    status: planned
  - id: req-t1-safe-fluctuation
    title: "A T1-safe (sub-threshold) fluctuation term for the vertex backend"
    kind: process
    effort: L
    status: planned
    description: "Candidate mesh-safe analog of the CPM temperature: bounded per-vertex jitter / boundary-roughness that cannot shrink a junction past the T1 threshold."
  - id: req-immune-representation-arm
    title: "Free-wandering vs margin-attached immune representation toggle"
    kind: parameter_hook
    effort: M
    status: planned
