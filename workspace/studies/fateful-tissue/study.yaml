behavior_tests:
- name: fate-drives-division
  classification: primary
  description: >
    The tissue carries out at least one fate-driven division over the run (emitted
    cumulative n_divisions ends >= 1) — biology, not a clock, divides the tissue.
  measure: {kind: derived_scalar, path: atlas_divisions_final}
  pass_if: {op: ">=", value: 1}
  pytest_node: tests/model_format/test_atlas_composites.py::test_fateful_tissue_fate_drives_division_and_conserves_particles
  requires_simulation: 'true'
  units: divisions
- name: tissue-sustains
  classification: primary
  description: >
    The tissue does not collapse: the minimum simulated cell count stays at or above the
    initial 4 cells (growth keeps pace with division).
  measure: {kind: derived_scalar, path: atlas_cells_min}
  pass_if: {op: ">=", value: 4}
  requires_simulation: 'true'
  units: cells

limitations:
- >
  Sustained growth is a TUNED regime — target area tracks the metabolite so daughters
  regrow; without that coupling the vertex backend halves cells on division and the tissue
  collapses. The growth is engineered, not emergent.
- Division is capped (max_divisions_per_step) and the divider is shuffled for tyssue stability; the exact lineage tree is not a controlled observable.
- Particle conservation across splits is checked as 'particles survive' (n > 0), not yet as an exact mother == sum(daughters) count band.

composite: viva_multicell_blueprint.composites.fateful_tissue.fateful_tissue
baseline:
- name: fateful-tissue
  composite: viva_multicell_blueprint.composites.fateful_tissue.fateful_tissue

claim: >
  Every scale this workspace can simulate composes into one system: a tyssue of dividing
  cells, each running a Smoldyn particle sim confined to its moving polygon (split on
  division) AND an ODE metabolism whose metabolite pins a MaBoSS fate network — and the fate
  'divide' output DRIVES the tissue division. Cells grow as they metabolise (target area
  tracks the metabolite), divide when their own fate fires, and daughters reset and regrow,
  so the tissue sustains. Biology decides when the tissue divides.

experiment: >
  Run fateful_tissue (vertex backend) for 22 steps. Each step: advance every cell's confined
  particles and coupled metabolism→fate; divide the cells whose fate raised 'divide'; split
  the mother's particles into the daughters; grow each cell's target area with its metabolite.

outcomes: >
  The fate-coloured flipbook (viz/fateful-tissue.html) shows the tissue growing from 4 to
  ~26 cells over ~22 fate-driven divisions, with particle counts conserved across each split
  and cell fill reading the metabolism→fate state (green metabolising → amber building → red
  dividing). Computed live from real tellurium + MaBoSS + Smoldyn.

notes: |
  Regenerate with `python scripts/gen_atlas_viz.py fateful-tissue`.
