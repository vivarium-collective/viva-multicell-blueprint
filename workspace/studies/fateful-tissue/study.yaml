question: |
  Can a dividing tissue's divisions be decided by each cell's own metabolism->fate chain, with confined particles that split on division — composing every scale at once?
study_card:
  goal: |
    Show that a dividing tissue's divisions can be decided by each cell's own metabolism->fate chain, composing all scales at once.
  mechanism: |
    A dividing tyssue where each cell runs confined Smoldyn particles (split on division) AND an ODE metabolism whose metabolite pins a MaBoSS fate network, and the fate 'divide' output drives the tissue division. Cells grow as they metabolise, divide when their own fate fires, and daughters reset and regrow.
  why_before_next: |
    The crown: it closes the loop from sub-cellular coupling back to tissue mechanics, showing biology (a cell's own fate chain) — not a clock — can drive tissue-scale events.
  expected_result: |
    The tissue carries out fate-driven divisions (>=1) without collapsing (min cells >= initial 4) and conserves particles across splits, so the whole metabolism->fate->division->partition chain composes across all scales.
  main_expert_question: |
    Sustained growth is a tuned regime (target area tracks the metabolite); what growth law would make the non-collapse emergent rather than engineered?
