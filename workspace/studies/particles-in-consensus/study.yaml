  description: the published reference configuration (single baseline run)
readouts:
- name: confined_fraction
  description: fraction of molecules inside their consensus cell
  store_path: confined_fraction
  units: fraction
  status: measured
- name: n_particles
  description: total confined molecules
  store_path: n_particles
  units: particles
  status: measured
- name: consensus_spread
  description: tri-coupled consensus tightness
  store_path: consensus_spread
