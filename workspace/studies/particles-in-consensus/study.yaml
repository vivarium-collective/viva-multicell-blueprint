design_status: drafted
title: 'Particles in a consensus tissue: Smoldyn molecules bounded by a boundary three tissue simulators agree on'
kind: confirmatory
confidence: Accepted
investigation: composition-atlas
report:
  verdict: supported
question: |
  Can a Smoldyn particle sim be confined inside each cell of a tri-coupled consensus tissue, bounded by a boundary whose shape is vertex, position is the munk consensus and area is CPM?
study_card:
  goal: |
    Confine spatially-resolved chemistry inside a multi-paradigm consensus tissue.
  mechanism: |
    On the tri-coupled consensus, each cell's vertex polygon (the consensus shape, placed at the munk-consensus position and sized by CPM area) is a reflective Smoldyn surface; an A+B<->C sim runs confined to it.
  why_before_next: |
    Shows the consensus boundary is a real, usable object: molecules reflect off a boundary three tissue simulators agree on, composing particle chemistry with a multi-paradigm tissue.
  expected_result: |
    Molecules stay confined inside a boundary three tissue simulators agree on, while the consensus holds -- spatially-resolved chemistry inside a multi-paradigm tissue.
  main_expert_question: |
    When the three backends briefly disagree (a transient spread spike), should particles follow the vertex shape, the CPM area, or a blended boundary?
composite: viva_multicell_blueprint.composites.particle_consensus.particle_consensus
baseline:
- name: particles-in-consensus
  composite: viva_multicell_blueprint.composites.particle_consensus.particle_consensus
  params: &id001
    seed_per_cell: 50
    munk_squish: 0.8
conditions:
  baseline:
    name: particles-in-consensus-baseline
    composite: viva_multicell_blueprint.composites.particle_consensus.particle_consensus
    description: |
      On the tri-coupled consensus, each cell's vertex polygon (the consensus shape, placed at the munk-consensus position and sized by CPM area) is a reflective Smoldyn surface; an A+B<->C sim runs confined to it.
    params: *id001
variants:
- name: reference
