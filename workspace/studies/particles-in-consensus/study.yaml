  store_path: n_cells
  units: cells
  status: measured
behavior_tests:
- name: molecules-confined-to-consensus
  classification: primary
  description: |
    At least 90% of molecules stay inside their consensus cell boundary every step.
  measure:
    kind: derived_scalar
    path: atlas_confined_min
  pass_if:
    op: '>='
    value: 0.9
  gate_class: acceptance_criterion
  requires_simulation: 'true'
  units: fraction
- name: consensus-holds-with-particles
  classification: primary
  description: |
    The three-backend consensus stays tight (<=6um) while the particle sim runs.
  measure:
    kind: derived_scalar
    path: atlas_spread_max
  pass_if:
    op: <=
    value: 6.0
  gate_class: acceptance_criterion
  requires_simulation: 'true'
  units: um
conclusion_verdicts:
  if_primary_tests_pass: |
    Molecules stay confined inside a boundary three tissue simulators agree on, while the consensus holds -- spatially-resolved chemistry inside a multi-paradigm tissue.
  if_primary_tests_fail: |
    Molecules leaking out, or a diverging consensus, would mean the composed boundary is not usable.
conclusion_logic:
  if_primary_tests_pass:
    verdict: supported
    summary: |
      Molecules stay confined inside a boundary three tissue simulators agree on, while the consensus holds -- spatially-resolved chemistry inside a multi-paradigm tissue.
  if_primary_tests_fail:
    verdict: refuted
    summary: |
      Molecules leaking out, or a diverging consensus, would mean the composed boundary is not usable.
