question: |
  Can a Smoldyn particle sim be confined inside each Cellular Potts (CPM) cell's moving boundary, split into the two daughters on division, and run A+B<->C to equilibrium inside a living tissue?
study_card:
  goal: |
    Confine a Smoldyn particle sim inside each Cellular Potts (CPM) cell and split it correctly on division.
  mechanism: |
    The Cellular Potts (CPM) backend gives each cell a moving boundary; a per-cell Smoldyn sim uses it as a reflective surface (A+B<->C), and on division the mother's molecules are partitioned into the two daughter polygons by containment.
  why_before_next: |
    This is the sub-cellular<->tissue composition axis of the atlas: spatially-resolved intracellular chemistry inside cells whose shape, position and number are set by the Cellular Potts (CPM) tissue.
  expected_result: |
    Particles stay inside their Cellular Potts (CPM) cells (confinement) and are split into daughters on division — the particle sim composes faithfully with the tissue.
  main_expert_question: |
    How faithfully does the Cellular Potts (CPM) cell boundary (its emitted footprint) track the true cell geometry that Smoldyn reflects off, especially right after a division?
