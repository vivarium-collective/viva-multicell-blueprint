conclusion_verdicts:
  if_primary_tests_pass: |
    Particles stay inside their Cellular Potts (CPM) cells (confinement) and are split into daughters on division — the particle sim composes faithfully with the tissue.
  if_primary_tests_fail: |
    Particles leaking out of their cells, or no division/split, would break the coupling.
conclusion_logic:
  if_primary_tests_pass:
