schema_version: 4
name: dose-response-crossparadigm
created: "2026-10-27"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: partial
design_status: drafted

claim: >
  Both backends agree on the DIRECTION of the dose response: a HIGHER initial viral
  load (more initially-infected epithelial cells) ends with STRICTLY more infection
  than a LOWER load, on every backend and seed tested. This is a directional
  (lowest-vs-highest) result; intermediate-dose monotonicity is seed-dependent and is
  NOT claimed.

experiment: >
  Sweep the initial viral load via `infected_seed.fraction` in {0.03, 0.08, 0.15}
  (seeding 1, 3, 5 infected cells of the 36-cell block) on the Sego blueprint, over
  rules-seeds {0, 1}, on BOTH backends at reduced scale (N=120). Record the final
  infected-cell count and check that the highest dose ends with strictly more
  infection than the lowest, on each backend and seed.

result: >
  Seeding 1 / 3 / 5 infected cells, final infected counts (N=120): CPM seed0 1/2/7,
  CPM seed1 1/3/2, vertex seed0 0/2/5, vertex seed1 1/3/6. The lowest-vs-highest
  direction is STRICT in all four (backend, seed) cases (final_high > final_low), so
  both backends agree on the direction. Intermediate monotonicity is NOT universal
  (CPM seed1 is 1/3/2), so only the directional (low-vs-high) claim is made. CPM and
  vertex magnitudes are comparable and within the capstone's same-seed spread.

purpose:
  question: >
    Do the two substrates agree on the SIGN of the dose response over initial viral
    load (more load -> more infection), robustly across seeds?
  mechanism: >
    More initially-infected cells secrete more virus into the shared field, raising
    the per-cell infection probability (Pr = 1 - exp(-g_hv * virus)) everywhere, so
    the final infected count rises with the initial dose on either substrate.
  expected_outcome: >
    A strictly higher final infection at the highest vs lowest dose on both backends
    and seeds (directional agreement), with magnitudes comparable across substrates.

key_assumptions:
  - "Initial viral load is proxied by the number of initially-infected cells (infected_seed.fraction); the ODE v0 input has no field producer at this scale."
  - "Rates are the faithful Sego values (no tuning); the epidemic is slow, so the demonstration runs 120 steps over seeds {0,1}."
  - "Directional (lowest-vs-highest, strict) agreement is the target; intermediate-dose monotonicity is seed-dependent and NOT claimed."

baseline:
  - name: sego-dose-sweep
    composite: viva_multicell_blueprint.composites.sego.sego_crossparadigm
    description: The Sego blueprint run at three initial viral loads on each backend, over rules-seeds {0,1}.
    params:
      backend: cpm
      blueprint: workspace/blueprints/influenza_sego2022.yaml

variants:
  - name: initial-load-sweep
    description: infected_seed.fraction in {0.03, 0.08, 0.15} (seeds 1/3/5 infected cells), rules-seeds {0,1}.
    params: {}

simulation_set:
  - name: dose-response
    status: completed
    base_model: viva_multicell_blueprint.composites.sego.sego_crossparadigm
    seeds: [0, 1]
    metrics:
      seed_infected: "1 / 3 / 5"
      final_infected_cpm_seed0: "1 / 2 / 7"
      final_infected_cpm_seed1: "1 / 3 / 2"
      final_infected_vertex_seed0: "0 / 2 / 5"
      final_infected_vertex_seed1: "1 / 3 / 6"
      strict_low_lt_high_all_cases: true
      intermediate_monotone_universal: false
    pass_fail_tests:
      - "strict-direction-both-backends-and-seeds: pass"
      - "higher-dose-seeds-more-cells: pass"

readouts:
  - name: final_infected_count
    description: Number of infected (type I) cells at the final step, per dose per backend per seed.
    store_path: "mechanics/types"
    units: count
    status: measured

behavior_tests:
  - name: strict-direction-both-backends-and-seeds
    classification: primary
    description: On both backends and both seeds, the highest dose ends with strictly more infected cells than the lowest dose.
    measure: {kind: comparison, field: final_infected_count, low: 0.03, high: 0.15}
    pass_if: {op: strictly_greater, note: "final(0.15) > final(0.03) for cpm/vertex x seeds {0,1}"}
    units: count
    requires_simulation: "true"
  - name: higher-dose-seeds-more-cells
    classification: primary
    description: The higher fraction really does seed more initially-infected cells.
    measure: {kind: comparison, field: seed_infected, low: 0.03, high: 0.15}
    pass_if: {op: strictly_greater, value: "5 > 1"}
    units: count
    requires_simulation: "true"

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "Dose sweep runs on both backends over multiple seeds; the lowest-vs-highest direction is backend-independent."
    biological_validation: "More initial load -> more infection on both substrates (Sego Fig 5/7 direction)."
    pipeline_unblocks:
      - "A magnitude-level dose-response comparison once the ODE V producer lands (Task 21)."
  if_primary_tests_fail:
    diagnose:
      - "Direction breaks on one backend -- check the seeded infected count and run length."
    block_downstream: "Report only directional agreement until magnitudes are reconciled."

limitations:
  - "REVIEW: this is NOT a dose-response relationship -- 3 doses x 2 seeds with an intermediate CPM seed1 (1/3/2) that breaks monotonicity support only a strict lowest-vs-highest DIRECTION. A real dose-response needs 6-10 graded doses x replicate seeds (Stage 4 / BP-05)."
  - "REVIEW: the dose axis is SEEDED INFECTED-CELL FRACTION, which is NOT a virion inoculum; define initial extracellular-virus concentration as a separate experiment once the V producer lands (BP-05/BP-08)."
  - "Directional (lowest-vs-highest) only: intermediate-dose monotonicity is seed-dependent (CPM seed1 is 1/3/2), so a dose-response CURVE is not claimed."
  - "Initial load is proxied by seeded infected cells; the ODE v0 virus input has no producer, so a true viral-titre dose axis is deferred (Task 21)."
  - "Three doses, two seeds, reduced scale/steps -- enough to establish the direction, not a dose-response fit; magnitudes are within the capstone's same-seed spread."

report:
  title: "Dose-response: both substrates agree on the strict direction"
  verdict: >
    Over initial viral loads seeding 1/3/5 infected cells, the highest dose ends with
    STRICTLY more infection than the lowest on both backends and both seeds (CPM
    1/2/7 & 1/3/2, vertex 0/2/5 & 1/3/6 at N=120), so the two substrates agree on the
    DIRECTION of the dose response. Intermediate-dose monotonicity is seed-dependent
    (CPM seed1), so only the directional (low-vs-high) claim is made. Magnitudes are
    comparable and within the capstone's same-seed spread.
  confidence: medium
  evidence_quality: preliminary
  main_insight: >
    The shared field makes the dose-response DIRECTION backend-independent (more seed
    virus -> higher infection probability everywhere); the substrate affects only the
    (noisy) magnitude.
  caveat: >
    Three doses, two seeds, reduced scale; the dose axis is seeded-cell count, not a
    viral titre (ODE v0 has no producer yet); only the strict low-vs-high direction is
    claimed.

findings:
  - id: F1-strict-direction-agreement
    kind: computational
    status: confirms
    statement: >
      Both substrates show a strictly higher final infection at the highest vs lowest
      dose, across seeds {0,1} (CPM 1->7 & 1->2, vertex 0->5 & 1->6), agreeing on the
      direction while intermediate monotonicity is seed-dependent.
    evidence:
      observed: "seed 1/3/5 -> final cpm 1/2/7 (s0), 1/3/2 (s1); vertex 0/2/5 (s0), 1/3/6 (s1); N=120"
    explanation: "More seed virus raises the shared-field infection probability everywhere; the substrate sets only the noisy magnitude."
    next_action: "revisit magnitudes once the ODE V producer lands (Task 21)"
    provenance:
      run_ids: [dose-response]

bibliography:
  sources:
    - key: sego2022
      note: "Sego 2022 Fig 5/7 dose-response direction (infection vs initial viral load)."

visualizations:
  - name: "Dose response — initial load → final infection"
    address: "html:dose-response.html"
    config: {title: "Final infected count vs initial dose, both backends and seeds"}
