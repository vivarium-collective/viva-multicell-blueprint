schema_version: 4
name: adhesion-calibration
created: "2026-10-27"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted

claim: >
  REVISED per the 2026-10-28 vertex-mechanics review. Both substrates' mechanics are now
  DEFINED term by term (docs/mechanics.md). Every vertex parameter is either
  energy-matched to its CPM counterpart (area stiffness K = 2 lambda_volume, per cell
  type), lowered per type PAIR from the blueprint adhesion table (Lambda_ab = kappa *
  J_ab, ratios fixed by J), or CALIBRATED to measured CPM behaviour on the Sego initial
  state, under a hard mesh-validity constraint (no folded faces). With per-pair junction
  tension actually applied and auto_reconnect ON, the tension scale IS identifiable from
  mean cell area: kappa = 1.74 gives area 22.8 vs CPM 23.0. Immune random-walk
  displacement (9.4 vs 9.4 um) and the saturating chemotactic drift curve are matched.
  NOT matched: epithelial wandering. The CPM-matching motility folds the vertex mesh,
  so it is capped at the largest fold-free value and the vertex epithelium wanders
  about 5x less (MSD 2.0 vs 9.5 um^2), though it does exchange neighbours (T1s). Area
  dispersion is not matched either (CV 0.033 vs 0.093), and the kappa that fits the
  small isolated sheet differs (~4).

experiment: >
  (1) Define both mechanical models and their per-type / per-pair parameters
  (docs/mechanics.md). (2) Mechanics-only calibration
  (scripts/calibrate_vertex_mechanics.py): drive each backend directly from the Sego
  initial state with no field / rule / ODE inputs, 60 steps x 5 seeds, and fit the vertex
  knobs that have no CPM counterpart, one observable each:
  - tension_scale -> mean epithelial area;
  - motility -> latent-immune random-walk displacement;
  - sheet_motility -> epithelial MSD about the sheet centre, then CAPPED (stepped down by
    0.8x) until a 3-seed x 400-step run has no inverted / self-intersecting face;
  - tension_noise -> area CV (adopted only if it beats no noise by > 0.01 AND keeps the
    mesh valid);
  - migration_scale + chemotaxis_saturation -> one active macrophage's drift speed vs a
    fixed linear virus gradient (g = 0.001 .. 0.03).
  (3) Re-run the tension_scale sweep on the 4x4 mechanics-only sheet
  (workspace/blueprints/mechanics_sheet.yaml) for 60 steps with reconnection on.
  (4) Count epithelial neighbour exchanges on the Sego sheet over 400 steps.

result: >
  Calibration (Sego state, 5 seeds x 60 steps). CPM targets: mean area 23.0, area CV
  0.093, epithelial MSD 9.54 um^2, latent-immune median displacement 9.37 um. Fitted
  vertex values:
  - tension_scale 1.74 -> area 22.8.
  - motility 236.5 -> displacement 9.36 um (domain walls on).
  - sheet_motility: the MSD fit (83.3) folded the mesh, as did 66.7, 53.3 and 42.7; the
    fold-free cap is 34.1 -> MSD 2.04 um^2.
  - tension_noise 0 -> CV 0.033 (the level that would raise CV toward the CPM's folds
    the mesh).
  Chemotaxis: CPM drift saturates (0.098 / 0.145 / 0.331 / 0.350 um/step at g = 0.001 /
  0.003 / 0.01 / 0.03); the fitted vertex tanh law (migration_scale 3.54, saturation
  105) gives 0.058 / 0.163 / 0.327 / 0.350.
  Neighbour exchange on the Sego sheet by step 400: vertex 4-11 of 85 epithelial pairs
  swapped (gains ~ losses: T1s). CPM 60-74 of 110 lost, a count that includes
  flickering diagonal contacts.
  Mechanics-sheet sweep (60 steps): CPM area 18.9 (CV 0.103). Vertex area falls
  monotonically with tension scale: 24.5 (0.5), 23.7 (1), 22.6 (1.74), 22.2 (2),
  18.5 (4); at 8 the small sheet collapses (area 1.8). On this small sheet the CPM area
  is reached near kappa ~ 4.

purpose:
  question: >
    Are the two substrates' mechanics defined and parameterized so that they are
    mechanically comparable -- per cell type and per type pair -- and which vertex
    parameters are fixed by the CPM, which must be calibrated, and which cannot be?
  mechanism: >
    CPM contact energy J (per neighbour bond) and vertex junction tension Lambda (per
    unit length) both penalize interface; the area constraint lambda_V (V - V_T)^2 and
    the area elasticity K/2 (A - A0)^2 are the same energy up to K = 2 lambda_V; the CPM
    temperature T drives membrane fluctuations and cell wandering that the deterministic
    vertex model must get from active (motility) forces. Tension contracts cells against
    their area elasticity, so the tension scale sets the relaxed area.
  expected_outcome: >
    Area stiffness and adhesion ratios carry over exactly; the overall tension scale,
    motility and chemotactic mobility are identifiable from area, MSD and drift; area
    dispersion may not be reachable.

key_assumptions:
  - "Mechanics-only calibration: no fields / rules / ODE / immune coupling, so only the substrates' own mechanics are compared."
  - "One coupled step = 2 MCS (CPM) = one explicit-Euler step dt = 1 (vertex); viscosity eta = 2*K*A0 = 100 for Euler stability."
  - "CPM temperature 10, neighbour order 2, lambda_volume 1, target size 25 (viva-cpm defaults + blueprint)."
  - "A type pair absent from the adhesion table is J = 0 on CPM (viva-cpm default) and Lambda = 0 on vertex."
  - "Immune cells are overlay islands on the vertex substrate; their random walk is fitted on the LATENT pool (no chemotaxis), their drift on an active macrophage."

simulation_set:
  - name: vertex-mechanics-calibration
    status: completed
    base_model: viva_multicell_blueprint.composites.sego.sego_crossparadigm
    seeds: [0, 1, 2, 3, 4]
    metrics:
      cpm_area_mean: 22.98
      vertex_area_mean: 22.78
      cpm_area_cv: 0.093
      vertex_area_cv: 0.033
      cpm_epi_msd_um2: 9.54
      vertex_epi_msd_um2: 2.04
      cpm_immune_disp_um: 9.37
      vertex_immune_disp_um: 9.36
      fitted_tension_scale: 1.74
      sheet_motility_msd_fit: 83.3
      fitted_sheet_motility_fold_free_cap: 34.1
      fitted_motility: 236.5
      fitted_tension_noise: 0.0
      fitted_migration_scale: 3.54
      fitted_chemotaxis_saturation: 105.0
      chemotaxis_cpm_um_per_step: "0.098 / 0.145 / 0.331 / 0.350 at g = 0.001 / 0.003 / 0.01 / 0.03"
      chemotaxis_vertex_um_per_step: "0.058 / 0.163 / 0.327 / 0.350"
      vertex_epi_pairs_exchanged_by_400: "4-11 of 85 (3 seeds)"
      mesh_valid_3_seeds_x_400_steps: true
    pass_fail_tests:
      - "mechanics-defined: pass"
      - "area-matched: pass"
      - "immune-motility-matched: pass"
      - "chemotaxis-drift-matched: pass (low-gradient point ~40% slow)"
      - "mesh-valid (no folds): pass"
      - "epithelial-msd-matched: fail (capped by mesh validity: 2.0 vs 9.5 um^2)"
      - "area-dispersion-matched: fail"
  - name: adhesion-sweep
    status: completed
    base_model: viva_multicell_blueprint.composites.sego.sego_crossparadigm
    seeds: [0]
    metrics:
      cpm_mean_area: 18.94
      cpm_area_cv: 0.103
      vertex_mean_area_by_scale: "0.5: 24.48, 1: 23.73, 1.74: 22.58, 2: 22.15, 4: 18.46, 8: 1.81 (collapse)"
      vertex_area_cv_by_scale: "0.5: 0.017, 1: 0.020, 1.74: 0.024, 2: 0.026, 4: 0.044, 8: 0.668"
      area_matching_scale_small_sheet: "~4"
    pass_fail_tests:
      - "cpm-sheet-holds-size25-target: pass"
      - "vertex-sheet-comparable (0.5..4): pass"
      - "tension-identifiable-from-area: pass"
      - "j-tension-mapping-monotone: pass"

readouts:
  - name: mean_cell_area
    description: Mean epithelial cell area (CPM volume / vertex face area) at the final step.
    store_path: "mechanics/sizes"
    units: px^2
    status: measured
  - name: area_cv
    description: Coefficient of variation of epithelial cell area.
    store_path: "mechanics/sizes"
    units: dimensionless
    status: measured
  - name: mesh_validity
    description: Inverted or self-intersecting vertex faces (must be 0 at every sampled step).
    store_path: "mechanics/footprints"
    units: count
    status: measured
  - name: epithelial_msd
    description: Mean squared displacement of epithelial cells about the sheet's centre of mass over 60 steps.
    store_path: "mechanics/positions"
    units: um^2
    status: measured
  - name: immune_displacement
    description: Median displacement of the latent immune cells over 60 steps (random walk; no chemotaxis).
    store_path: "mechanics/positions"
    units: um
    status: measured
  - name: chemotactic_drift
    description: x-velocity of one active macrophage in a fixed linear virus field, vs gradient.
    store_path: "mechanics/positions"
    units: um/step
    status: measured

behavior_tests:
  - name: cpm-sheet-holds-size25-target
    classification: primary
    description: The CPM mechanics-only sheet relaxes to a mean area near the size-25 target with low dispersion.
    measure: {kind: stat, field: mean_cell_area, phase: final}
    pass_if: {op: in_range, lo: 12, hi: 40, field: mean_cell_area}
    units: px^2
    requires_simulation: "true"
  - name: vertex-sheet-comparable
    classification: primary
    description: The vertex sheet reaches a mean area of the same order (ratio 0.4..2.5) and low CV, for every swept scale.
    measure: {kind: ratio, field: mean_cell_area, versus: cpm}
    pass_if: {op: in_range, lo: 0.4, hi: 2.5, field: area_ratio}
    units: dimensionless
    requires_simulation: "true"
  - name: tension-identifiable-from-area
    classification: secondary
    description: >
      With per-pair junction tension applied, the vertex mean area decreases
      monotonically with the tension scale (0.5 -> 4) and brackets the CPM area, so the
      scale is identifiable from area (replaces the earlier "directional, not pinned"
      test).
    measure: {kind: monotone, field: mean_cell_area, over: tension_scale}
    pass_if: {op: strictly_decreasing, note: "area(0.5) > area(2) > area(4); CPM area in between"}
    units: px^2
    requires_simulation: "true"
  - name: j-tension-mapping-monotone
    classification: secondary
    description: >
      The neutral-strength -> vertex line-tension lowering is strictly monotone in
      both the strength and the scale (unit test of to_vertex_tension).
    measure: {kind: monotone, field: line_tension, versus: [strength, scale]}
    pass_if: {op: strictly_increasing, note: "tension(scale2) > tension(scale1); tension(strength25) > tension(strength5)"}
    units: dimensionless
    requires_simulation: "false"

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "Both substrates hold the size-25 target; vertex knobs calibrated against the CPM."
    biological_validation: "Mechanically comparable on area, wandering and chemotactic drift -- not on area dispersion."
    pipeline_unblocks:
      - "flu-lung-crossparadigm, crossparadigm-equivalence and dose-response use the calibrated vertex defaults."
  if_primary_tests_fail:
    diagnose:
      - "A sheet collapses/explodes -- check target_size (size-9 dissolves), viscosity (Euler stability) and the area-elasticity knob."
    block_downstream: "Re-run scripts/calibrate_vertex_mechanics.py before the full model."

limitations:
  - "Epithelial wandering is ~5x below the CPM's: the CPM-matching sheet motility folds the vertex mesh (persisted with sub-stepping, perimeter stiffness, faster rosette resolution and larger T1 thresholds), so motility is capped at the fold-free value."
  - "Area dispersion is not matched (vertex CV 0.033 vs CPM 0.093); the tension noise that would raise it folds the mesh."
  - "Calibrated at target size 25 (viscosity 100); other cell sizes need a re-run of the calibration script."
  - "The J<->Lambda scale is geometry-dependent: 1.74 on the Sego sheet vs ~4 on the isolated 4x4 sheet; at 8 the small sheet collapses."
  - "Neighbour exchange is present (T1s) but far below the CPM's contact turnover; the CPM count includes flickering diagonal contacts, so the two are not directly comparable."
  - "At the shallowest gradient (g = 0.001) the vertex macrophage drifts ~40% slower than the CPM one."
  - "Immune contact is edge-on in the CPM (same layer) but face-on overlap on vertex (Sego's 2-layer geometry); kill rates read different contact units."

report:
  title: "Mechanics defined and calibrated under a no-fold constraint: area, immune motility and chemotaxis matched; epithelial wandering ~5x lower"
  verdict: >
    REVISED (2026-10-28 review). Both substrates' mechanics are written out term by term
    with every per-type and per-pair parameter (docs/mechanics.md). On the vertex
    side:
    - auto_reconnect is on (T1 at 0.1 x hexagon side), and neighbours now exchange
      (4-11 of 85 pairs by step 400).
    - The full per-pair tension table is applied (previously one mean tension).
    - Explicit Euler is stabilized (viscosity 2 K A0, 4 sub-steps per coupled step); at
      viscosity 1 the displacement clamp was masking an oscillation.
    - The domain is a wall, as on the CPM.
    Area stiffness and adhesion ratios are energy-matched. Tension scale (1.74 -> area
    22.8 vs 23.0), immune motility (9.4 vs 9.4 um) and the saturating chemotactic drift
    are calibrated to the CPM. The epithelial wandering is NOT matched: every
    CPM-matching sheet motility folds the vertex mesh, so it is capped at the fold-free
    value (MSD 2.0 vs 9.5 um^2). Area dispersion is also unmatched (CV 0.033 vs 0.093).
  confidence: medium
  evidence_quality: preliminary
  main_insight: >
    Once the per-pair tension is actually applied, junction tension sets the relaxed
    cell area, so the J<->Lambda scale is identifiable (geometry-dependent). Without a
    temperature, the vertex model needs active motility to wander. But the tyssue sheet
    can absorb only limited active shear before polygons fold, so it cannot reach CPM
    epithelial fluidity at these parameters. That is a real limit of this vertex
    substrate.
  caveat: >
    Reduced scale, one cell size; epithelial MSD and area CV unmatched; contact geometry
    for immune cells differs by design (overlay vs same-layer).

findings:
  - id: F1-directional-J-tension-mapping
    kind: methodological
    status: informational
    statement: >
      SUPERSEDED (2026-10-28): the earlier "tension non-identifiable" result came from
      the vertex backend collapsing the per-pair table to one mean tension and running
      only 6 steps.
    evidence:
      observed: "earlier: CPM mean 23.6 / CV 0.098; vertex mean 34.9 / CV 0.064; CV spread < 0.01 across scale"
    explanation: "Only the mean tension reached the mesh; the Voronoi tessellation set the area."
    next_action: "see F2"
    provenance:
      run_ids: [adhesion-sweep]
  - id: F2-mechanics-calibrated
    kind: methodological
    status: confirms
    statement: >
      With the mechanics defined and per-pair tension applied, the vertex tension
      scale, immune motility and chemotactic mobility are identifiable and calibrated
      to the CPM (area 22.8/23.0, immune displacement 9.4/9.4 um, drift within ~10% for
      g >= 0.003). Epithelial wandering is capped by mesh validity (MSD 2.0 vs 9.5
      um^2), and area dispersion is unmatched.
    evidence:
      observed: "results/vertex_mechanics_calibration.json"
    explanation: "Tension contracts cells against area elasticity; active motility replaces the CPM temperature's wandering, up to the shear a tyssue sheet tolerates without folding."
    next_action: "a fold-aware topology handler (or a softer epithelium) to reach CPM fluidity; validate on a second geometry / cell size (BP-07)"
    provenance:
      run_ids: [vertex-mechanics-calibration]

