  classification: primary
  description: >
    Over the run the fate 'divide' activity (emitted as probe_a) crosses the 0.5 cutoff at
    least twice — the metabolism↔fate loop oscillates rather than latching.
  measure: {kind: derived_scalar, path: atlas_fate_transitions}
