- name: fate-oscillates
  classification: primary
  description: >
    Over the run the fate 'divide' activity (emitted as probe_a) crosses the 0.5 cutoff at
    least twice — the metabolism↔fate loop oscillates rather than latching.
  measure: {kind: derived_scalar, path: atlas_fate_transitions}
  pass_if: {op: ">=", value: 2}
  pytest_node: tests/model_format/test_atlas_composites.py::test_fate_oscillator_oscillates
  requires_simulation: 'true'
  units: dimensionless

limitations:
- The quantitative period/amplitude are not pinned to an acceptance band yet (only the presence of oscillation is a committed test).
- MaBoSS mean-field istate adds ~5% noise and a one-step lag that sets the period.

composite: viva_multicell_blueprint.composites.coupled_subcellular.coupled_fate_oscillator
baseline:
- name: coupled-fate-oscillator
  composite: viva_multicell_blueprint.composites.coupled_subcellular.coupled_fate_oscillator

claim: >
  Two sub-cellular simulators of different formalisms — an SBML-ODE metabolism and a MaBoSS
  Boolean fate network — can be coupled inside one cell in both directions (the ODE's
  metabolite C pins the fate 'high_C' input, mode A; the fate 'divide' output resets the
  metabolism, mode C) to produce a metabolism↔fate feedback oscillator that neither
  formalism exhibits alone.

experiment: >
  Run coupled_fate_oscillator (a small vertex tissue of CoupledCells) for 40 steps. Record
  one cell's metabolite C and fate 'divide' each step.

outcomes: >
  The time series (viz/coupled-fate-oscillator.html) shows a stable oscillation: C builds
  over ~2 steps, crosses the threshold, pins high_C, the fate 'divide' fires, the division
  resets the metabolism, and the cycle repeats (period ~3 steps). Computed live from real
  tellurium + MaBoSS engines.

notes: |
  Regenerate with `python scripts/gen_atlas_viz.py coupled-fate-oscillator`.
