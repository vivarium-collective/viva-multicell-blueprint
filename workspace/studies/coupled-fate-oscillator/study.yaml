question: |
  Can an SBML-ODE metabolism and a MaBoSS Boolean fate network be coupled inside one cell, in both directions, to produce a metabolism<->fate feedback oscillator that neither formalism shows alone?
study_card:
  goal: |
    Show that two sub-cellular simulators of different formalisms couple into a metabolism<->fate feedback oscillator inside one cell.
  mechanism: |
    Two sub-cellular formalisms in one cell: an ODE metabolism and a MaBoSS fate network, coupled both ways (mode A: metabolite C pins the fate 'high_C' input; mode C: the fate 'divide' output resets the metabolism). The result is a stable period-3 metabolism<->fate oscillator.
  why_before_next: |
    The two-way coupling (modes A+C) is the minimal CoupledCell motif the rest of the atlas builds on; proving it oscillates validates the coupling contract itself.
  expected_result: |
    The fate 'divide' node oscillates (>=2 threshold crossings), so the ODE<->MaBoSS coupling produces a genuine metabolism<->fate feedback cycle.
  main_expert_question: |
    Is a mean-field MaBoSS istate (with its one-step lag) an acceptable stand-in for a stochastic fate network when the fate output gates a fast metabolic reset?
