report:
  verdict: supported
question: |
  Does a declarative scene plus a per-type model registry compile to ONE composite where ODE, Smoldyn-particle and MaBoSS cells run together sharing an extracellular field?
study_card:
  goal: |
    Compile a scene of typed cells to one composite mixing three sub-cellular formalisms over a shared field.
  mechanism: |
    A scene (cells + types) binds each cell by type to a ModelSpec (ODE / particle / Boolean); compile_scene builds one orchestrating process that steps every cell's own adapter and the shared FieldExtracellular each update.
  why_before_next: |
    This is the declarative model-definition format the atlas's CoupledCell work generalises — semantics (a typed scene) separated from mechanics (which solver runs each cell).
  expected_result: |
    The scene compiles to one composite where all three formalisms run and produce molecular state over a shared field — the declarative format works.
  main_expert_question: |
    Should the shared extracellular field carry live efflux/uptake across the membrane now, rather than being plumbed-but-inert this milestone?
