    Cell area drives each cell's metabolism and fate while the three-paradigm consensus holds — every scale composed into one running system with a top-down mechanics→fate coupling.
  if_primary_tests_fail: |
    No commitment, or a diverging consensus, would mean the cross-scale composition fails.
