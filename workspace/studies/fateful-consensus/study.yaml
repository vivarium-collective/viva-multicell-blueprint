design_status: drafted
title: "Fateful consensus: a tri-coupled tissue where cell area drives each cell's metabolism→fate"
kind: confirmatory
confidence: Accepted
investigation: composition-atlas
report:
  verdict: supported
question: |
  Can a tri-coupled consensus tissue drive each cell's sub-cellular fate — the CPM-owned AREA setting the metabolic rate, the metabolite pinning a MaBoSS fate input, the fate committing the cell — so three tissue + two sub-cellular simulators run as one composite?
study_card:
  goal: |
    Compose every scale: a three-paradigm consensus tissue with a per-cell metabolism→fate chain driven top-down by cell area.
  mechanism: |
    On top of the tri-coupled consensus, every cell runs a CoupledCell (an SBML-ODE metabolism whose metabolite C pins a MaBoSS fate). Each step the cell's CPM area sets its ODE rate (kf0 = k*area), C builds and pins high_C, and the fate commits (divide).
  why_before_next: |
    The grand unification of the atlas: three tissue simulators and two sub-cellular simulators in one composite with a live mechanics→metabolism→fate information flow across scales.
  expected_result: |
    Cell area drives each cell's metabolism and fate while the three-paradigm consensus holds — every scale composed into one running system with a top-down mechanics→fate coupling.
  main_expert_question: |
    Should a committed cell's fate feed BACK to the mechanics (e.g. drive division across all three backends), closing the cross-scale loop rather than only flowing top-down?
