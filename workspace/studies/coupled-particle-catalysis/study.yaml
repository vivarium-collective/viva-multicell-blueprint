behavior_tests:
  - name: particle-count-sets-ode-rate
    classification: primary
    description: >
      The ODE product P accumulates (monotone, final > 0) and the live ODE rate constant
      kf0 equals base × the particle C count — the particle population drives the kinetics.
    measure: {kind: comparison, field: ode_product_and_rate_vs_particle_count}
    pass_if: {op: accumulates_and_rate_tracks_count}
    pytest_node: tests/model_format/test_coupled_cell.py::test_mode_b_catalysis_rate_tracks_count
    requires_simulation: 'true'
    units: mixed

limitations:
  - The rate coupling is an empirical calibration (effective volume ~0.65×polygon area);
    faithful near the calibrated regime, drifts outside it.
  - The concave-up acceleration vs a fixed-rate control is shown in the viz but the
    acceleration magnitude is not pinned to an acceptance band.

composite: viva_multicell_blueprint.composites.coupled_subcellular.coupled_particle_catalysis
baseline:
  - name: coupled-particle-catalysis
    composite: viva_multicell_blueprint.composites.coupled_subcellular.coupled_particle_catalysis

claim: >
  A Smoldyn particle simulator and an SBML-ODE can be coupled inside one cell so that the
  particle population drives the ODE's kinetics (mode B): the live count of a particle
  species sets the ODE's rate constant each step, so the ODE product accumulates faster as
  the particle population builds — a cross-formalism catalysis no single engine expresses.

experiment: >
  Run coupled_particle_catalysis (a small vertex tissue of CoupledCells) for 30 steps.
  Record one cell's particle C count and ODE product P each step.

outcomes: >
  The time series (viz/coupled-particle-catalysis.html) shows P accumulating with a rate
  that tracks the particle C count: as the confined A+B→C population builds, the ODE's rate
  constant rises and P accelerates (concave-up), versus a fixed-rate control that stays
  linear. Computed live from real Smoldyn (via the 3.11 bridge) + tellurium.

notes: |
  Regenerate with `python scripts/gen_atlas_viz.py coupled-particle-catalysis`.
