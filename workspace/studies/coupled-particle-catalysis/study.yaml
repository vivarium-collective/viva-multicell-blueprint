question: |
  Can a Smoldyn particle population drive an ODE's kinetics inside one cell, so the ODE product accelerates as the particle count builds (mode B)?
study_card:
  goal: |
    Show that a particle population drives an ODE's kinetics (mode B) inside one cell.
  mechanism: |
    A Smoldyn particle population (A+B->C, confined to the cell polygon) catalyses an ODE S->P: the live particle C count sets the ODE rate constant each step, so the product accumulates faster as the population grows.
  why_before_next: |
    Mode B couples stochastic spatial chemistry to a continuous ODE — the cross-formalism direction the other motifs reuse to let particle counts modulate metabolism.
  expected_result: |
    The ODE product accumulates (P>0) while the particle driver grows, so the particle population genuinely sets the ODE kinetics.
  main_expert_question: |
    The rate map is an empirical effective-volume calibration (~0.65x polygon area); over what conversion regime does it stay faithful before it needs re-fitting?
