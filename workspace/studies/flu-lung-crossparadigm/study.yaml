schema_version: 4
name: flu-lung-crossparadigm
created: "2026-10-27"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: partial
design_status: drafted

claim: >
  The ONE backend-neutral Sego 2022 influenza blueprint compiles to BOTH the CPM
  (viva-cpm) and vertex (vivarium-tyssue) substrates and runs the FULL model
  end-to-end on each. Because the field / rules / systemic-ODE / recruitment
  mechanism is shared byte-for-byte across the two compiles, the two backends are
  INDISTINGUISHABLE from same-backend seed-to-seed noise on cell fate and on
  infected-patch location at this scale -- i.e. the architecture is backend-neutral
  to within seed noise. This is judged against a NULL CONTROL (CPM-vs-CPM across
  rules-seeds), not against zero.

experiment: >
  Compile `workspace/blueprints/influenza_sego2022.yaml` onto CPM and vertex and run
  the full model at a tractable reduced scale (a 50x50-site patch, a 6x6 epithelial
  block + a 12-cell pre-placed latent immune pool). For >=3 CPM rules-seeds AND the
  vertex backend, compute: (1) per-cell fate agreement over the t0 cohort, reported
  RELATIVE to the same-backend (CPM-vs-CPM) seed baseline; (2) dynamics -- the vertex
  I-count trajectory checked for the fraction of steps inside the CPM >=3-seed
  stochastic envelope (a non-circular check); (3) spatial pattern -- infected-patch
  area/centroid/Rg + occupancy IoU, with the representation confound controlled by
  confirming the final-frame cell areas match across backends. Render spatial_playback,
  dynamics_overlay and divergence. Headline figures are regenerated by
  `scripts/regen_capstone_metrics.py` (N=400); the behavior test pins the
  baseline-relative relationship at N=150.

result: >
  Both backends run the full model end-to-end. The NULL CONTROL is decisive: at
  N=400 the cross-backend fate agreement is 0.942 (0.890-1.000), which is WITHIN the
  same-backend seed baselines (CPM-vs-CPM 0.934 [0.906-0.967]; vertex-vs-vertex 0.943
  [0.935-0.949]) -- the two substrates agree on cell fate no less than two CPM seeds
  do. The infected-patch CENTROID (representation-robust) is 6.13 um apart
  cross-backend vs 5.40 um same-backend CPM -- again within seed noise -- and the
  vertex I-count lies inside the CPM 3-seed envelope at 100% of steps. Final-frame
  mean cell areas match (CPM 24.67, vertex 24.51; ratio 0.99), so the spatial
  comparison is NOT representation-confounded (the vertex Voronoi faces, ~46 at t0,
  relax to the target by the end). The only metric modestly below its baseline is the
  raw infected-patch occupancy IoU (cross 0.165 vs same-backend CPM 0.249 / vertex
  0.212), but all three are low because the single infected patch scatters
  stochastically; the gap is small and partly seed-driven. At the CI scale (N=150)
  cross-backend and same-backend CPM fate agreement are equal (0.987 vs 0.987).
  CONCLUSION: no substrate-driven divergence beyond seed noise is detected at this
  scale -- a positive result for backend-neutrality.

purpose:
  question: >
    Does one backend-neutral blueprint reproduce the Sego 2022 influenza model on two
    different mechanical substrates, and -- judged against same-backend seed noise --
    do the substrates diverge?
  mechanism: >
    The epithelial rates, four reaction-diffusion fields, Price-2015 systemic ODE (fed
    live by CellCountStep) and latent-pool immune recruitment are compiled identically
    onto both backends; only the single mechanics node differs (CPM Metropolis flips
    vs tyssue vertex relaxation). If the substrate mattered beyond noise, the
    cross-backend metrics would fall OUTSIDE the same-backend seed spread.
  expected_outcome: >
    Cross-backend fate and patch-location metrics within the same-backend seed
    envelope (backend-neutral), with any residual difference small and attributable
    to stochastic scatter rather than the substrate.

key_assumptions:
  - "The comparison is baseline-relative: cross-backend is judged against the same-backend (CPM-vs-CPM) seed spread, never against zero."
  - "Reduced scale: a 50x50-site patch with a 6x6 epithelial block (NOT paper scale); headline N=400 (~6.7 h sim), CI test N=150, >=3 CPM rules-seeds."
  - "Immune recruitment is activation of a PRE-PLACED LATENT pool at the tissue margin (ruling T20-RECRUIT), not from-nothing insertion."
  - "The systemic-ODE inputs V/L/C/F have NO producer yet and sit at 0 (Task 21 follow-up), so the ODE recruitment drive is weak and the latent pool is barely activated at this scale."
  - "Sego rates are carried verbatim (no tuning); at faithful rates the infection probability is ~0.004/step, so the epidemic is a slow onset."
  - "1 grid unit = 1 um (grid_resolution_um = 1); the vertex Voronoi t0 faces are larger (~46) but relax to the target (~25) by the end, so the final-frame spatial comparison is fair."

baseline:
  - name: sego-influenza-crossparadigm
    composite: viva_multicell_blueprint.composites.sego_crossparadigm
    description: >
      The Sego 2022 influenza blueprint compiled onto each backend and run for N
      coupled steps; the comparison is computed by viva_multicell_blueprint.compare
      over a shared identity registry, against a same-backend seed null control.
    params:
      backend: cpm
      blueprint: workspace/blueprints/influenza_sego2022.yaml

variants:
  - name: cpm-vs-vertex
    description: The two mechanical substrates sharing one compiled mechanism, each over >=3 rules-seeds.
    params: {}

simulation_set:
  - name: crossparadigm-nullcontrol-N400
    status: completed
    base_model: sego-influenza-crossparadigm
    seeds: [0, 1, 2]
    metrics:
      fate_agreement_cross: "0.942 (0.890-1.000)"
      fate_agreement_same_backend_cpm: "0.934 (0.906-0.967)"
      fate_agreement_same_backend_vertex: "0.943 (0.935-0.949)"
      patch_centroid_dist_cross_um: 6.13
      patch_centroid_dist_same_cpm_um: 5.40
      infected_patch_iou_cross: 0.165
      infected_patch_iou_same_cpm: 0.249
      final_mean_area_cpm: 24.67
      final_mean_area_vertex: 24.51
      vertex_inband_fraction: 1.0
      lineage_root_agreement: 1.0
    pass_fail_tests:
      - "both-backends-run-end-to-end: pass"
      - "fate-agreement-within-seed-baseline: pass (cross 0.942 vs same-backend 0.934-0.943)"
      - "spatial-not-representation-confounded (final area ratio 0.99): pass"
      - "vertex-within-cpm-envelope (in-band 1.0): pass"
  - name: crossparadigm-ci-N150
    status: completed
    base_model: sego-influenza-crossparadigm
    seeds: [0, 1, 2]
    metrics:
      fate_agreement_cross: 0.987
      fate_agreement_same_backend_cpm: 0.987
      vertex_inband_fraction: 1.0
      final_area_ratio: 1.00
    pass_fail_tests:
      - "capstone behavior test (tests/test_study_flu_lung_crossparadigm.py): pass"

readouts:
  - name: fate_agreement_vs_baseline
    description: Cross-backend per-cell fate agreement over the t0 cohort, reported against the same-backend (CPM-vs-CPM) seed baseline.
    store_path: "compare/per_cell_agreement"
    units: fraction
    status: measured
  - name: vertex_inband_fraction
    description: Fraction of steps the vertex I-count trajectory lies inside the CPM >=3-seed stochastic envelope (non-circular dynamics check).
    store_path: "compare/dynamics"
    units: fraction
    status: measured
  - name: infected_patch_centroid_and_iou
    description: Infected-patch centroid distance (representation-robust) and occupancy IoU, both reported cross-backend vs same-backend baseline; with the final-frame area match that controls the representation confound.
    store_path: "compare/spatial_pattern"
    units: um / IoU
    status: measured
  - name: lineage_agreement
    description: Whether the same t0 roots proliferate on both backends; trivially 1.0 (no division rule).
    store_path: "compare/lineage_agreement"
    units: fraction
    status: measured

behavior_tests:
  - name: both-backends-run-end-to-end
    classification: primary
    description: The full Sego blueprint compiles and runs on BOTH backends for N coupled steps (N+1 frames) with the whole 48-cell cohort intact.
    measure: {kind: count, field: frames, when: end-of-run}
    pass_if: {op: eq, value: 151, field: n_frames_at_N150}
    units: frames
    requires_simulation: "true"
  - name: fate-agreement-within-seed-baseline
    classification: primary
    description: >
      Cross-backend per-cell fate agreement is NOT meaningfully worse than the
      same-backend (CPM-vs-CPM) seed baseline -- the backend-neutrality claim, judged
      against a null control rather than zero.
    measure: {kind: delta, field: fate_agreement, compare_to: same_backend_cpm_seed_baseline}
    pass_if: {op: gte, value: -0.05, field: cross_minus_baseline}
    units: fraction
    requires_simulation: "true"
    calibration_anchor:
      observed_value: "cross 0.942 vs same-backend CPM 0.934 / vertex 0.943 (N=400)"
      literature_target: "same-backend seed spread (null control)"
      resolution: model
  - name: spatial-not-representation-confounded
    classification: primary
    description: >
      Final-frame mean cell areas match across backends (ratio ~1), so the occupancy
      comparison is a fair morphology comparison, not an artifact of vertex Voronoi
      face size.
    measure: {kind: ratio, field: final_mean_area, versus: cpm}
    pass_if: {op: in_range, lo: 0.6, hi: 1.6, field: area_ratio}
    units: dimensionless
    requires_simulation: "true"
  - name: vertex-within-cpm-envelope
    classification: secondary
    description: The vertex I-count trajectory lies inside the CPM >=3-seed stochastic envelope for most steps (non-circular dynamics agreement).
    measure: {kind: fraction, field: inband}
    pass_if: {op: gte, value: 0.8, field: vertex_inband_fraction}
    units: fraction
    requires_simulation: "true"
  - name: three-figures-render-under-cap
    classification: secondary
    description: spatial_playback, dynamics_overlay (with the CPM-ensemble band) and divergence all render and serialize under the workbench inline cap.
    measure: {kind: size, field: figure_html_bytes}
    pass_if: {op: lt, value: 2500000, field: figure_html_bytes}
    units: bytes
    requires_simulation: "true"

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "One blueprint runs the full Sego model on both substrates; the comparison spine (with a null control) is operational."
    biological_validation: "Backend-neutral to within seed noise -- cell fate and patch location agree across substrates as well as across seeds."
    pipeline_unblocks:
      - "dose-response-crossparadigm (directional agreement over initial viral load)."
      - "ODE V/L/C/F producers (Task 21) to drive meaningful immune recruitment, then re-test at larger scale where a substrate signal could emerge."
  if_primary_tests_fail:
    diagnose:
      - "A backend fails to run the full model -- inspect the mechanics node and shared stores."
      - "Cross-backend falls OUTSIDE the same-backend seed envelope -- then a substrate signal is real; inspect field-sampling / contact-surface coupling."
    block_downstream: "Do not report a cross-paradigm result without the same-backend null control."

limitations:
  - "Reduced scale + modest steps: a demonstration, not paper scale; the epidemic is in slow onset, so any substrate signal is small relative to seed noise -- a larger/longer run could resolve a signal this scale cannot."
  - "The headline is a NULL result (no substrate-driven divergence beyond seed noise), which is scale-dependent: absence of evidence here is not proof the substrates never diverge."
  - "Immune recruitment is a latent-pool approximation (T20-RECRUIT); at this scale the ODE drive rounds to ~0 activations, so the immune arm is barely exercised."
  - "The systemic-ODE inputs V/L/C/F have no producer (Task 21) and sit at 0, further weakening the recruitment drive."
  - "Parameters are the faithful Sego 2022 values (no tuning); divergence/agreement is reported, never forced (anti-goal respected)."
  - "The dynamics acceptance band is the CPM >=3-seed stochastic envelope (reported as such -- the vertex in-band fraction is 1.0), NOT a digitized Sego 2022 figure; a literature band is an open item."
  - "Raw occupancy IoU is modestly lower cross-backend than same-backend, but all values are low (stochastic single-patch scatter); it is reported with its baseline, not as a headline."

report:
  title: "Flu-lung cross-paradigm: one blueprint, two substrates, backend-neutral within seed noise"
  verdict: >
    The capstone works: the single Sego 2022 influenza blueprint runs the FULL model
    (fields, rules, live systemic ODE, latent-pool recruitment) on both the CPM and
    vertex backends. Judged against a NULL CONTROL (CPM-vs-CPM across rules-seeds),
    the two substrates are indistinguishable from seed noise on cell fate
    (cross-backend agreement 0.942 vs same-backend 0.934-0.943 at N=400; equal 0.987
    at N=150) and on infected-patch location (centroid 6.1 um cross vs 5.4 um
    same-backend), and the vertex trajectory lies inside the CPM stochastic envelope
    at 100% of steps. Final cell areas match (24.7 vs 24.5), so the spatial comparison
    is not representation-confounded. The only metric modestly below its baseline is
    raw occupancy IoU, and that is small and partly stochastic. So at this reduced
    scale there is NO substrate-driven divergence beyond seed noise -- a positive
    result for the shared-mechanism architecture. This is preliminary (single vertex
    seed, reduced scale); a substrate signal could still emerge at larger scale.
  confidence: medium
  evidence_quality: preliminary
  main_insight: >
    Sharing the mechanism byte-for-byte isolates the mechanical substrate as the only
    possible source of cross-paradigm difference -- and against a same-backend seed
    null control, no such difference is detectable here. The architecture delivers a
    backend-neutral model at this scale; the earlier "fate agrees, morphology
    diverges" reading was an artifact of comparing a single seed-pair to zero.
  caveat: >
    A null (no-divergence) result at reduced scale with a single vertex seed; the
    immune arm is barely exercised (latent-pool + producer-less ODE inputs); the band
    is the CPM stochastic envelope, not a Sego figure.

findings:
  - id: F1-backend-neutral-within-seed-noise
    kind: computational
    status: confirms
    statement: >
      With the mechanism shared byte-for-byte, cross-backend cell-fate agreement
      (0.942) falls within the same-backend seed baseline (CPM 0.934, vertex 0.943),
      and the vertex trajectory lies 100% within the CPM stochastic envelope: no
      substrate-driven divergence beyond seed noise is detected at this scale.
    evidence:
      observed: "cross 0.942 (0.890-1.000) vs same-backend CPM 0.934 / vertex 0.943; vertex in-band 1.0; N=150 cross == same == 0.987"
    expected:
      range: "cross within the same-backend seed spread (null control)"
    explanation: >
      Fate is computed by the shared field/rules/ODE; the substrate enters only via
      centroid field-sampling + contact-surface, whose effect is below seed noise here.
    next_action: "drive the ODE V/L/C/F producers (Task 21) and re-test at larger scale, where a substrate signal could emerge"
    provenance:
      run_ids: [crossparadigm-nullcontrol-N400, crossparadigm-ci-N150]
  - id: F2-spatial-divergence-is-mostly-stochastic-not-representation
    kind: methodological
    status: confirms
    statement: >
      The low infected-patch IoU is NOT a representation artifact (final mean areas
      match: CPM 24.67 vs vertex 24.51) and is only modestly below the same-backend
      baseline (cross 0.165 vs same-backend ~0.23): most of the spatial scatter is
      stochastic single-patch placement present within a single backend too.
    evidence:
      observed: "final area ratio 0.99; IoU_I cross 0.165 vs same-backend CPM 0.249 / vertex 0.212; centroid 6.1 vs 5.4 um"
    explanation: "The single infected patch moves stochastically; the vertex Voronoi faces relax to target by the end, removing the t0 size confound."
    next_action: "report IoU only with its same-backend baseline; prefer the representation-robust centroid metric"
    provenance:
      run_ids: [crossparadigm-nullcontrol-N400]
  - id: F3-slow-epidemic-at-faithful-rates
    kind: methodological
    status: confirms
    statement: >
      At faithful Sego rates the per-step infection probability is ~0.004 and the ODE
      recruitment inflow rounds to ~0 activations, so at reduced scale the epidemic is
      a slow onset and the latent immune pool is barely activated.
    evidence:
      observed: "virus-field integral grows 0 -> ~180 over 400 steps; H/I/D ~30/5/1 (CPM); activations = 0"
    explanation: "Faithful rates + reduced scale + producer-less ODE inputs -> weak drive; not tuned up (anti-goal)."
    next_action: "add the V/L/C/F producers and/or run longer; keep rates faithful"
    provenance:
      run_ids: [crossparadigm-nullcontrol-N400]

visualizations:
  - name: capstone-spatial-playback
    address: "html:capstone_spatial_playback.html"
    config: {title: "Spatial playback: CPM | vertex"}
  - name: capstone-dynamics-overlay
    address: "html:capstone_dynamics_overlay.html"
    config: {title: "Dynamics vs the CPM stochastic-envelope band"}
  - name: capstone-divergence
    address: "html:capstone_divergence.html"
    config: {title: "Per-cell agreement + spatial map (vs same-backend baseline)"}

bibliography:
  sources:
    - key: sego2022
      note: "Sego et al. 2022 ViralInfectionVTM; the influenza model this blueprint transcribes (params.yaml @ b952eec2)."
    - key: price2015
      note: "Price/Mochan-Keef 2015 in-host immune ODE; the systemic component coupled per Sego 2022."
