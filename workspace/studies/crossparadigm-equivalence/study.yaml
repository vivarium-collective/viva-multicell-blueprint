schema_version: 4
name: crossparadigm-equivalence
created: "2026-10-27"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted
title: "Backend equivalence (TOST)"
confidence: Investigating

parent_studies:
  - {study: flu-lung-crossparadigm, condition: ran, relation: builds-on}
  - {study: substrate-divergence-counterfactual, condition: ran, relation: tests}

claim: >
  SCOPED to Claim 3 (scientific equivalence) -- NOT blueprint fidelity, NOT
  biological validity. RE-RUN 2026-10-28 on the revised vertex substrate (hexagonal
  sheet, immune overlay, auto_reconnect, per-pair tension, CPM-calibrated motility) with
  mechanics-stochastic replicates. On cell FATE the substrates remain equivalent under
  the dependence-aware run-cluster bootstrap: Delta(same-cross) -0.0014, 90% CI
  [-0.0034, +0.0008], inside +/-0.05 (margin not yet biologically justified). On exact
  POSITION they are still NOT equivalent, but the gap shrank about 7-fold: cross 0.472
  vs same-backend 0.608 (Delta +0.135, cluster CI [+0.071, +0.210] vs margin +/-0.10).
  The previous spatial gap (cross 0.083 vs same 1.000) mostly reflected a degenerate
  null. Replicates differed only in rule draws, so same-backend positions were
  identical by construction, and the vertex cells barely moved.

experiment: >
  Run the full Sego blueprint on BOTH backends over rules-seeds {0..5} (N=120).
  Compute, per metric, the same-backend agreement (all within-CPM and within-vertex
  seed pairs = 30 values) and the cross-backend agreement (all 36 CPM x vertex
  pairs). Apply metrics.equivalence_tost (Welch TOST) against a pre-declared margin:
  +/-0.05 for fate agreement, +/-0.10 for the strict exact-position spatial
  agreement (centroids within one cell diameter, 5 um). Report the TOST verdict,
  the difference and its 90% CI for each metric.

result: >
  FATE agreement: same-backend 0.9887 (n=30 pairs), cross-backend 0.9901 (n=36); diff
  -0.0014, pair 90% CI [-0.0045, +0.0016], run-cluster CI [-0.0034, +0.0008], fully
  inside +/-0.05 -> EQUIVALENT. SPATIAL (exact position, centroids within 5 um)
  agreement: same-backend 0.608, cross-backend 0.472; diff +0.135, run-cluster 90% CI
  [+0.071, +0.210], outside the +/-0.10 margin -> NOT equivalent. Median per-cell
  final-frame displacement: cross-backend ~5.7 um vs CPM-vs-CPM 5.2 um and
  vertex-vs-vertex 2.3 um. The cross-backend positional spread is close to the CPM
  replicate spread; the vertex replicates spread less because its epithelium wanders
  ~5x less (mesh-validity cap).

purpose:
  question: >
    Are CPM and vertex EQUIVALENT (not merely "not-distinguishable") under
    replication -- and on which outcome: cell fate, exact spatial position, or both?
  mechanism: >
    Fate is driven by the SHARED field/rule/ODE mechanism (identical across
    backends), so cell-fate outcomes should be backend-neutral. Exact cell position
    is set by each backend's own mechanics (CPM lattice Metropolis vs vertex tension
    relaxation), which differ, so positions may drift apart even when fate agrees.
  expected_outcome: >
    Fate: cross-backend agreement equivalent to the same-backend baseline within a
    small margin (positive TOST). Spatial: a measurable, honestly-reported gap.

key_assumptions:
  - "Equivalence margin is pre-declared, not fitted: +/-0.05 absolute fate agreement, +/-0.10 spatial agreement."
  - "The same-backend seed-to-seed spread is the no-substrate-effect reference (the matched null); equivalence is judged against it, never against zero."
  - "Spatial agreement is a STRICT exact-position metric (cohort centroids within 5 um = one cell diameter) at the final frame; it is a representation-sensitive readout by design."
  - "Reduced scale (50x50 patch, N=120), faithful Sego rates (no tuning)."

baseline:
  - name: sego-equivalence-grid
    composite: viva_multicell_blueprint.composites.sego.sego_crossparadigm
    description: The Sego blueprint on a 6x6 CPM x vertex seed grid, scored for same- vs cross-backend agreement.
    params:
      backend: cpm
      blueprint: workspace/blueprints/influenza_sego2022.yaml

variants:
  - name: seed-grid-6x6
    description: rules-seeds {0,1,2,3,4,5} on each backend -> 30 same-backend pairs + 36 cross-backend pairs.
    params: {}

simulation_set:
  - name: equivalence-grid
    status: completed
    base_model: viva_multicell_blueprint.composites.sego.sego_crossparadigm
    seeds: [0, 1, 2, 3, 4, 5]
    metrics:
      fate_same_mean: 0.9887
      fate_cross_mean: 0.9901
      fate_tost_diff: -0.0014
      fate_tost_ci: "[-0.0045, +0.0016]"
      fate_tost_margin: 0.05
      fate_equivalent: true
      fate_cluster_ci: "[-0.0034, +0.0008] (run-cluster bootstrap, PRIMARY)"
      fate_margin_biologically_justified: false
      spatial_same_mean: 0.608
      spatial_cross_mean: 0.472
      spatial_diff: 0.135
      spatial_cluster_ci: "[+0.071, +0.210]"
      spatial_equivalent: false
      median_displacement_cross_um: 5.7
      median_displacement_same_vertex_um: 2.3
      median_displacement_same_cpm_um: 5.2
      superseded_spatial: "same 1.000 / cross 0.083 (deterministic-mechanics replicates, old vertex substrate)"
      mechanics_seeded_per_replicate: true
    pass_fail_tests:
      - "fate-equivalent-tost: pass"
      - "spatial-equivalent: fail (diff 0.135, CI [+0.071, +0.210] vs margin 0.10)"

readouts:
  - name: fate_agreement
    description: Per-cell fate agreement (same-state fraction over the t0 cohort), per run pair.
    store_path: "mechanics/types"
    units: fraction
    status: measured
  - name: spatial_agreement
    description: Fraction of the t0 cohort whose final centroids are within 5 um between two runs.
    store_path: "mechanics/positions"
    units: fraction
    status: measured

behavior_tests:
  - name: fate-equivalent-tost
    classification: primary
    description: Cross-backend fate agreement is TOST-equivalent to the same-backend baseline within +/-0.05.
    measure: {kind: equivalence, field: fate_agreement, margin: 0.05}
    pass_if: {op: tost_equivalent, note: "90% CI of (same-cross) inside +/-0.05"}
    units: fraction
    requires_simulation: "true"
  - name: spatial-gap-is-dynamic-not-offset
    classification: secondary
    description: Cross-backend spatial agreement is ~1.0 at t0 and drops by the final frame (so the gap is drift, not a systematic offset).
    measure: {kind: comparison, field: spatial_agreement, low: 0.0, high: 1.0}
    pass_if: {op: strictly_greater, note: "cross spatial(t0) > cross spatial(final)"}
    units: fraction
    requires_simulation: "true"

controls:
  - name: same-backend-null
    kind: negative
    description: >
      The same-backend seed-to-seed pairs are the matched null (no substrate change
      -> the only variation is RNG). Equivalence is judged relative to this spread.
  - name: counterfactual-positive-control
    kind: positive
    description: >
      substrate-divergence-counterfactual is the positive control: in a
      mechanics-dominated regime the SAME spatial equivalence test REJECTS, proving
      it can detect a real substrate difference (so a "pass" here is informative).

alternative_hypotheses:
  - hypothesis: "The backends only look equivalent because the metric is insensitive."
    excluded_by: "The counterfactual study rejects equivalence with the same metric/test -> the test has power."
  - hypothesis: "Fate agreement is high only by chance at one seed."
    excluded_by: "6 runs per backend resampled as clusters (run-cluster bootstrap); 90% CI [-0.0034, +0.0008]. The pair-level p was retired as overstated."

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "The shared-mechanism architecture is backend-neutral for cell FATE under replication (positive equivalence)."
    biological_validation: "Fate outcomes transfer between a Cellular-Potts and a vertex substrate within seed noise."
    pipeline_unblocks:
      - "Use either backend interchangeably for fate-level questions; report spatial results with their representation caveat."
  if_primary_tests_fail:
    diagnose:
      - "If fate equivalence fails, the shared mechanism is not actually identical across backends -- check field byte-equality and rule wiring."

limitations:
  - "Fate equivalence is established at the reduced scale (50x50, N=120) with faithful Sego rates; a larger/longer regime is a follow-up."
  - "Exact-position agreement is NOT equivalent (diff 0.135, CI [0.071, 0.210] vs a 0.10 margin), though the gap fell ~7x once the null carried mechanical noise and vertex cells moved."
  - "The vertex epithelium wanders ~5x less than the CPM's (mesh-validity cap), which narrows the vertex-vs-vertex positional spread and contributes to the remaining gap."
  - "The +/-0.10 spatial margin and +/-0.05 fate margin are pre-declared, not biologically justified (BP-06)."
  - "Equivalence is on fate and exact centroid position; a morphology-level equivalence (shape / pattern) is not claimed."
  - "Each backend's mechanics RNG now follows the run seed (mechanics_seed = rules_seed); earlier results used fixed mechanics seeds and are superseded."

report:
  title: "CPM and vertex are EQUIVALENT on fate; position gap fell from 0.92 to 0.14, still not equivalent"
  verdict: >
    RE-RUN (2026-10-28 review: "equivalence is very bad between backends"). With the
    revised vertex substrate and mechanics-stochastic replicates, fate stays
    EQUIVALENT (cross 0.990 vs same 0.989, run-cluster CI [-0.003, +0.001] in +/-0.05).
    Exact-position agreement improved from cross 0.083 vs same 1.000 (gap 0.92) to
    cross 0.472 vs same 0.608 (gap 0.135, CI [0.071, 0.210]). This is still NOT
    equivalent at +/-0.10. Most of the old gap came from a degenerate null:
    same-backend replicates had identical mechanics, so their positions agreed
    perfectly by construction, and the vertex cells barely moved. The remaining gap
    tracks the remaining mechanical difference: the vertex epithelium, capped so its
    mesh never folds, wanders ~5x less than the CPM's (replicate spread 2.3 vs 5.2 um).
  confidence: medium
  evidence_quality: preliminary
  main_insight: >
    A spatial equivalence test is only meaningful if the same-backend null contains
    mechanical noise. Once it does, the remaining positional disagreement is about the
    size of the substrates' remaining mechanical mismatch (epithelial fluidity), not a
    fate effect.
  caveat: >
    Reduced scale; margins not biologically justified; the vertex epithelium is less
    fluid than the CPM's, which bounds how close positions can get.

findings:
  - id: F3-fate-equivalence-holds-on-revised-substrate
    kind: computational
    status: confirms
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      On the revised vertex substrate with mechanics-stochastic replicates, cross-backend
      fate agreement remains equivalent to the same-backend baseline within +/-0.05
      (run-cluster diff -0.0014, 90% CI [-0.0034, +0.0008]).
    evidence:
      observed: "fate same 0.9887, cross 0.9901; cluster CI [-0.0034,+0.0008]"
    explanation: "Fate is driven by the shared field/rule/ODE mechanism, identical across backends."
    next_action: "justify the margin biologically (BP-06)"
    provenance:
      run_ids: [equivalence-grid]
  - id: F4-position-gap-near-margin
    kind: computational
    status: partial
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      Exact-position agreement gap shrank from 0.92 to 0.135 (cluster CI [0.071, 0.210]):
      still not equivalent at +/-0.10. Most of the old gap was a degenerate null
      (identical mechanics across replicates) plus non-moving vertex cells; the rest
      tracks the vertex epithelium's lower fluidity.
    evidence:
      observed: "spatial same 0.608, cross 0.472; median displacement cross 5.7 / same CPM 5.2 / same vertex 2.3 um"
    explanation: "Immune motility and chemotaxis are calibrated, but the vertex epithelium is capped below CPM fluidity to keep the mesh valid."
    next_action: "a fold-aware vertex topology handler to raise epithelial fluidity; scale-aware spatial descriptors (BP-06)"
    provenance:
      run_ids: [equivalence-grid]
  - id: F1-fate-equivalence-positive
    kind: computational
    status: informational
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      SUPERSEDED by F3 (2026-10-28 re-run; same conclusion). Cross-backend fate agreement is EQUIVALENT to the same-backend baseline within
      +/-0.05 under a DEPENDENCE-AWARE run-cluster bootstrap (diff -0.0015, 90% CI
      [-0.003,+0.001]; resampling the 6+6 runs, not the dependent pairs). The margin
      is not yet biologically justified and the CI is tight mainly because between-run
      variance is low at this scale. The pair-level p=5.6e-36 is retired as overstated.
    evidence:
      observed: "fate same 0.9888, cross 0.9902; run-cluster 90% CI [-0.003,+0.001]; margin 0.05; equivalent=True (pair-TOST p=5.6e-36 retired)"
      expected: {range: "cross within +/-0.05 of same"}
    explanation: "Fate is driven by the shared field/rule/ODE mechanism, identical across backends."
    next_action: "none -- resolves the capstone's F1 fail-to-reject into a positive equivalence; re-confirm at larger scale if a spatial-coupled rule is added."
    provenance:
      run_ids: [equivalence-grid]
  - id: F2-spatial-non-equivalence-representation
    kind: computational
    status: informational
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      SUPERSEDED by F4 (2026-10-28): the 1.00 same-backend baseline was an artifact of mechanically deterministic replicates. Exact cell POSITION is NOT backend-equivalent: cross-backend spatial agreement
      is 1.0 at t0 but 0.08 at the final frame (median drift ~8.5 um), while fate and
      final areas match. The capstone's "candidate IoU signal" is this representation
      drift -- the substrate changes where cells sit, not what they become.
    evidence:
      observed: "spatial same 1.000, cross 0.083 (t0 1.000); median cross displacement 8.5 um at N=120"
    explanation: "CPM lattice Metropolis and vertex tension relaxation move cell centroids along different paths even when fate is identical."
    next_action: "report spatial results with the representation caveat; see substrate-divergence-counterfactual for when position becomes mechanistically decisive."
    provenance:
      run_ids: [equivalence-grid]

bibliography:
  sources:
    - key: sego2022
      note: "Sego 2022 influenza model; the shared mechanism whose fate outcomes are tested for backend equivalence."

visualizations:
  - name: "Fate equivalence (TOST)"
    address: "html:equivalence-fate.html"
    config: {title: "Cross- vs same-backend fate agreement with the equivalence margin"}
  - name: "Spatial (exact-position) equivalence (TOST)"
    address: "html:equivalence-spatial.html"
    config: {title: "Cross- vs same-backend exact-position agreement"}
