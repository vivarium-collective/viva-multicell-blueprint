schema_version: 4
name: initial-state-fidelity
created: "2026-10-27"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted

claim: >
  REVISED 2026-11-05: the vertex t0 is now ONE sheet of 48 hexagons (36 epithelial + 12
  latent immune), the immune cells attached at the tissue margin site nearest their
  centroid instead of sitting as overlay islands on it. Epithelial centroid residual
  unchanged (rms 1.60, max 2.44 um); the immune cells move up to one cell diameter onto
  the margin (rms 4.11, max 5.60 um), closing the CPM's medium gap. All 48 cells present,
  types exact. Earlier reading (2026-10-28):   REVISED per the 2026-10-28 vertex-mechanics review. Both backends reproduce the
  blueprint's t=0 state (every cell's centroid, size and type), with every vertex
  polygon corresponding to exactly ONE Sego cell. The CPM side is EXACT (centroid
  residual 0). The vertex epithelium is a regular HEXAGONAL sheet at the target
  area (36 hexagons, area 25.0 each) mapped 1:1 onto the blueprint cells (sub-cell
  residual: RMS 1.60 um, max 2.44 um). The 12 immune cells are overlay islands exactly
  on their centroids, and the fields are overlaid on the tissue rather than meshed: no
  guard-ring or medium polygons remain.

experiment: >
  Compile `workspace/blueprints/influenza_sego2022.yaml` onto CPM and vertex, read
  each backend's t0 emission (no steps), and compare per cell to the resolved
  blueprint cells: centroid distance (RMS, max), type match, and size. For the vertex
  backend also check the mesh: one face per blueprint cell, the epithelial faces
  6-sided at area 25 and forming ONE connected sheet, immune cells as separate overlay
  islands, and no guard / medium faces (`residual_report`: mesh, n_sheet, n_overlay,
  n_guard_faces, sheet_centroid_rms/max, unmapped_ids).

result: >
  2026-11-05: n_sheet 48, n_overlay 0, n_attached_immune 12; sheet_centroid_rms 1.60 um,
  immune_attach_rms 4.11 um (max 5.60). Superseded 2026-10-28 result:   All 48 cells (36 epithelial + 12 latent immune) are present on both backends with
  100% type match. CPM seeds each cell exactly at its blueprint centroid (centroid RMS
  0.000 um, mean size 25.00). The vertex backend builds 48 faces for 48 cells: a
  single connected sheet of 36 regular hexagons (all 6-sided, area 25.0) plus 12
  hexagonal overlay islands. It has 0 guard faces (was 50), 0 unmapped and 0 contested,
  and t0 areas equal the target (was ~46 from the un-relaxed Voronoi). Placement
  residual: epithelium RMS 1.60 um / max 2.44 um (the hexagonal lattice re-tiles the
  blueprint's square 5-um block; cell radius ~2.8 um); overlay 0; all cells RMS 1.39
  um.

purpose:
  question: >
    Do both substrates faithfully reproduce the blueprint's initial centroids, sizes
    and types, with one vertex polygon per blueprint cell?
  mechanism: >
    CPM materializes each blueprint cell 1:1 at its centroid with target_volume =
    size. The vertex backend places the epithelial cells on a regular hexagonal
    lattice of the target area by an optimal 1:1 assignment (alternating with rigid
    recentring on the blueprint cloud). Vertex models relax well from near-hexagonal
    tilings; a square tiling puts every vertex at a degenerate 4-way junction. Immune
    cells become overlay islands at their exact centroids, and the shared fields are
    sampled onto the faces each step instead of being represented by polygons.
  expected_outcome: >
    Exact CPM reproduction; a one-polygon-per-cell hexagonal vertex sheet with a
    sub-cell centroid residual and target-area faces.

key_assumptions:
  - "t=0 is each backend's own initial emission (no coupled steps)."
  - "Centroid residual is Euclidean distance in grid units = um (grid_resolution_um = 1)."
  - "The vertex epithelium is a regular hexagonal tiling (cell area = target size); the blueprint's square block cannot be tiled by regular hexagons without a sub-cell displacement, which is reported, not hidden."
  - "Immune (and latent immune) cells are overlay cells above the sheet (Sego's 2-layer immune geometry), not sheet polygons."

simulation_set:
  - name: t0-fidelity
    status: completed
    base_model: viva_multicell_blueprint.composites.sego.sego_crossparadigm
    seeds: [0]
    metrics:
      n_cells: 48
      cpm_centroid_rms_um: 0.000
      cpm_type_match: "48/48"
      cpm_mean_size: 25.00
      vertex_mesh: hex
      vertex_n_faces: 48
      vertex_n_sheet_hexagons: 36
      vertex_n_overlay: 12
      vertex_n_guard_faces: 0
      vertex_t0_face_area: 25.0
      vertex_sheet_centroid_rms_um: 1.600
      vertex_sheet_centroid_max_um: 2.435
      vertex_centroid_rms_um: 1.386
      vertex_type_match: "48/48"
      vertex_fraction_clean: 1.0
      vertex_n_unmapped: 0
    pass_fail_tests:
      - "cpm-exact-t0: pass"
      - "vertex-clean-identity: pass"
      - "vertex-one-hexagonal-sheet: pass"
      - "all-types-match: pass"

readouts:
  - name: centroid_residual
    description: RMS (and max) Euclidean distance between each backend's t0 centroid and the blueprint centroid.
    store_path: "mechanics/positions"
    units: um
    status: measured
  - name: vertex_residual_report
    description: The vertex mesh report (mesh, n_sheet, n_overlay, n_guard_faces, sheet_centroid_rms/max, unmapped_ids, fraction_clean).
    store_path: "mechanics/residual_report"
    units: counts / um / fraction
    status: measured

behavior_tests:
  - name: cpm-exact-t0
    classification: primary
    description: CPM reproduces every t0 centroid exactly (residual below 1e-6 um) with all types matching.
    measure: {kind: residual, field: centroid_residual, backend: cpm}
    pass_if: {op: lt, value: 1.0e-6, field: centroid_rms}
    units: um
    requires_simulation: "true"
  - name: vertex-clean-identity
    classification: primary
    description: Every cell gets its own vertex polygon (fraction_clean = 1.0, 0 unmapped, 0 guard faces) with a sub-cell centroid residual.
    measure: {kind: residual, field: centroid_residual, backend: vertex}
    pass_if: {op: lt, value: 2.0, field: centroid_rms, note: "fraction_clean == 1.0; n_guard_faces == 0"}
    units: um
    requires_simulation: "true"
  - name: vertex-one-hexagonal-sheet
    classification: primary
    description: The epithelial faces are 6-sided at the target area and form one connected sheet; immune cells are separate overlay islands.
    measure: {kind: topology, field: vertex_residual_report}
    pass_if: {op: eq, value: 36, field: n_sheet, note: "all sheet faces 6-sided, area 25, one component; n_overlay == 12"}
    units: count
    requires_simulation: "true"
  - name: all-types-match
    classification: primary
    description: Both backends place every cell with the correct blueprint type.
    measure: {kind: count, field: type_match}
    pass_if: {op: eq, value: 48, field: n_type_match}
    units: count
    requires_simulation: "true"

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "Both backends faithfully reproduce the blueprint t0 state, one vertex polygon per cell; the cross-paradigm comparison starts from a shared initial condition."
    biological_validation: "The t0 tissue is identical across substrates up to the sub-cell hexagonal re-tiling of the epithelium."
    pipeline_unblocks:
      - "flu-lung-crossparadigm per-cell agreement starts at 1.0 by construction."
  if_primary_tests_fail:
    diagnose:
      - "Vertex placement residual large -- inspect the lattice assignment for an irregular input layout."
      - "CPM residual non-zero -- check the seed-block placement."
    block_downstream: "A non-shared t0 would confound the fate-agreement metric."

limitations:
  - "REVIEW: centroid + cell-count + type identity is necessary but NOT sufficient for BLUEPRINT FIDELITY (Claim 1). Per-cell area, perimeter, footprint IoU, contact-surface, adjacency, boundary, polygon validity, coverage and round-trip (serialize->compile->inspect->reconstruct) are only partly tested here (area + polygon validity + connectivity now are; the rest is Stage 2 / BP-02)."
  - "The hexagonal sheet re-tiles the blueprint's SQUARE block, so the epithelial adjacency differs by construction: 6 neighbours per interior cell on vertex vs 4 edge (+4 corner) on CPM."
  - "Immune cells are overlay islands on vertex but same-layer cells on CPM -- the two substrates represent the immune geometry differently by design (vertex follows Sego's 2-layer model)."
  - "For irregular (data-derived) layouts the hexagonal re-tiling residual will be larger; it is reported per run, not hidden."

report:
  title: "Initial-state fidelity: exact on CPM, one hexagon per cell on vertex"
  verdict: >
    REVISED (2026-10-28 review). Both substrates reproduce the blueprint's 48-cell t=0
    state with 100% type match. CPM is exact (centroid RMS 0.000 um, mean size 25.00).
    The vertex backend no longer builds a guard-ring Voronoi (50 extra polygons
    standing in for medium; square-tiled cells at ~46 um^2; immune cells as oversized
    gap-filling faces). Every vertex polygon is now one Sego cell: a single connected
    sheet of 36 regular hexagons at area 25.0 plus 12 immune overlay islands exactly on
    their centroids, with fields overlaid on the tissue. The epithelial placement
    residual is sub-cell (RMS 1.60 um, max 2.44 um vs cell radius ~2.8 um).
  confidence: high
  evidence_quality: solid
  main_insight: >
    One polygon per blueprint cell, hexagonal and at target area, is the vertex model's
    natural t0. The price is a measurable sub-cell re-tiling of the square blueprint
    block. Meshing the medium (the old guard ring) gave a cleaner centroid residual but
    a less faithful tissue.
  caveat: >
    Adjacency differs by construction (hexagonal vs square); immune geometry differs by
    design (overlay vs same layer).

findings:
  - id: F1-shared-t0-across-substrates
    kind: computational
    status: confirms
    statement: >
      The blueprint's t0 state materializes faithfully on both backends (CPM exact;
      vertex one-hexagon-per-cell with a 1.6 um sub-cell epithelial residual), so the
      cross-paradigm comparison begins from a shared initial condition.
    evidence:
      observed: "48/48 type match; CPM RMS 0.000 um; vertex 36 hexagons (area 25) + 12 overlay, 0 guard, sheet RMS 1.60 um"
    explanation: "CPM seeds cells 1:1; vertex assigns cells 1:1 to a hexagonal lattice of the target area."
    next_action: "Stage 2 (BP-02): contact / adjacency / round-trip fidelity"
    provenance:
      run_ids: [t0-fidelity]

bibliography:
