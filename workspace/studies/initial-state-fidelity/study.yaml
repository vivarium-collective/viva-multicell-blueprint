schema_version: 4
name: initial-state-fidelity
created: "2026-10-27"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted

claim: >
  Both backends reproduce the blueprint's t=0 state -- every cell's centroid, size
  and type -- when the one backend-neutral blueprint is compiled onto each. The CPM
  side is EXACT (centroid residual 0); the vertex side is within a sub-cell residual
  (RMS ~1.2 um) and achieves a clean 1:1 identity for every cell (fraction_clean 1.0).

experiment: >
  Compile `workspace/blueprints/influenza_sego2022.yaml` onto CPM and vertex, read
  each backend's t0 emission (no steps), and compare per cell to the resolved
  blueprint cells: centroid distance (RMS, max), type match, and size. For the
  vertex backend also report the `residual_report` (n_clean, fraction_clean,
  unmapped_ids, n_guard_faces) -- the 1:1 mapping quality of the guard-ring Voronoi
  tessellation.

result: >
  All 48 cells (36 epithelial + 12 latent immune) are present on both backends with
  100% type match. CPM seeds each cell exactly at its blueprint centroid (centroid
  RMS = 0.000 um, mean size 25.00). The vertex backend places all 48 cells with a
  clean, uncontested interior face (n_clean = 48, fraction_clean = 1.0, 0 unmapped,
  50 guard-ring faces excluded); its centroid residual is sub-cell (RMS 1.21 um, max
  2.25 um; cell radius ~2.8 um) and its t0 face areas are larger (mean ~46) because
  the Voronoi tessellation fills the plane before relaxing toward prefered_area.

purpose:
  question: >
    Do both substrates faithfully reproduce the blueprint's initial centroids, sizes
    and types, and how clean is the vertex 1:1 identity?
  mechanism: >
    CPM materializes each blueprint cell 1:1 at its centroid with target_volume =
    size. The vertex backend builds a guard-ring-bounded Voronoi tessellation and
    assigns identity by nearest-centroid over interior faces, so its residual
    measures how many cells get a clean, uncontested face.
  expected_outcome: >
    Exact CPM reproduction; a clean (fraction_clean = 1.0) vertex identity with a
    sub-cell centroid residual.

key_assumptions:
  - "t=0 is each backend's own initial emission (no coupled steps)."
  - "Centroid residual is Euclidean distance in grid units = um (grid_resolution_um = 1)."
  - "Vertex face area at t0 is the Voronoi area (larger than prefered_area); it relaxes under the solver -- fidelity scores centroids/types, not the un-relaxed area."

baseline:
  - name: sego-t0-fidelity
    composite: viva_multicell_blueprint.composites.sego.sego_crossparadigm
    description: The Sego blueprint's t0 emission on each backend, compared to the resolved blueprint cells.
    params:
      backend: cpm
      blueprint: workspace/blueprints/influenza_sego2022.yaml

variants:
  - name: cpm-vs-vertex-t0
    description: The two backends' t0 placement of the same 48-cell initial state.
    params: {}

simulation_set:
  - name: t0-fidelity
    status: completed
    base_model: viva_multicell_blueprint.composites.sego.sego_crossparadigm
    seeds: [0]
    metrics:
      n_cells: 48
      cpm_centroid_rms_um: 0.000
      cpm_type_match: "48/48"
      cpm_mean_size: 25.00
      vertex_centroid_rms_um: 1.212
      vertex_centroid_max_um: 2.253
      vertex_type_match: "48/48"
      vertex_fraction_clean: 1.0
      vertex_n_unmapped: 0
      vertex_n_guard_faces: 50
    pass_fail_tests:
      - "cpm-exact-t0: pass"
      - "vertex-clean-identity: pass"
      - "all-types-match: pass"

readouts:
  - name: centroid_residual
    description: RMS (and max) Euclidean distance between each backend's t0 centroid and the blueprint centroid.
    store_path: "mechanics/positions"
    units: um
    status: measured
  - name: vertex_residual_report
    description: The vertex guard-ring Voronoi 1:1 identity report (n_clean, fraction_clean, unmapped_ids, n_guard_faces).
    store_path: "mechanics/residual_report"
    units: counts / fraction
    status: measured

behavior_tests:
  - name: cpm-exact-t0
    classification: primary
    description: CPM reproduces every t0 centroid exactly (residual below 1e-6 um) with all types matching.
    measure: {kind: residual, field: centroid_residual, backend: cpm}
    pass_if: {op: lt, value: 1.0e-6, field: centroid_rms}
    units: um
    requires_simulation: "true"
  - name: vertex-clean-identity
    classification: primary
    description: The vertex backend achieves a clean 1:1 identity for every cell (fraction_clean = 1.0, 0 unmapped) with a sub-cell centroid residual.
    measure: {kind: residual, field: centroid_residual, backend: vertex}
    pass_if: {op: lt, value: 2.0, field: centroid_rms, note: "fraction_clean == 1.0"}
    units: um
    requires_simulation: "true"
  - name: all-types-match
    classification: primary
    description: Both backends place every cell with the correct blueprint type.
    measure: {kind: count, field: type_match}
    pass_if: {op: eq, value: 48, field: n_type_match}
    units: count
    requires_simulation: "true"

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "Both backends faithfully reproduce the blueprint t0 state; the cross-paradigm comparison starts from a shared initial condition."
    biological_validation: "The t0 tissue is identical across substrates up to a sub-cell vertex residual."
    pipeline_unblocks:
      - "flu-lung-crossparadigm per-cell agreement starts at 1.0 by construction."
  if_primary_tests_fail:
    diagnose:
      - "Vertex unmapped/contested cells -- inspect the guard factor / centroid spacing."
      - "CPM residual non-zero -- check the seed-block placement."
    block_downstream: "A non-shared t0 would confound the fate-agreement metric."

limitations:
  - "Vertex t0 face area is the un-relaxed Voronoi area (~46), larger than prefered_area 25; fidelity scores centroids + types, not that transient area."
  - "The clean fraction_clean = 1.0 holds at this margin spacing; denser packing could contest faces (the residual would then report it)."

report:
  title: "Initial-state fidelity: exact on CPM, clean 1:1 on vertex"
  verdict: >
    Both substrates reproduce the blueprint's 48-cell t=0 state with 100% type match.
    CPM is exact (centroid RMS 0.000 um, mean size 25.00). The vertex backend assigns
    a clean, uncontested interior face to all 48 cells (fraction_clean 1.0, 0
    unmapped, 50 guard faces) with a sub-cell centroid residual (RMS 1.21 um, max
    2.25 um). The cross-paradigm comparison therefore starts from a genuinely shared
    initial condition.
  confidence: high
  evidence_quality: solid
  main_insight: >
    A single backend-neutral initial state lands faithfully on both substrates; the
    only t0 difference is a sub-cell vertex centroid residual from the guard-ring
    Voronoi tessellation -- small enough that per-cell agreement starts at 1.0.
  caveat: >
    The vertex t0 face areas are larger (un-relaxed Voronoi); clean identity depends
    on the margin spacing holding faces uncontested.

findings:
  - id: F1-shared-t0-across-substrates
    kind: computational
    status: confirms
    statement: >
      The blueprint's t0 state materializes faithfully on both backends (CPM exact;
      vertex clean 1:1 with a 1.2 um sub-cell residual), so the cross-paradigm
      comparison begins from a shared initial condition.
    evidence:
      observed: "48/48 type match; CPM RMS 0.000 um; vertex RMS 1.21 um, fraction_clean 1.0, 0 unmapped"
    explanation: "CPM seeds cells 1:1; vertex nearest-centroid assignment over interior faces is uncontested at this spacing."
    next_action: "none -- fidelity is established; consumed by flu-lung-crossparadigm"
    provenance:
      run_ids: [t0-fidelity]

bibliography:
  sources:
    - key: sego2022
      note: "Sego 2022 initial epithelial layout; the blueprint's generative initial_state transcribes it."

visualizations:
  - name: "t0 centroid residuals"
    address: "html:t0-residuals.html"
    config: {title: "Per-cell t0 centroid residual, CPM vs vertex"}
  - name: "t0 side-by-side"
    address: "html:t0-side-by-side.html"
    config: {title: "Initial state: CPM | vertex"}
