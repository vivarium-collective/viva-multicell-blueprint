schema_version: 4
name: bp-01-blueprint-schema
created: "2026-10-28"
status: in-progress
phase: Build
simulation_status: not_run
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted
title: "BP-01 — the blueprint as a versioned, backend-neutral artifact"
kind: methods
confidence: Accepted

parent_studies:
  - {study: initial-state-fidelity, condition: ran, relation: motivates}

claim: >
  Stage 1 / BP-01 of the review program. The canonical blueprint is now a
  VERSIONED, backend-neutral artifact with a checked contract and a static
  validator -- the first of the three claims (blueprint fidelity) made a
  first-class, tested object rather than an implicit input. Specifically:
  (a) a `blueprint_version` field + versioned JSON schema; (b) a canonical/backend
  split (CompileOptions) so backend/run parameters (tension_scale, rules_seed) are
  kept OUT of the canonical biological state and recorded separately; (c) a static
  validator (`validate_blueprint` + `multicell-blueprint validate`) that reports
  structured diagnostics (errors AND contract warnings), not a success badge;
  (d) three hand-authored worked examples that validate and compile identically to
  BOTH backends.

experiment: >
  Add `blueprint.canonical.{CompileOptions, split_canonical, canonical_violations}`,
  `Blueprint.canonical_state()`, `schema.validate_blueprint`, and a CLI `validate`
  command. Add `blueprint_version` to the schema and to the canonical blueprints,
  and strip the run parameter `rules_seed` from the committed Sego blueprint. Author
  three example blueprints (simple geometry, mixed populations, infection field).
  Assert the acceptance criteria as tests.

result: >
  All BP-01 acceptance criteria pass (tests/test_blueprint_canonical.py, 9 tests):
  the same immutable canonical blueprint compiles to both backends;
  `canonical_state()` is identical regardless of backend/run parameters; the
  validator emits structured error/warning diagnostics; a missing blueprint_version
  and in-blueprint backend/run parameters are warnings (not errors). The committed
  Sego and mechanics-divergence blueprints are now versioned and validate
  contract-clean. 174 passed overall.

purpose:
  question: >
    Can the biological blueprint be specified as a versioned, backend-neutral,
    statically-validated artifact, independent of CPM/vertex implementations?
  mechanism: >
    A canonical schema + a split that routes backend/run parameters to CompileOptions
    makes the biological state immutable across backends; a static validator turns
    each semantic invariant into a checked diagnostic.
  expected_outcome: >
    One canonical blueprint accepted unchanged by both backends; backend/run
    parameters recorded separately; validator reports problems explicitly.

key_assumptions:
  - "Backend/run parameters are currently tension_scale (vertex) and rules_seed (run); genuine model constants (const) remain canonical."
  - "blueprint_version is optional for back-compat (a warning, not an error) but set on every canonical artifact going forward."
  - "This is Stage 1: round-trip fidelity of AREA/footprint/contact/topology (BP-02) and physical initialization (BP-03) are the next steps, not claimed here."

baseline:
  - name: canonical-blueprint
    composite: viva_multicell_blueprint.composites.sego.sego_crossparadigm
    description: The Sego canonical blueprint is the worked artifact the schema/validator/compile contract is exercised against.
    params:
      backend: cpm
      blueprint: workspace/blueprints/influenza_sego2022.yaml

simulation_set:
  - name: bp-01-acceptance
    status: completed
    base_model: viva_multicell_blueprint.composites.sego.sego_crossparadigm
    kind: analysis
    metrics:
      schema_versioned: true
      canonical_state_backend_neutral: true
      backend_run_params_separated: "tension_scale, rules_seed -> CompileOptions"
      static_validator: "validate_blueprint + `multicell-blueprint validate`"
      worked_examples_validate_and_compile_both_backends: 3
      canonical_blueprints_contract_clean: "sego, mechanics_divergence"
    pass_fail_tests:
      - "same-canonical-blueprint-both-backends: pass"
      - "backend-run-params-not-canonical: pass"
      - "validator-structured-diagnostics: pass"
      - "worked-examples-validate: pass"

behavior_tests:
  - name: same-canonical-blueprint-both-backends
    classification: primary
    description: The same immutable canonical blueprint compiles to CPM and vertex.
    measure: {kind: contract, field: canonical_state}
    pass_if: {op: both_backends_accept, note: "tests/test_blueprint_canonical.py::test_same_canonical_blueprint_compiles_to_both_backends"}
    requires_simulation: "false"
  - name: backend-run-params-not-canonical
    classification: primary
    description: tension_scale and rules_seed are split out of the canonical blueprint and flagged by the validator.
    measure: {kind: contract, field: canonical_violations}
    pass_if: {op: separated_and_flagged, note: "tests/test_blueprint_canonical.py::test_backend_run_params_are_not_canonical"}
    requires_simulation: "false"
  - name: validator-structured-diagnostics
    classification: primary
    description: validate_blueprint returns {severity, path, message} for errors and contract warnings.
    measure: {kind: contract, field: validate_blueprint}
    pass_if: {op: diagnostics_shape, note: "tests/test_blueprint_canonical.py::test_validator_structured_diagnostics_and_violation_warning"}
    requires_simulation: "false"

controls:
  - name: dirty-blueprint-negative
    kind: negative
    description: A blueprint missing `domain` yields an ERROR diagnostic; a blueprint with tension_scale yields a WARNING — the validator exposes problems, not a badge.

limitations:
  - "BP-01 establishes the schema + contract + validator. It does NOT yet prove area/footprint/contact/adjacency/topology fidelity (BP-02) or physical constraint-satisfying initialization (BP-03)."
  - "The canonical split currently recognizes tension_scale/rules_seed/migration_scale; further backend/run keys are added as backends grow."

report:
  title: "The blueprint is now a versioned, backend-neutral, validated artifact"
  verdict: >
    BP-01 is complete: a versioned canonical schema, a canonical/backend split that
    keeps backend/run parameters out of the biological state (CompileOptions), a
    static validator with structured diagnostics (+ a `validate` CLI), and three
    worked examples that validate and compile identically to both backends. The
    committed Sego and mechanics-divergence blueprints are versioned and
    contract-clean. This makes Claim 1 (blueprint fidelity) a first-class, tested
    object and unblocks Stage 2 (round-trip / geometric fidelity).
  confidence: high
  evidence_quality: solid
  main_insight: >
    The biological specification can be stated once, versioned, and validated
    independently of either substrate; backend/run parameters are a separate,
    recorded concern.
  caveat: >
    Schema + contract + validator only; geometric round-trip fidelity (area,
    footprint, contact, topology) is BP-02, not claimed here.

findings:
  - id: F1-canonical-blueprint-artifact
    kind: computational
    status: confirms
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      One versioned canonical blueprint compiles unchanged to both backends;
      backend/run parameters are separated into CompileOptions and flagged by a
      static validator; three worked examples validate and compile on both backends.
    evidence:
      observed: "9 BP-01 acceptance tests pass; sego + mechanics_divergence validate contract-clean; 174 passed overall"
    explanation: "A canonical schema + split + validator make the biological blueprint a first-class, tested artifact."
    next_action: "Stage 2 / BP-02: prove round-trip geometric fidelity (area, footprint, contact, adjacency, topology) with explicit error measures."
    seeded_study: null
    provenance:
      run_ids: [bp-01-acceptance]

bibliography:
  sources:
    - key: review-2026-10-27
      note: "Cross-paradigm review (references/reviews/influenza_blueprint_feedback.yaml), BP-01."
