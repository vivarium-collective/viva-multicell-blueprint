schema_version: 4
name: substrate-divergence-counterfactual
created: "2026-10-27"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted
title: "Mechanics-dominated counterfactual (positive control)"
kind: adversarial
confidence: Accepted

claim: >
  In a MECHANICS-DOMINATED regime (strong differential adhesion + a strong
  chemoattractant gradient, no shared rules/ODE), the spatial equivalence test still
  REJECTS equivalence after the 2026-10-28 vertex revision. Cross-backend spatial
  agreement is 0.417 vs same-backend 0.775 (diff +0.358 > margin 0.10), now with
  mechanics-stochastic replicates, so the same-backend baseline is a genuine
  stochastic null rather than 1.0 by construction. It remains the POSITIVE CONTROL:
  the same test that finds the Sego model fate-equivalent detects a substrate
  difference here. REVISED MECHANISM: the earlier attribution (vertex A cells
  climbing the gradient to y~17.9 while CPM stays at ~10.7) was an artifact of the old
  uncalibrated vertex chemotaxis. With chemotactic drift calibrated to the CPM
  (saturating), neither substrate moves A far (CPM mean y 11.0 -> 11.0, vertex 10.7
  -> 10.1). The divergence is now positional / sorting dynamics, not migration
  direction, and is not yet causally isolated.

experiment: >
  Run a mechanics-only blueprint (workspace/blueprints/mechanics_divergence.yaml:
  types A/B, A self-adhesive and repelled by B, a chemo field secreted by B with
  strong chemotaxis on A) on BOTH backends over rules-seeds {0,1,2} (N=80). Score
  the same-backend and cross-backend exact-position spatial agreement and apply the
  SAME metrics.equivalence_tost used by crossparadigm-equivalence (margin +/-0.10).

result: >
  Spatial agreement (N=80, seeds {0,1,2}, mechanics seeded per replicate):
  same-backend 0.775, cross-backend 0.417; TOST diff +0.358, outside +/-0.10 -> NOT
  equivalent. Type-A mean y: CPM 11.0 -> 11.0 (seeds 10.7 / 10.1 / 12.2); vertex
  10.7 -> 10.1 (10.4 / 9.9 / 10.0). The large directed-migration difference reported
  earlier no longer appears once the vertex chemotaxis is calibrated to the CPM's
  saturating drift.

purpose:
  question: >
    When MECHANICS (not the shared mechanism) drives the outcome, does the
    equivalence test correctly REJECT -- i.e. does it have the power to detect a real
    substrate difference?
  mechanism: >
    CPM moves cells by Metropolis acceptance of lattice copies (chemotaxis as an
    energy bias); the vertex fork moves them by the ActiveMigration director sampled
    from the field gradient. Under a strong gradient these displace cells by
    different amounts, and CPM's Potts neighbour-swapping sorts differentially-
    adhesive cells in a way the vertex topology resists -- so the spatial outcome
    genuinely depends on the substrate.
  expected_outcome: >
    Cross-backend spatial agreement well below the same-backend baseline; the TOST
    REJECTS equivalence.

key_assumptions:
  - "Mechanics-only (no rules/ODE/immune) so nothing shared forces agreement; the knobs are deliberately strong to enter a mechanics-dominated regime."
  - "Nothing is tuned to hit a target; the study reports whatever the TOST returns (it rejected)."
  - "Same spatial metric + TOST + margin as crossparadigm-equivalence, so the two verdicts are directly comparable."

baseline:
  - name: mechanics-divergence
    composite: viva_multicell_blueprint.composites.sego.sego_crossparadigm
    description: The mechanics-dominated blueprint compiled onto each backend (adhesion + chemotaxis only).
    params:
      backend: cpm
      blueprint: workspace/blueprints/mechanics_divergence.yaml

variants:
  - name: both-backends-seeds
    description: rules-seeds {0,1,2} on each backend (confirms the divergence is structural, not seed noise).
    params: {}

simulation_set:
  - name: counterfactual-divergence
    status: completed
    base_model: viva_multicell_blueprint.composites.sego.sego_crossparadigm
    seeds: [0, 1, 2]
    metrics:
      spatial_same_mean: 0.775
      spatial_cross_mean: 0.417
      spatial_tost_diff: 0.358
      spatial_tost_margin: 0.10
      spatial_equivalent: false
      typeA_mean_y_cpm: "11.0 -> 11.0"
      typeA_mean_y_vertex: "10.7 -> 10.1"
      superseded: "same 1.000 / cross 0.200; vertex A to y 17.9 (old uncalibrated vertex chemotaxis, deterministic replicates)"
      mechanics_seeded_per_replicate: true
    pass_fail_tests:
      - "spatial-equivalence-rejected: pass (test has power)"
      - "migration-direction-differs: superseded (calibrated chemotaxis: neither substrate migrates A far)"

readouts:
  - name: spatial_agreement
    description: Fraction of the t0 cohort whose final centroids are within 5 um between two runs.
    store_path: "mechanics/positions"
    units: fraction
    status: measured
  - name: typeA_mean_final_y
    description: Mean final y of the migrating type-A population, per backend (migration readout).
    store_path: "mechanics/positions"
    units: um
    status: measured

behavior_tests:
  - name: spatial-equivalence-rejected
    classification: primary
    description: The spatial equivalence TOST REJECTS in this mechanics-dominated regime (the test has power).
    measure: {kind: equivalence, field: spatial_agreement, margin: 0.10}
    pass_if: {op: tost_not_equivalent, note: "cross spatial agreement << same; diff > margin"}
    units: fraction
    requires_simulation: "true"
  - name: migration-direction-differs
    classification: primary
    description: >
      REVISED (2026-10-28): with calibrated chemotaxis, neither substrate carries type A
      far up the gradient, so the divergence is not a directed-migration difference.
    measure: {kind: comparison, field: typeA_mean_y_change, low: -40.0, high: 40.0}
    pass_if: {op: lt, value: 3.0, field: abs_typeA_mean_y_change, note: "both backends"}
    units: um
    requires_simulation: "true"

controls:
  - name: same-backend-null
    kind: negative
    description: Same-backend pairs (mechanics seeded per replicate) give spatial agreement 0.775 -- the stochastic matched null the cross term is judged against.

alternative_hypotheses:
  - hypothesis: "The divergence is just seed noise."
    excluded_by: "Same-backend replicates now differ mechanically (agreement 0.775) and the cross term (0.417) is still below them by more than the margin."
  - hypothesis: "The divergence is a raster/metric artifact."
    excluded_by: "Not yet excluded: with the migration readout no longer separating the substrates (A mean y 11.0 vs 10.1), the positional cause needs isolation (adhesion / gradient sweep)."

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "The equivalence test has demonstrated power: it rejects when the substrate genuinely matters."
    biological_validation: "When mechanics drives the outcome (migration/sorting), the substrate choice changes the spatial result -- use both backends and compare."
    pipeline_unblocks:
      - "Validates the positive equivalence verdict of crossparadigm-equivalence as informative."
  if_primary_tests_fail:
    diagnose:
      - "If the test did NOT reject here, the metric/margin is too insensitive -- tighten before trusting any equivalence verdict."

limitations:
  - "REVIEW: an artificial mechanics-only regime with a strong gradient + differential adhesion -- it shows the test has POWER but cannot establish sensitivity to realistic influenza-relevant discrepancies."
  - "Replicates are now stochastic in their mechanics (mechanics_seed = rules_seed); power should still be mapped by graded injected deviations (effect-size sweep) and a matched-physical-response control (Stage 4 / BP-06, BP-07)."
  - "The cause of the remaining divergence (sorting / positional dynamics) is not yet isolated; the earlier migration-direction explanation is retired."
  - "Mechanics-only, so fate is static; the divergence is spatial/positional by construction."
  - "Demonstrates the test's POWER and that mechanics-driven outcomes are substrate-sensitive; it does not quantify a biological effect size."

report:
  title: "A mechanics-dominated regime where the substrates still DIVERGE (test has power)"
  verdict: >
    RE-RUN (2026-10-28). With the revised, calibrated vertex substrate and
    mechanics-stochastic replicates, spatial equivalence is still REJECTED (cross
    0.417 vs same 0.775, diff +0.358 vs margin 0.10), so this remains a valid
    positive control for crossparadigm-equivalence. The earlier mechanism (vertex A
    cells climbing the gradient to y~17.9) came from the old uncalibrated vertex
    chemotaxis and is retired. With drift calibrated to the CPM, neither substrate
    moves A far (CPM y 11.0 -> 11.0, vertex 10.7 -> 10.1). The residual divergence is
    positional / sorting dynamics and still needs causal isolation.
  confidence: medium
  evidence_quality: preliminary
  main_insight: >
    The equivalence test is not rigged to say "equivalent". But a positive control is
    only as good as its mechanics: part of the old divergence was a calibration
    artifact, not a substrate property.
  caveat: >
    An engineered extreme; mechanics-only (fate static); 3 seeds; cause of the
    remaining divergence not isolated.

findings:
  - id: F2-test-still-rejects-mechanism-revised
    kind: computational
    status: confirms
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      On the calibrated vertex substrate with stochastic replicates, the spatial TOST
      still rejects (cross 0.417 vs same 0.775, diff +0.358), but not because of
      directed migration: neither substrate moves type A far up the gradient.
    evidence:
      observed: "spatial same 0.775, cross 0.417; A mean y CPM 11.0 -> 11.0, vertex 10.7 -> 10.1; N=80, seeds {0,1,2}"
      expected: {range: "cross << same; TOST rejects"}
    explanation: "Differential-adhesion sorting / positional dynamics differ between lattice Metropolis and vertex T1 rearrangement; not yet isolated."
    next_action: "sweep adhesion contrast and gradient strength to map where equivalence breaks (BP-06/BP-07)"
    provenance:
      run_ids: [counterfactual-divergence]
  - id: F1-equivalence-test-has-power
    kind: computational
    status: informational
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      SUPERSEDED by F2 (2026-10-28): the vertex up-gradient climb was produced by the old, uncalibrated linear ActiveMigration mapping. In a mechanics-dominated regime the spatial equivalence TOST REJECTS (cross
      0.20 vs same 1.00, diff +0.80 vs margin 0.10), driven by a directed migration
      difference (vertex A to y~17.9, CPM A to y~10.7). The equivalence test can
      detect a real substrate difference, so crossparadigm-equivalence's positive
      verdict is informative, not an insensitivity artifact.
    evidence:
      observed: "spatial same 1.000, cross 0.200; type-A mean final y cpm 10.7 vs vertex 17.9 (start 7); N=80, seeds {0,1,2}"
      expected: {range: "cross << same; TOST rejects"}
    explanation: "Vertex ActiveMigration climbs the field gradient; CPM Metropolis chemotaxis barely moves cells at this strength, and Potts sorting differs from vertex topology."
    next_action: "none -- serves as the positive control; could be swept over gradient strength to map where equivalence breaks."
    provenance:
      run_ids: [counterfactual-divergence]

bibliography:
  sources:
    - key: sego2022
      note: "Adhesion / chemotaxis knobs are the Sego-blueprint mechanisms, driven into a mechanics-dominated regime as a control."

visualizations:
  - name: "Spatial equivalence — REJECTED (TOST)"
    address: "html:equivalence-spatial.html"
    config: {title: "Cross- vs same-backend spatial agreement in the divergent regime"}
  - name: "Mechanics-dominated playback — CPM vs vertex"
    address: "html:spatial-playback.html"
    config: {title: "Divergent migration/sorting: CPM voxel | vertex polygon"}
