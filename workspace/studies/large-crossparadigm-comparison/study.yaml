schema_version: 4
name: large-crossparadigm-comparison
created: "2026-11-12"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: pending
design_status: drafted
title: "Three substrates on the large Sego model (behavior-metric distances)"
kind: comparison
confidence: Investigating
investigation: influenza-crossparadigm

parent_studies:
  - {study: flu-lung-crossparadigm, condition: ran, relation: leads-to}

question: >
  On the LARGE Sego 2022 blueprint (120x120, ~225-cell epithelium), how far does each
  mechanical substrate's emergent MOVEMENT and INTERACTION pattern sit from the CPM
  reference, measured by the cross-paradigm behavior metrics (per-cell displacement,
  MSD, neighbour-graph churn, infection-front speed, cell sorting)? Each metric is a
  DISTANCE from the CPM; the same-backend seed-to-seed distance is the null floor a
  match must approach.

experiment: >
  Run sego_crossparadigm_large on CPM, vertex and center-based over rules-seeds
  {0,1,2} (N=60, 254 cells). For each behavior metric, score the cross-backend
  distance from the CPM (all seed combos) against the CPM-self seed-pair null floor.
  Script: scripts/compare_large_crossparadigm.py (results.json).

result: >
  N=60, 254 cells, seeds 0-2. Distances as mean [cross/null x]:
  per-cell displacement -- null 3.77, VERTEX 2.93 (0.8x: within seed noise of the CPM),
  MUNK 8.52 (2.3x). MSD -- null 3.25, VERTEX 8.89 (2.7x: under-fluctuates), MUNK 75.4
  (23x: over-mobile). neighbour-graph -- null 0.41, VERTEX 0.45 (1.1x), MUNK 0.48 (1.2x):
  both near the CPM's contact-churn. front-speed -- null 1.54, VERTEX 3.59 (2.3x), MUNK
  7.37 (4.8x). sorting -- null 0.014, VERTEX 0.123 (8.5x: sorts differently -- its biggest
  gap), MUNK 0.021 (1.4x: near CPM). Each substrate matches a DIFFERENT facet of the CPM.

purpose:
  question: >
    Now that center-based (munk) cells move and interact and the tissue is large
    enough for real spatial dynamics, which substrate reproduces the CPM's interaction
    pattern, and on which axes does each diverge?
  mechanism: >
    All three backends run the SAME shared mechanism (fields, rules, immune ODE) on
    the SAME large blueprint; only the mechanics node differs. Differences in the
    behavior metrics are therefore attributable to the substrate (CPM Metropolis
    lattice vs vertex confluent polygons vs center-based discs), not the biology.
  expected_outcome: >
    Vertex sits closest to the CPM on most axes but under-fluctuates (the capped-
    motility gap handed to vertex-cpm-fluctuation-match); center-based now MOVES
    (validating the munk fix) but, being uncalibrated, diverges most on displacement /
    MSD. The study reports the honest distances, not a forced agreement.

key_assumptions:
  - "The CPM is the reference substrate; vertex and munk are scored as distance-to-CPM on the shared large blueprint, same seeds."
  - "Behavior metrics (compare/metrics.py) are the minimization target; the same-backend (seed-varied) distance is the matched null floor each cross distance is judged against."
  - "Nothing is tuned here to force agreement — the study characterizes the substrates as they stand after the munk fix; calibration lives in adhesion-calibration / vertex-cpm-fluctuation-match."

baseline:
  - name: sego-large
    composite: viva_multicell_blueprint.composites.sego.sego_crossparadigm_large
    params: {backend: cpm}

canonical_runs:
  - name: behavior-distances
    default: true
    script: scripts/compare_large_crossparadigm.py
    args: ["60", "--json", "workspace/studies/large-crossparadigm-comparison/results.json"]
    label: "3-way behavior-metric distances on the large Sego model (N=60, seeds 0-2)"

# The behavior metrics compared across substrates (each a cross-backend distance-to-CPM).
readouts:
  - name: per_cell_displacement_distance
    description: RMS over the t0 cohort of |Δpos_vertex/munk − Δpos_cpm| per step (trajectory divergence).
    store_path: "mechanics/positions"
    units: um
    status: measured
  - name: msd_distance
    description: Cohort-matched RMS gap between the two MSD(t) curves (motility-amplitude divergence).
    store_path: "mechanics/positions"
    units: um^2
    status: measured
  - name: neighbour_graph_distance
    description: Per-step Jaccard distance between the two contact graphs on the shared cohort (interaction-pattern divergence).
    store_path: "mechanics/neighbors"
    units: fraction
    status: measured
  - name: front_speed_distance
    description: RMS gap between the I-patch front-advance curves (infection-spread-geometry divergence).
    store_path: "mechanics/positions"
    units: um
    status: measured
  - name: sorting_index_distance
    description: RMS gap between same-type-neighbour-fraction curves (cell-sorting divergence).
    store_path: "mechanics/neighbors"
    units: fraction
    status: measured

behavior_tests:
  - name: munk-moves-and-interacts
    classification: primary
    description: Center-based cells now MOVE and change contacts — the munk per-cell displacement distance is well above a frozen baseline (validates the munk fix in this large regime).
    measure: {kind: distance, field: per_cell_displacement_distance, backend: munk}
    pass_if: {op: gt, value: 0.5, note: "munk displacement distance >> 0 (was ~0 when frozen)"}
    units: um
    requires_simulation: "true"
  - name: vertex-closest-to-cpm
    classification: primary
    description: Vertex sits closer to the CPM than center-based on the motility axes (displacement + MSD distance).
    measure: {kind: comparison, field: msd_distance}
    pass_if: {op: lt, note: "vertex_vs_cpm < munk_vs_cpm on displacement and MSD"}
    units: um^2
    requires_simulation: "true"
  - name: distances-above-null-floor
    classification: primary
    description: Each cross-backend distance is reported against the CPM-self (seed-varied) null floor, so a genuine substrate difference is distinguished from seed noise.
    measure: {kind: null_control, field: all_metrics}
    pass_if: {op: reported, note: "cross vs null floor reported per metric"}
    units: mixed
    requires_simulation: "true"

controls:
  - name: cpm-self-null
    kind: negative
    description: CPM-vs-CPM (seed-varied) distance per metric — the matched null floor; a vertex/munk match must approach this, not 0.

alternative_hypotheses:
  - hypothesis: "The substrates already agree on movement/interaction (differences are seed noise)."
    excluded_by: "The CPM-self null floor is reported alongside every cross distance; cross distances that exceed the null are real substrate differences."
  - hypothesis: "Center-based still doesn't move (the fix didn't take at scale)."
    excluded_by: "The munk displacement/MSD distances are well above the frozen baseline on the 225-cell tissue (munk-moves-and-interacts test)."

limitations:
  - "N=60 steps, 3 seeds — a characterization run, not a long-horizon or high-replication study."
  - "The behavior metrics are necessary but not sufficient for full pattern identity; visual (flipbook) agreement is a secondary check."
  - "munk force parameters (jitter / adhesion-scale / chemotaxis-gain) are principled but uncalibrated; their values are pinned by adhesion-calibration, not here."

falsifiability: >
  If the cross-backend distances were indistinguishable from the CPM-self null on every
  metric, the substrates would be behaviorally equivalent on the large model and no
  calibration would be warranted. The reported distances overturn that.

report:
  title: "How far each substrate's movement/interaction pattern sits from the CPM (large Sego)"
  verdict: >
    Three-way behavior-metric comparison on the large Sego model (N=60, 254 cells,
    seeds 0-2). No substrate matches the CPM on every axis; each diverges on specific
    ones, giving concrete calibration targets. VERTEX is closest on per-cell trajectory
    (displacement 2.93, BELOW the CPM-self null 3.77 -- within seed noise) and contact
    churn (0.445 vs null 0.414), but UNDER-FLUCTUATES (MSD 2.7x null -- the capped-
    motility ceiling handed to vertex-cpm-fluctuation-match) and SORTS cells differently
    (sorting 8.5x null -- its largest gap). CENTER-BASED (munk) now MOVES and interacts
    (displacement 8.52, MSD 75.4 -- validating the munk fix; it was frozen before), with
    contact topology (0.482) and sorting (0.021) CLOSE to the CPM, but is OVER-mobile
    (MSD 23x null) and diverges most on infection-front speed (4.8x null) -- uncalibrated.
  confidence: medium
  evidence_quality: preliminary
  objective: >
    Quantify, with the new behavior metrics, the distance-to-CPM of the vertex and
    center-based substrates' emergent movement and interaction patterns on the large
    Sego blueprint, against the CPM-self null floor.
  main_insight: >
    Each substrate reproduces a DIFFERENT facet of the CPM: vertex matches per-cell
    trajectories and contact churn but under-fluctuates and mis-sorts; center-based
    (now unfrozen) matches contact topology and sorting but over-moves. The behavior
    metrics localize exactly which axis each substrate needs calibrated on.
  caveat: >
    N=60, 3 seeds; munk parameters uncalibrated; metrics are a necessary-not-sufficient
    proxy for full pattern identity.

study_card:
  goal: "Measure how close vertex and center-based get to the CPM's movement/interaction pattern on the large Sego model, as distance-to-CPM behavior metrics."
  mechanism: >
    Same shared mechanism + same large blueprint on all three substrates; only the
    mechanics node differs, so behavior-metric distances isolate the substrate effect.
  why_before_next: >
    Establishes the quantitative baseline the calibration studies (adhesion-calibration,
    vertex-cpm-fluctuation-match) minimize against, on the large tissue.
  expected_result: "Vertex closest to CPM (but under-fluctuating); center-based moves but diverges most; all distances above the null floor."
  main_expert_question: "Which metric axis matters most as the headline distance-to-CPM target for calibration?"
