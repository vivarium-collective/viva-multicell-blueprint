investigation: composition-atlas
report:
  verdict: supported
question: |
  Can three mechanics paradigms — Cellular Potts (voxel), vertex (polygon) and center-based (disc) — run ONE shared cell set, coupled into a consensus where vertex owns shape, munk owns position and CPM owns area?
study_card:
  goal: |
    Couple three tissue simulators on one cell set into a single consensus tissue.
  mechanism: |
    CPM, vertex and munk each simulate the same cells; each step the three centroids converge to a munk-weighted consensus, the CPM rasterizes the vertex shape at that position, and the CPM's occupied area sizes the munk disc and the vertex target.
  why_before_next: |
    The multi-tissue foundation of the atlas — one cell set carrying three mechanics paradigms at once, each contributing what it models best (CPM area, vertex shape, munk position).
  expected_result: |
    Three mechanics paradigms run one shared cell set and stay coupled into a consensus (spread bounded, cells persist) — a genuine multi-tissue composite.
  main_expert_question: |
    Should the consensus weights (munk-dominant for position) be learned from a reference tissue rather than fixed, so the blend adapts to the regime?
