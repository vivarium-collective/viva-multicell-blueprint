  Three mechanics paradigms — Cellular Potts (voxel), vertex (polygon) and center-based (disc) — can simulate ONE shared cell set at once, coupled into a single consensus in which vertex owns each cell's shape, munk owns its position and CPM owns its area, so the three backends stay within a few micrometres of each other rather than diverging into separate tissues.
