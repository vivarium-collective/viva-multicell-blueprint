title: 'Heterotypic tissue regions: a vertex epithelium on a munk mesenchyme, coupled at an interface'
kind: confirmatory
confidence: Accepted
investigation: composition-atlas
report:
  verdict: supported
question: |
  Can one tissue be composed of two compartments simulated by DIFFERENT mechanics -- a vertex epithelium sitting on a center-based munk mesenchyme -- coupled at their interface?
study_card:
  goal: |
    Model a tissue cross-section as two tissue types, each simulated by the mechanics that fits it.
  mechanism: |
    The epithelium (a sheet) is a vertex backend; the mesenchyme (loose cells) is a center-based munk backend. They share a domain and are coupled at their interface: the epithelium's basal edge is a reflective floor the mesenchyme presses up against but cannot cross.
  why_before_next: |
    A different KIND of multi-tissue composition from the consensus: not three paradigms on one cell set, but two tissues of different types meeting at a boundary -- the way real organs layer epithelium on stroma.
  expected_result: |
    A vertex epithelium and a munk mesenchyme coexist in one tissue, coupled at an interface the mesenchyme cannot cross -- two tissue types, two physics, one composite.
  main_expert_question: |
    Should the coupling be bidirectional -- the mesenchyme pushing the epithelium up (buckling it) -- rather than only the epithelium confining the mesenchyme?
