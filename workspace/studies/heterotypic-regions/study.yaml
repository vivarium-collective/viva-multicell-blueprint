behavior_tests:
- name: both-tissues-coexist
  classification: primary
  description: |
    Both compartments persist together (>=16 cells: the vertex epithelium and the munk mesenchyme coexist in one domain).
  measure:
    kind: derived_scalar
    path: atlas_cells_min
  pass_if:
    op: '>='
    value: 16
  gate_class: acceptance_criterion
  requires_simulation: 'true'
  units: cells
- name: interface-holds
  classification: primary
  description: |
    The interface functions as a boundary: at most a few mesenchyme cells breach it per step before being reflected, so the mesenchyme does not flood through the epithelium.
  measure:
    kind: derived_scalar
    path: atlas_breaches_max
  pass_if:
    op: <=
    value: 4
  gate_class: acceptance_criterion
  requires_simulation: 'true'
  units: count
conclusion_verdicts:
  if_primary_tests_pass: |
    A vertex epithelium and a munk mesenchyme coexist in one tissue, coupled at an interface the mesenchyme cannot cross -- two tissue types, two physics, one composite.
  if_primary_tests_fail: |
    A collapsing compartment or an interface the mesenchyme floods through would mean the two tissues do not couple.
conclusion_logic:
  if_primary_tests_pass:
    verdict: supported
    summary: |
      A vertex epithelium and a munk mesenchyme coexist in one tissue, coupled at an interface the mesenchyme cannot cross -- two tissue types, two physics, one composite.
  if_primary_tests_fail:
