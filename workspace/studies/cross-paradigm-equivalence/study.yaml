implementation_status: complete
evaluation_status: evaluated
gate_status: passed
execution_status: completed
verdict: supported
design_status: drafted
title: "Cross-paradigm equivalence: fate yes, exact position no, and the test has power"
kind: comparison
confidence: Investigating
investigation: influenza-crossparadigm

claim: >
  Run through `blueprint_pipeline` on CPM, vertex and center-based (viva-munk), the ONE
  Sego 2022 blueprint gives backend-neutral cell FATE and backend-specific exact POSITION,
  and the equivalence test is powerful enough to tell them apart. FATE agreement is
  statistically EQUIVALENT for every backend pair within a pre-declared +/-0.05 margin
  (run-cluster 90% CI [-0.0034, +0.0008] for cpm-vertex). Exact-position agreement is NOT
  equivalent for any pair at +/-0.10, and it orders by how different the geometries are:
  cpm-munk +0.093 < cpm-vertex +0.126 < vertex-munk +0.252 (the cpm-munk point estimate
  sits below the 0.10 margin but its CI [0.034, 0.159] does not fit inside +/-0.10, so
  equivalence still cannot be claimed). A mechanics-dominated positive-control arm
  REJECTS equivalence for every pair with the same test (cpm-vertex Delta +0.325), so a
  "pass" on fate is informative. Judged against the same-backend seed null, the N=400
  capstone fate metric fails to reject a substrate difference, while infected-patch
  occupancy IoU and patch location now sit outside both same-backend baselines for the
  current vertex substrate: a candidate substrate signal, not causally attributed.

experiment: >
  Three arms, one machinery. (A) EQUIVALENCE GRID: run the full Sego blueprint on ALL
  THREE paradigms over rules-seeds {0..5} (N=120). For EACH backend pair (cpm-vertex,
  cpm-munk, vertex-munk) compute, per metric, the same-backend agreement (within-backend
  seed pairs of both members) and the cross-backend agreement (all 36 seed pairs); apply
  metrics.equivalence_tost (Welch TOST) + a run-cluster bootstrap against a pre-declared
  margin: +/-0.05 for fate agreement, +/-0.10 for the strict exact-position spatial
  agreement (centroids within one cell diameter, 5 um); split by cell class
  (epithelium / immune). (B) NULL-CONTROL CAPSTONE: compile the Sego blueprint onto CPM
  and vertex at a reduced scale (50x50-site patch, 6x6 epithelial block + 12-cell latent
  immune pool); for 3 CPM x 3 vertex rules-seeds at N=400 (and a lighter N=150 CI
  behavior test) compute per-cell fate agreement, infected-patch occupancy IoU and
  centroid distance, final epithelial area ratio and the vertex I-count's fraction
  inside the CPM >=3-seed stochastic envelope, each RELATIVE to the same-backend
  baselines (scripts/regen_capstone_metrics.py); render spatial_playback,
  dynamics_overlay and divergence maps (the center-based paradigm is a third panel /
  series). (C) POSITIVE CONTROL: run a mechanics-only blueprint
  (workspace/blueprints/mechanics_divergence.yaml: types A/B, A self-adhesive and
  repelled by B, a chemo field secreted by B with strong chemotaxis on A) on all three
  paradigms over rules-seeds {0,1,2} (N=80) and apply the SAME equivalence_tost (margin
  +/-0.10). Figures and results JSON are regenerated by scripts/regen_equivalence.py
  and scripts/render_study_figures.py.

result: >
  (A) EQUIVALENCE GRID (N=120, seeds {0..5}, 2026-11-05; results/equivalence.json).
  cpm-vertex FATE same 0.9887 / cross 0.9901, Delta -0.0014, pair CI [-0.0045, +0.0016],
  cluster CI [-0.0034, +0.0008] -> EQUIVALENT; cpm-munk Delta -0.0002 and vertex-munk
  Delta 0.0000, all inside +/-0.05. cpm-vertex SPATIAL same 0.6736 / cross 0.5475, Delta
  +0.1262, pair CI [+0.051, +0.201], cluster CI [+0.070, +0.181] -> NOT equivalent;
  cpm-munk Delta +0.093 (CI [0.034, 0.159]); vertex-munk Delta +0.252 (CI [0.181,
  0.323]). Ordering: cpm-munk +0.093 < cpm-vertex +0.126 < vertex-munk +0.252. Same-backend
  munk spatial agreement is now 0.307 (was 0.727) because the munk backend's motility now
  uses a per-instance seeded RNG (a reproducibility fix), so munk replicates vary more
  across rules-seeds; the qualitative conclusions are unchanged. By cell class (cpm-vertex): epithelium same 0.738 / cross 0.622 (Delta
  +0.116); immune same 0.481 / cross 0.324 (Delta +0.156). Median per-cell final-frame
  displacement: cross-backend ~5.7 um vs CPM-vs-CPM 5.2 um and vertex-vs-vertex 2.3 um.
  (B) N=400 NULL-CONTROL TABLE (3 CPM x 3 vertex seeds, in-sheet immune vertex substrate):
  fate agreement cross 0.948 (0.904-0.996) between same-backend CPM-vs-CPM 0.926
  [0.901-0.955] and vertex-vs-vertex 0.960 [0.950-0.976] -> fail to reject; infected-patch
  occupancy IoU cross 0.053 (0.005-0.150), BELOW both baselines (CPM 0.100, vertex 0.299);
  patch centroid distance 5.7 um cross (2.0-8.6) vs 3.3 um same-backend CPM (2.6-4.8);
  final mean EPITHELIAL area CPM 23.42 vs vertex 21.98 (ratio 0.94); vertex (seed 0)
  I-count inside the CPM 3-seed envelope at 55% of steps (100% at N=150); 74 vertex
  neighbour exchanges. At the CI scale (N=150): cross fate 0.987 vs same-backend CPM
  0.976, area ratio 0.96. Earlier (overlay-immune vertex substrate, superseded): fate
  0.938 between 0.926 / 0.944, IoU 0.135 between 0.100 / 0.175, centroid 3.6 vs 3.3 um,
  area ratio 0.94. (C) POSITIVE CONTROL (N=80, seeds {0,1,2};
  results/counterfactual-equivalence.json): cpm-vertex spatial same 0.775, cross 0.450,
  Delta +0.325 (pair CI [+0.116, +0.534]); cpm-munk Delta +0.317 (same 0.350,
  cross 0.033); vertex-munk Delta +0.569 (same 0.575, cross 0.006), all outside +/-0.10 -> equivalence REJECTED
  for every pair; the vertex run makes only 3 neighbour exchanges in 80 steps (vs 74 in
  the Sego run) because nothing shrinks a junction to the T1 threshold in this regime.
  Type-A mean y: CPM 11.0 -> 11.0, vertex 10.7 -> 10.1 (neither moves A far).

purpose:
  question: >
    Under replication, are the three mechanical substrates EQUIVALENT (not merely
    "not-distinguishable") on cell fate and on exact spatial position when one
    backend-neutral blueprint is run through `blueprint_pipeline`, and does the test
    correctly REJECT when mechanics (not the shared mechanism) drives the outcome?
  mechanism: >
    The epithelial rates, four reaction-diffusion fields, Price-2015 systemic ODE (fed
    live by CellCountStep) and latent-pool immune recruitment are compiled identically
    onto every backend; only the single mechanics node differs (CPM Metropolis flips,
    vertex tyssue relaxation, center-based hard-disc relaxation). Fate is driven by the
    shared mechanism, so it should be backend-neutral; exact position is set by each
    backend's own mechanics and should drift apart. If the substrate mattered beyond
    noise, cross-backend metrics would fall OUTSIDE the same-backend seed spread; in the
    mechanics-only control nothing shared forces agreement, so the test must reject.
  expected_outcome: >
    Fate: cross-backend agreement equivalent to the same-backend baseline within a
    small margin (positive TOST) for every pair. Spatial: a measurable, honestly
    reported gap that grows with geometric dissimilarity. Positive control: the same
    spatial test rejects.

key_assumptions:
  - "Equivalence margin is pre-declared, not fitted: +/-0.05 absolute fate agreement, +/-0.10 spatial agreement; neither is yet biologically justified."
  - "The same-backend seed-to-seed spread (with mechanics seeded per replicate, mechanics_seed = rules_seed) is the matched null; equivalence and every cross-backend metric are judged against it, never against zero."
  - "Spatial agreement is a STRICT exact-position metric (cohort centroids within 5 um = one cell diameter) at the final frame; it is a representation-sensitive readout by design."
  - "Reduced scale (50x50 patch, 6x6 epithelial block, N=120 grid / N=400 capstone), faithful Sego rates (no tuning); 1 grid unit = 1 um."
  - "Seed provenance: the N=400 table builds same-backend baselines from CPM seeds {0,1,2} AND vertex seeds {0,1,2} and the cross term from all 9 pairs; the lighter N=150 behavior test pins the relationship with CPM {0,1,2} vs vertex seed 0. Vertex is near-degenerate across rules-seeds at this scale (vertex-vs-vertex sd 0.006 vs CPM 0.025)."
  - "Immune recruitment is activation of a PRE-PLACED LATENT pool at the tissue margin; the systemic-ODE inputs V/L/C/F have no producer yet and sit at 0, so the immune arm is barely exercised at this scale."
  - "The center-based model is deliberately NOT calibrated to the other two (docs/mechanics.md), so it is a genuinely independent representation."
  - "The positive-control regime is mechanics-only (no rules/ODE/immune) with deliberately strong adhesion and chemotaxis knobs; nothing is tuned to hit a target, and the same metric/TOST/margin as the equivalence grid are used."

