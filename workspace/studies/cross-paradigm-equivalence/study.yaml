readouts:
  - name: fate_agreement
    description: Per-cell fate agreement (same-state fraction over the t0 cohort), per run pair.
    store_path: "mechanics/types"
    units: fraction
    status: measured
  - name: spatial_agreement
    description: Fraction of the t0 cohort whose final centroids are within 5 um between two runs.
    store_path: "mechanics/positions"
    units: fraction
    status: measured
  - name: vertex_inband_fraction
    description: Fraction of steps the vertex I-count trajectory lies inside the CPM >=3-seed stochastic envelope (non-circular dynamics check).
    store_path: "compare/dynamics"
    units: fraction
    status: measured
  - name: infected_patch_centroid_and_iou
    description: Infected-patch centroid distance and occupancy IoU, cross-backend vs same-backend baseline; with the final-frame epithelial area match that controls the representation confound.
    store_path: "compare/spatial_pattern"
    units: um / IoU
    status: measured
  - name: typeA_mean_final_y
    description: Mean final y of the migrating type-A population in the positive-control regime, per backend.
    store_path: "mechanics/positions"
    units: um
    status: measured

behavior_tests:
  - name: fate-equivalent-tost
    classification: primary
    description: Cross-backend fate agreement is TOST-equivalent to the same-backend baseline within +/-0.05, for every backend pair.
    measure: {kind: equivalence, field: fate_agreement, margin: 0.05}
    pass_if: {op: tost_equivalent, note: "90% CI of (same-cross) inside +/-0.05"}
    units: fraction
    requires_simulation: "true"
  - name: spatial-equivalence-rejected-in-mechanics-regime
    classification: primary
    description: The spatial equivalence TOST REJECTS in the mechanics-dominated positive-control regime (the test has power).
    measure: {kind: equivalence, field: spatial_agreement, margin: 0.10}
    pass_if: {op: tost_not_equivalent, note: "cross spatial agreement << same; diff > margin"}
    units: fraction
    requires_simulation: "true"
  - name: both-backends-run-end-to-end
    classification: primary
    description: The Sego blueprint (with named deviations) compiles and runs on both CPM and vertex for N coupled steps (N+1 frames) with the whole 48-cell cohort intact.
    measure: {kind: count, field: frames, when: end-of-run}
    pass_if: {op: eq, value: 151, field: n_frames_at_N150}
    units: frames
    requires_simulation: "true"
  - name: fate-agreement-within-seed-baseline
    classification: primary
    description: Cross-backend per-cell fate agreement is NOT meaningfully worse than the same-backend (CPM-vs-CPM) seed baseline -- judged against a null control rather than zero.
    measure: {kind: delta, field: fate_agreement, compare_to: same_backend_cpm_seed_baseline}
    pass_if: {op: gte, value: -0.05, field: cross_minus_baseline}
    units: fraction
    requires_simulation: "true"
  - name: spatial-not-representation-confounded
    classification: primary
    description: Final-frame mean epithelial cell areas match across backends (ratio ~1), so the occupancy comparison is a fair morphology comparison.
    measure: {kind: ratio, field: final_mean_area, versus: cpm}
    pass_if: {op: in_range, lo: 0.6, hi: 1.6, field: area_ratio}
    units: dimensionless
    requires_simulation: "true"
  - name: spatial-gap-is-dynamic-not-offset
    classification: secondary
    description: Cross-backend spatial agreement is high at t0 (measured 0.896, cpm0 vs vertex0) and drops to 0.583 by the final frame (so the gap is drift, not a systematic offset).
    measure: {kind: comparison, field: spatial_agreement, low: 0.0, high: 1.0}
    pass_if: {op: strictly_greater, note: "cross spatial(t0) > cross spatial(final)"}
    units: fraction
    requires_simulation: "true"
  - name: vertex-within-cpm-envelope
    classification: secondary
    description: The vertex I-count trajectory lies inside the CPM >=3-seed stochastic envelope for most steps (non-circular dynamics agreement).
    measure: {kind: fraction, field: inband}
    pass_if: {op: gte, value: 0.8, field: vertex_inband_fraction}
    units: fraction
    requires_simulation: "true"
  - name: three-figures-render-under-cap
    classification: secondary
    description: spatial_playback, dynamics_overlay (with the CPM-ensemble band) and divergence all render and serialize under the workbench inline cap.
    measure: {kind: size, field: figure_html_bytes}
    pass_if: {op: lt, value: 2500000, field: figure_html_bytes}
    units: bytes
    requires_simulation: "true"

controls:
  - name: same-backend-null
    kind: negative
    description: >
      The same-backend seed-to-seed pairs (mechanics seeded per replicate) are the matched
      null: no substrate change, so the only variation is RNG plus mechanical noise.
      Equivalence is judged relative to this spread, never to zero.
  - name: mechanics-dominated-positive-control
    kind: positive
    description: >
      The mechanics-only counterfactual arm (mechanics_divergence.yaml; strong differential
      adhesion + chemotaxis, no shared rules/ODE). The SAME spatial TOST and margin REJECT
      equivalence for every pair (cpm-vertex diff +0.325, cpm-munk +0.317, vertex-munk
      +0.569), proving the test can detect a real substrate difference. Its result
      (results/counterfactual-equivalence.json) is a visible control, not a separate claim.

alternative_hypotheses:
  - hypothesis: "The backends only look equivalent because the metric is insensitive."
    excluded_by: "The positive-control arm rejects equivalence with the same metric/test/margin -> the test has power."
  - hypothesis: "Fate agreement is high only by chance at one seed."
    excluded_by: "6 runs per backend resampled as clusters (run-cluster bootstrap); 90% CI [-0.0034, +0.0008]. The pair-level p was retired as overstated."
  - hypothesis: "The positive-control divergence is just seed noise."
    excluded_by: "Same-backend replicates differ mechanically (agreement 0.775) and the cross term (0.450) is still below them by more than the margin."
  - hypothesis: "The positive-control divergence is a raster/metric artifact."
    excluded_by: "Not yet excluded: with the migration readout no longer separating the substrates (A mean y 11.0 vs 10.1), the positional cause needs isolation (adhesion / gradient sweep)."

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "The shared-mechanism architecture is backend-neutral for cell FATE under replication across all three substrates, and the equivalence test has demonstrated power."
    biological_validation: "Fate outcomes transfer between Cellular-Potts, vertex and center-based substrates within seed noise; position does not, and mechanics-driven outcomes are substrate-sensitive -- use more than one backend and compare."
    pipeline_unblocks:
      - "Use any backend interchangeably for fate-level questions; report spatial results with their representation caveat."
      - "substrate-behavior-at-scale quantifies per-axis distances on the large tissue."
  if_primary_tests_fail:
    diagnose:
      - "If fate equivalence fails, the shared mechanism is not actually identical across backends -- check field byte-equality and rule wiring."
      - "If the positive control does NOT reject, the metric/margin is too insensitive -- tighten before trusting any equivalence verdict."
      - "Cross-backend falls OUTSIDE the same-backend seed envelope -- a substrate signal is real; inspect field-sampling / contact-surface coupling."
    block_downstream: "Do not report a cross-paradigm result without the same-backend null control."

limitations:
  - "Biological fidelity to Sego 2022 is NOT validated: a CPM self-envelope is an internal consistency check, not a match to digitized Sego figures or measured flu-lung data (BP-08)."
  - "'Runs the model' carries NAMED DEVIATIONS: V/L/C/F have no producer (sit at 0) and immune recruitment is a latent-pool approximation (BP-05); the immune arm is barely exercised at this scale."
  - "Reduced scale and modest steps (50x50, N=120 / N=400, 3-6 seeds): a demonstration, not paper scale; the epidemic is a slow onset at faithful rates, so any substrate signal is small relative to seed noise. Fate equivalence at larger/longer scale is a follow-up."
  - "The +/-0.05 fate and +/-0.10 spatial margins are pre-declared, not biologically justified (BP-06); a fail-to-reject on the capstone metrics is a null, not equality."
  - "Exact-position agreement is NOT equivalent for any pair, and the vertex epithelium wanders ~5x less than the CPM's (motility capped so the mesh never folds; see substrate-behavior-at-scale), which narrows the vertex-vs-vertex positional spread and contributes to the gap."
  - "The capstone IoU and patch-location metrics now separate the backends for the current vertex substrate (IoU 0.053 vs 0.100/0.299; 5.7 vs 3.3 um); this is a candidate substrate signal not yet causally attributed, and the dynamics band is the narrow CPM 3-seed envelope, not a Sego figure."
  - "The positive control is an artificial mechanics-only regime with a strong gradient + differential adhesion: it shows the test has POWER but not sensitivity to realistic influenza-relevant discrepancies; the cause of its divergence (sorting / positional dynamics) is not isolated and its fate is static. Power should be mapped by graded injected deviations (BP-06, BP-07)."
  - "Equivalence is on fate and exact centroid position; a morphology-level equivalence (shape / pattern) is not claimed. Immune contact differs by design (same-layer edge on CPM vs margin-attached polygon on vertex)."
  - "Parameters are the faithful Sego 2022 values (no tuning of the biology); the vertex MECHANICS knobs are calibrated to CPM behaviour, never to make fates agree."

report:
  title: "All three paradigms are EQUIVALENT on fate; none are on exact position; and the test has power"
  verdict: >
    SUPPORTED (every behavior_test passed on the real run; fate equivalent on all pairs, position not equivalent on any pair, positive control rejects on all 3 pairs). 
    The one Sego blueprint, compiled by `blueprint_pipeline`, runs on CPM, vertex and
    center-based and is scored pairwise over the 6-seed grid. FATE agreement is
    statistically EQUIVALENT for every pair (cpm-vertex diff -0.0014, run-cluster CI
    [-0.003, +0.001]; cpm-munk -0.0002; vertex-munk 0.0000; all inside +/-0.05): fate is
    rule-driven and so backend-independent. SPATIAL exact-position agreement is NOT
    equivalent for any pair at +/-0.10, and the gaps order
    cpm-munk +0.093 (CI [0.034, 0.159]) < cpm-vertex +0.126 (CI [0.070, 0.181]) <
    vertex-munk +0.252 (CI [0.181, 0.323]); the cpm-munk point estimate is below the 0.10
    margin but its CI is not inside it, so no pair is equivalent. (This ordering changed
    after the munk backend's motility moved to a per-instance seeded RNG: same-backend munk
    agreement fell 0.727 -> 0.307, so munk replicates vary more across rules-seeds; the
    qualitative conclusions are unchanged.) The test is not rigged to say "equivalent": in the
    mechanics-dominated positive control the same test REJECTS every pair (cpm-vertex
    +0.325, cpm-munk +0.317, vertex-munk +0.569). Against the same-backend null at N=400,
    fate (cross 0.948 vs 0.926 / 0.960) fails to reject a substrate difference while
    infected-patch occupancy (IoU 0.053 vs 0.100 / 0.299) and location (5.7 vs 3.3 um)
    sit outside it on the current vertex substrate. Honest divergence, no tuning to force
    agreement.
  confidence: medium
  evidence_quality: preliminary
  main_insight: >
    A spatial equivalence test is only meaningful if the same-backend null contains
    mechanical noise (the old 1.00 baseline was an artifact of deterministic replicates)
    and if a positive control shows it can reject. Once both hold, the remaining
    positional disagreement tracks each substrate's mechanical representation (epithelial
    fluidity, disc relaxation), not a fate effect: the substrate changes where cells
    sit, not what they become.
  caveat: >
    Reduced scale; margins not biologically justified; 3-6 seeds; the vertex epithelium
    is less fluid than the CPM's; the immune arm is barely exercised (latent pool +
    producer-less ODE inputs); the positive control is an engineered extreme with an
    unisolated cause.

findings:
  - id: F1-fate-equivalent-all-pairs
    kind: computational
    status: confirms
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      Cross-backend fate agreement is equivalent to the same-backend baseline within +/-0.05
      for every backend pair under a run-cluster bootstrap (cpm-vertex diff -0.0014, 90%
      CI [-0.0034, +0.0008]; cpm-munk -0.0002; vertex-munk 0.0000).
    evidence:
      observed: "fate same 0.9887, cross 0.9901; cluster CI [-0.0034,+0.0008]"
      expected: {range: "cross within +/-0.05 of same"}
    explanation: "Fate is driven by the shared field/rule/ODE mechanism, identical across backends."
    next_action: "justify the margin biologically (BP-06); re-confirm at larger scale if a spatial-coupled rule is added."
    provenance:
      run_ids: [equivalence-grid]
  - id: F2-position-not-equivalent-orders-by-geometry
    kind: computational
    status: confirms
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      Exact-position agreement is not equivalent for any pair at +/-0.10 and orders by
      a spatial gap ordered cpm-munk +0.093 < cpm-vertex +0.126 < vertex-munk +0.252
      (cpm-munk's CI [0.034, 0.159] still does not fit inside +/-0.10; the ordering is not a
      simple geometric-dissimilarity ranking and shifted when munk motility became seeded).
      The cpm-vertex gap is not only the immune margin attachment: epithelium alone is also
      not equivalent (same 0.738, cross 0.622, Delta +0.116; immune-only Delta +0.156).
    evidence:
      observed: "spatial same 0.6736, cross 0.5475, cluster CI [+0.070, +0.181]; median displacement cross 5.7 / same CPM 5.2 / same vertex 2.3 um"
    explanation: "Immune motility and chemotaxis are calibrated, but the vertex epithelium is capped below CPM fluidity to keep the mesh valid, and the center-based model is uncalibrated."
    next_action: "a fold-aware vertex topology handler to raise epithelial fluidity; scale-aware spatial descriptors (BP-06)."
    provenance:
      run_ids: [equivalence-grid]
  - id: F3-positive-control-rejects
    kind: computational
    status: confirms
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      In the mechanics-dominated regime the spatial TOST rejects equivalence for every pair
      (cpm-vertex cross 0.450 vs same 0.775, diff +0.325; cpm-munk +0.317; vertex-munk
      +0.569), so a fate "pass" in the main arm is informative. The divergence is
      positional / sorting dynamics, not directed migration: neither substrate moves type A
      far up the gradient.
    evidence:
      observed: "spatial same 0.775, cross 0.450; A mean y CPM 11.0 -> 11.0, vertex 10.7 -> 10.1; N=80, seeds {0,1,2}; vertex neighbour exchanges 3"
      expected: {range: "cross << same; TOST rejects"}
    explanation: "Differential-adhesion sorting / positional dynamics differ between lattice Metropolis, vertex T1 rearrangement and free-disc relaxation; not yet isolated."
    next_action: "sweep adhesion contrast and gradient strength to map where equivalence breaks (BP-06/BP-07)."
    provenance:
      run_ids: [counterfactual-divergence]
  - id: F4-capstone-fate-within-seed-noise-position-metrics-separate
    kind: computational
    status: partial
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      At N=400 on the current vertex substrate, cross-backend fate agreement (0.948) lies
      between the same-backend baselines (0.926 / 0.960), but infected-patch occupancy IoU
      (0.053 vs 0.100 / 0.299) and patch location (5.7 vs 3.3 um) fall outside them: a
      candidate substrate signal, not causally attributed. Final epithelial areas match
      (ratio 0.94).
    evidence:
      observed: "N=400: fate cross 0.948 vs CPM 0.926 / vertex 0.960; IoU 0.053 vs 0.100 / 0.299; centroid 5.7 vs 3.3 um; area ratio 0.94; N=150 cross 0.987 vs same 0.976"
    explanation: "Fate is computed by the shared mechanism; the substrate enters only via field sampling + contact surface and via each backend's cell motility."
    next_action: "more seeds + larger scale; V/L/C/F producers (BP-05)."
    provenance:
      run_ids: [crossparadigm-nullcontrol-N400, crossparadigm-ci-N150]
  - id: F5-late-dynamics-candidate-signal
    kind: computational
    status: partial
    statement: >
      The vertex I-count stays inside the CPM 3-seed envelope at 100% of steps to N=150 but
      only 55% by N=400 -- a candidate late-dynamics substrate signal, not yet separated
      from the narrowness of a 3-seed envelope.
    evidence:
      observed: "vertex in-band 0.551 at N=400, 1.0 at N=150"
    explanation: "Infection spread later in the run may depend on each substrate's cell motility and contact geometry."
    next_action: "widen the envelope with more CPM seeds; compare against a vertex-seed envelope."
    provenance:
      run_ids: [crossparadigm-nullcontrol-N400]
  - id: F6-slow-epidemic-at-faithful-rates
    kind: methodological
    status: confirms
    statement: >
      At faithful Sego rates the per-step infection probability is ~0.004 and the ODE
      recruitment inflow rounds to ~0 activations, so at reduced scale the epidemic is a
      slow onset and the latent immune pool is barely activated.
    evidence:
      observed: "virus-field integral grows 0 -> ~180 over 400 steps; H/I/D ~30/5/1 (CPM); activations = 0"
    explanation: "Faithful rates + reduced scale + producer-less ODE inputs -> weak drive; not tuned up (anti-goal)."
    next_action: "add the V/L/C/F producers and/or run longer; keep rates faithful."
    provenance:
      run_ids: [crossparadigm-nullcontrol-N400]
  - id: F7-superseded-readings
    kind: methodological
    status: informational
    statement: >
      SUPERSEDED READINGS, kept for provenance. (a) Spatial same 1.000 / cross 0.083 (median
      drift ~8.5 um) was an artifact of mechanically deterministic replicates and
      non-moving vertex cells; the 2026-10-28 reading was same 0.608 / cross 0.472, Delta
      +0.135, CI [+0.071, +0.210]. (b) The positive-control "vertex climbs the gradient to
      y~17.9, CPM ~10.7" mechanism (cross 0.20 vs same 1.00, diff +0.80) came from the old
      uncalibrated linear ActiveMigration mapping. (c) Earlier candidate substrate signals
      (raw IoU cross 0.165 vs CPM 0.249 / vertex 0.212; centroid 6.1 vs 5.4 um) came from
      deterministic or over-mobile (folding) vertex replicates.
    evidence:
      observed: "see simulation_set superseded entries and results/*.json"
    explanation: "Each reading was retired once the null control carried mechanical noise and the vertex chemotaxis was calibrated."
    next_action: "none"
    provenance:
      run_ids: [equivalence-grid, counterfactual-divergence, crossparadigm-nullcontrol-N400]

