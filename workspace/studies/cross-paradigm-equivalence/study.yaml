    status: completed
    base_model: viva_multicell_blueprint.composites.pipeline.blueprint_pipeline
    seeds: [0, 1, 2, 3, 4, 5]
    metrics:
      fate_same_mean: 0.9887
      fate_cross_mean: 0.9901
      fate_tost_diff: -0.0014
      fate_tost_ci: "[-0.0045, +0.0016]"
      fate_tost_margin: 0.05
      fate_equivalent: true
      fate_cluster_ci: "[-0.0034, +0.0008] (run-cluster bootstrap, PRIMARY)"
      fate_diff_cpm_munk: -0.0002
      fate_diff_vertex_munk: 0.0000
      fate_margin_biologically_justified: false
      spatial_same_mean: 0.674
      spatial_cross_mean: 0.547
      spatial_diff: 0.126
      spatial_cluster_ci: "[+0.070, +0.181]"
      spatial_equivalent: false
      spatial_diff_cpm_munk: "+0.093 (CI [0.034, 0.159])"
      spatial_diff_vertex_munk: "+0.252 (CI [0.181, 0.323])"
      spatial_epithelium_same_cross: "0.738 / 0.622 (diff +0.116)"
      spatial_immune_same_cross: "0.481 / 0.324 (diff +0.156)"
      median_displacement_cross_um: 5.7
      median_displacement_same_vertex_um: 2.3
      median_displacement_same_cpm_um: 5.2
      mechanics_seeded_per_replicate: true
      vertex_substrate: "hex sheet + in-sheet immune polygons attached at the margin, reconnect p_4=1 / T1 0.2 side, re-calibrated (2026-11-05)"
      superseded_spatial: "same 1.000 / cross 0.083 (deterministic-mechanics replicates, old vertex substrate); 2026-10-28: same 0.608 / cross 0.472, Delta +0.135, CI [+0.071, +0.210]"
    pass_fail_tests:
      - 'fate-equivalent-tost: pass (all three pairs)'
      - 'spatial-equivalent: fail (cpm-vertex diff 0.126, cluster CI [+0.070, +0.181] vs margin 0.10; cpm-munk and vertex-munk larger)'
  - name: crossparadigm-nullcontrol-N400
    status: completed
    base_model: viva_multicell_blueprint.composites.pipeline.blueprint_pipeline
    seeds: [0, 1, 2]
    metrics:
      fate_agreement_cross: "0.948 (0.904-0.996)"
      fate_agreement_same_backend_cpm: "0.926 (0.901-0.955)"
      fate_agreement_same_backend_vertex: "0.960 (0.950-0.976)"
      patch_centroid_dist_cross_um: 5.68
      patch_centroid_dist_same_cpm_um: 3.33
      infected_patch_iou_cross: 0.053
      infected_patch_iou_same_cpm: 0.100
      infected_patch_iou_same_vertex: 0.299
      vertex_inband_fraction: 0.551
      final_mean_epithelial_area_cpm: 23.42
      final_mean_epithelial_area_vertex: 21.98
      vertex_neighbour_exchanges: 74
      mechanics_seeded_per_replicate: true
