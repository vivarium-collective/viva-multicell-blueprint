conditions:
  baseline:
    name: sego-equivalence-grid
    composite: viva_multicell_blueprint.composites.pipeline.blueprint_pipeline
    description: The Sego blueprint compiled by blueprint_pipeline onto each backend over a rules-seed grid, scored for same- vs cross-backend agreement.
    params:
      backend: cpm
      blueprint: workspace/blueprints/influenza_sego2022.yaml
  variants:
    - name: seed-grid-6x6
      description: rules-seeds {0,1,2,3,4,5} on each backend -> 30 same-backend pairs + 36 cross-backend pairs per pair of paradigms.
      params: {}
      composite: viva_multicell_blueprint.composites.pipeline.blueprint_pipeline
    - name: mechanics-dominated-control
      description: The mechanics-only blueprint (adhesion + chemotaxis only, no shared rules/ODE) on each backend over rules-seeds {0,1,2}; the positive control.
      params: {blueprint: workspace/blueprints/mechanics_divergence.yaml}
      composite: viva_multicell_blueprint.composites.pipeline.blueprint_pipeline
  model_settings: []
inputs: []
question: >
  Under replication, are CPM, vertex and center-based EQUIVALENT (not merely
  "not-distinguishable") when one blueprint is run through `blueprint_pipeline` -- on cell
  fate, on exact spatial position, or both -- and does the test correctly reject when
  mechanics dominates?
